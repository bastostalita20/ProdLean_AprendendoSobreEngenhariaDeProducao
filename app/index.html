<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f8a4c">
<meta name="description" content="Curso gamificado de Engenharia de Produção: trilha, quiz relâmpago, revisão espaçada e flashcards.">
<title>EngProd Play</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
/* =====================================================================
   1. CORES E TEMA (claro/escuro)
   As cores do curso: 🔴 conceito · 🟡 atenção · 🟢 dica · 🔵 fórmula · 🟣 conexão
   ===================================================================== */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --surface-2: #eef1ec;
  --text: #1c2321;
  --muted: #5c6863;
  --border: #d9dfd9;
  --primary: #1f8a4c;       /* verde "engenharia" (botões principais) */
  --primary-dark: #166a39;
  --primary-soft: #dcf2e4;
  --gold: #e3a008;
  --locked: #c3cac5;
  /* código de cores do curso */
  --c-conceito: #d7263d;
  --c-atencao: #c98a00;
  --c-dica: #1f8a4c;
  --c-formula: #1d6fd1;
  --c-conexao: #7b4bc4;
  /* cores do Kahoot (fixas) */
  --k-red: #e21b3c;
  --k-blue: #1368ce;
  --k-yellow: #d89e00;
  --k-green: #26890c;
  --ok: #1f8a4c;
  --ok-soft: #dcf2e4;
  --err: #c62839;
  --err-soft: #fbe1e4;
  --shadow: 0 2px 0 rgba(0,0,0,.08);
  --radius: 16px;
  color-scheme: light;
}
/* Tema escuro automático (quando o celular está no modo escuro) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --surface: #1b2220; --surface-2: #242d2a; --text: #e8eeea; --muted: #9aa8a1;
    --border: #2f3a36; --primary: #2fae66; --primary-dark: #238a50; --primary-soft: #1d3a2a;
    --locked: #3a4642; --c-conceito: #ff5a6e; --c-atencao: #f0b429; --c-dica: #3fc47a;
    --c-formula: #5aa2ff; --c-conexao: #b28bff; --ok: #3fc47a; --ok-soft: #1d3a2a;
    --err: #ff6b7a; --err-soft: #3d2227; --shadow: 0 2px 0 rgba(0,0,0,.4); color-scheme: dark;
  }
}
/* Tema escuro escolhido manualmente nas configurações */
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1b2220; --surface-2: #242d2a; --text: #e8eeea; --muted: #9aa8a1;
  --border: #2f3a36; --primary: #2fae66; --primary-dark: #238a50; --primary-soft: #1d3a2a;
  --locked: #3a4642; --c-conceito: #ff5a6e; --c-atencao: #f0b429; --c-dica: #3fc47a;
  --c-formula: #5aa2ff; --c-conexao: #b28bff; --ok: #3fc47a; --ok-soft: #1d3a2a;
  --err: #ff6b7a; --err-soft: #3d2227; --shadow: 0 2px 0 rgba(0,0,0,.4); color-scheme: dark;
}

/* =====================================================================
   2. BASE
   ===================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.45;
  min-height: 100vh; overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.2; }
h1 { font-size: 1.4rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.05rem; }
p { margin: 0 0 .6rem; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 0 16px calc(84px + env(safe-area-inset-bottom)); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.hidden { display: none !important; }
.mt { margin-top: 12px; } .mb { margin-bottom: 12px; }

/* Barra superior (ofensiva, XP, vidas) */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
  padding: calc(10px + env(safe-area-inset-top)) 0 10px; border-bottom: 1px solid var(--border); margin-bottom: 14px;
}
.chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: .92rem; white-space: nowrap; }
.chip.off { opacity: .45; filter: grayscale(1); }

/* Navegação inferior */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--surface);
  border-top: 1px solid var(--border); display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-inner { display: flex; width: 100%; max-width: 560px; }
.nav a { flex: 1; text-align: center; text-decoration: none; color: var(--muted); padding: 8px 0 10px; font-size: .72rem; font-weight: 600; }
.nav a .ico { display: block; font-size: 1.45rem; line-height: 1.3; }
.nav a.active { color: var(--primary); }
.nav a.active .ico { transform: scale(1.12); }

/* Cartões e botões */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card.link { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
.card.link .big { font-size: 1.9rem; }
.btn {
  display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 800; letter-spacing: .02em;
  background: var(--primary); color: #fff; box-shadow: 0 4px 0 var(--primary-dark); text-transform: uppercase; font-size: .95rem;
  transition: transform .05s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary-dark); }
.btn:disabled { background: var(--locked); box-shadow: none; color: var(--muted); cursor: not-allowed; }
.btn.sec { background: var(--surface); color: var(--text); border: 2px solid var(--border); box-shadow: 0 3px 0 var(--border); }
.btn.danger { background: var(--err); box-shadow: 0 4px 0 #7d1522; }
.btn.small { padding: 9px 12px; font-size: .8rem; width: auto; display: inline-block; }
.btn + .btn { margin-top: 10px; }
.iconbtn { background: none; border: 0; font-size: 1.4rem; padding: 6px; border-radius: 10px; }
.progress { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress > div { height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s; }
.progress.gold > div { background: var(--gold); }

/* =====================================================================
   3. TELA INICIAL
   ===================================================================== */
.hero { text-align: center; padding: 8px 0 4px; }
.hero .flame { font-size: 3.2rem; line-height: 1; }
.hero .streak-num { font-size: 2rem; font-weight: 900; }
.goal-ring { position: relative; width: 120px; height: 120px; margin: 6px auto; }
.goal-ring svg { transform: rotate(-90deg); }
.goal-ring .lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 10px; text-align: center; text-decoration: none; color: inherit; box-shadow: var(--shadow); position: relative; }
.tile .big { font-size: 1.8rem; display: block; }
.badge { position: absolute; top: 6px; right: 8px; background: var(--err); color: #fff; font-size: .72rem; font-weight: 800; border-radius: 999px; padding: 1px 7px; }

/* =====================================================================
   4. TRILHA (estilo Duolingo)
   ===================================================================== */
.mod-banner { border-radius: var(--radius); padding: 14px; margin: 18px 0 8px; color: #fff; background: var(--primary); box-shadow: 0 4px 0 var(--primary-dark); }
.mod-banner.locked { background: var(--locked); box-shadow: none; color: var(--muted); }
.mod-banner .row { justify-content: space-between; }
.path { display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 40px 0 8px; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit; }
.node .ball {
  width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1.9rem; background: var(--locked); box-shadow: 0 6px 0 rgba(0,0,0,.18); border: 4px solid transparent;
}
.node.done .ball { background: var(--gold); box-shadow: 0 6px 0 #a87400; }
.node.current .ball { background: var(--primary); box-shadow: 0 6px 0 var(--primary-dark); animation: pulse 1.6s infinite; }
.node .lbl { margin-top: 8px; font-size: .78rem; font-weight: 700; max-width: 140px; text-align: center; color: var(--muted); }
.node.current .lbl { color: var(--text); }
.node .start { position: absolute; top: -30px; background: var(--surface); border: 2px solid var(--border); color: var(--primary); font-weight: 900; font-size: .75rem; padding: 3px 10px; border-radius: 10px; white-space: nowrap; animation: bob 1.4s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* =====================================================================
   5. LIÇÃO, BLOCOS E QUESTÕES
   ===================================================================== */
.lesson-top { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 0 12px; position: sticky; top: 0; background: var(--bg); z-index: 20; }
.lesson-top .progress { flex: 1; }
.hearts { font-weight: 800; color: var(--err); white-space: nowrap; }
.bloco { border-left: 6px solid var(--muted); background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.bloco .tag { font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.bloco h3 { margin-bottom: 6px; }
.bloco.conceito { border-color: var(--c-conceito); } .bloco.conceito .tag { color: var(--c-conceito); }
.bloco.atencao { border-color: var(--c-atencao); } .bloco.atencao .tag { color: var(--c-atencao); }
.bloco.dica { border-color: var(--c-dica); } .bloco.dica .tag { color: var(--c-dica); }
.bloco.formula { border-color: var(--c-formula); } .bloco.formula .tag { color: var(--c-formula); }
.bloco.conexao { border-color: var(--c-conexao); } .bloco.conexao .tag { color: var(--c-conexao); }
.bloco.bobo, .bloco.serio, .bloco.mnemonico, .bloco.recall, .bloco.mapa { border-color: var(--border); }
.bloco.mapa pre { white-space: pre-wrap; font-size: .85rem; line-height: 1.2; margin: 0; overflow-x: auto; }
.reveal { margin-top: 10px; }
.q-enunciado { font-size: 1.15rem; font-weight: 700; margin: 6px 0 14px; }
.q-contexto { background: var(--surface-2); border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: .95rem; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 13px 14px; box-shadow: 0 3px 0 var(--border); font-weight: 600; }
.opt.sel { border-color: var(--c-formula); background: color-mix(in srgb, var(--c-formula) 12%, var(--surface)); box-shadow: 0 3px 0 var(--c-formula); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 var(--ok); }
.opt.bad { border-color: var(--err); background: var(--err-soft); box-shadow: 0 3px 0 var(--err); }
.opt:disabled { cursor: default; }
.vf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vf .opt { text-align: center; font-size: 1.05rem; padding: 18px; }
.blank { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--c-formula); text-align: center; font-weight: 800; color: var(--c-formula); padding: 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .opt { padding: 10px 14px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; }
.match .opt { font-size: .9rem; padding: 11px 10px; min-height: 52px; }
.match .opt.done { opacity: .35; border-color: var(--ok); box-shadow: none; }
.order-answer { min-height: 60px; border: 2px dashed var(--border); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.order-answer .opt { display: flex; gap: 8px; align-items: center; }
.order-answer .num { background: var(--c-formula); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; flex: none; }
.numinput { width: 100%; font-size: 1.4rem; padding: 12px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface); text-align: center; }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

/* Painel de feedback (sobe de baixo, estilo Duolingo) */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; justify-content: center; animation: up .2s; }
.sheet .inner { width: 100%; max-width: 560px; }
.sheet.ok { background: var(--ok-soft); border-top: 2px solid var(--ok); }
.sheet.bad { background: var(--err-soft); border-top: 2px solid var(--err); }
.sheet h3 { color: var(--ok); } .sheet.bad h3 { color: var(--err); }
.sheet .expl { white-space: pre-line; font-size: .95rem; max-height: 38vh; overflow: auto; }
.sheet.bad .btn { background: var(--err); box-shadow: 0 4px 0 #7d1522; }
@keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.footer-action { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom)); margin-top: 18px; }
.lesson-pad { padding-bottom: 260px; }

/* =====================================================================
   6. QUIZ RELÂMPAGO (estilo Kahoot)
   ===================================================================== */
.k-question { background: var(--surface); border-radius: var(--radius); padding: 16px; font-weight: 800; font-size: 1.15rem; text-align: center; box-shadow: var(--shadow); margin-bottom: 12px; min-height: 90px; display: flex; align-items: center; justify-content: center; }
.k-timer { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.k-timer .t { width: 52px; height: 52px; border-radius: 50%; background: #46178f; color: #fff; font-weight: 900; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; flex: none; }
.k-timer .progress > div { background: #46178f; transition: width .1s linear; }
.k-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.k-tile { border: 0; border-radius: 12px; color: #fff; font-weight: 800; padding: 16px 10px; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 0 rgba(0,0,0,.25); text-align: center; font-size: .95rem; }
.k-tile .shape { font-size: 1.6rem; line-height: 1; }
.k-tile.red { background: var(--k-red); } .k-tile.blue { background: var(--k-blue); }
.k-tile.yellow { background: var(--k-yellow); } .k-tile.green { background: var(--k-green); }
.k-tile.dim { opacity: .3; }
.k-result { text-align: center; padding: 24px 12px; border-radius: var(--radius); color: #fff; margin-bottom: 12px; }
.k-result.ok { background: var(--k-green); } .k-result.bad { background: var(--k-red); }
.k-result .pts { font-size: 2rem; font-weight: 900; }
.rank { list-style: none; padding: 0; margin: 0; }
.rank li { display: flex; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); margin-bottom: 6px; font-weight: 600; }
.rank li:first-child { background: color-mix(in srgb, var(--gold) 30%, var(--surface)); }
.pass-screen { text-align: center; padding: 50px 10px; }
.pass-screen .big { font-size: 4rem; }

/* =====================================================================
   7. FLASHCARDS (virar carta)
   ===================================================================== */
.flip { perspective: 1000px; height: 300px; margin-bottom: 14px; }
.flip .inner { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.flip.on .inner { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; background: var(--surface); border: 2px solid var(--border); box-shadow: 0 6px 0 var(--border); display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; font-size: 1.15rem; font-weight: 700; overflow: auto; }
.flip .back { transform: rotateY(180deg); border-color: var(--c-formula); box-shadow: 0 6px 0 var(--c-formula); font-weight: 600; }
.flip .hint { position: absolute; bottom: 10px; left: 0; right: 0; font-size: .75rem; color: var(--muted); font-weight: 600; }
.self-eval { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.self-eval .btn { padding: 12px 6px; font-size: .8rem; }

/* =====================================================================
   8. CONQUISTAS, PERFIL, GRÁFICOS
   ===================================================================== */
.ach { display: flex; gap: 12px; align-items: center; }
.ach .ico { font-size: 2rem; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--surface-2); flex: none; }
.ach.locked .ico { filter: grayscale(1); opacity: .35; }
.ach.locked .nm { color: var(--muted); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
.stat .v { font-size: 1.5rem; font-weight: 900; }
.stat .l { font-size: .8rem; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-top: 18px; border-bottom: 1px solid var(--border); }
.bars .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; }
.bars .b .fill { width: 100%; max-width: 22px; background: var(--primary); border-radius: 4px 4px 0 0; min-height: 2px; }
.bars .b.today .fill { background: var(--gold); }
.bars .b .val { position: absolute; top: -2px; font-size: .68rem; font-weight: 700; color: var(--text); }
.bars-x { display: flex; gap: 4px; }
.bars-x span { flex: 1; text-align: center; font-size: .62rem; color: var(--muted); }
.hbar { margin-bottom: 10px; }
.hbar .top { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 600; margin-bottom: 3px; }
.hbar .progress { height: 10px; }
.level-card { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: 0; }
.level-card .progress { background: rgba(255,255,255,.25); }
.level-card .progress > div { background: #fff; }

/* Configurações */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 70px; padding: 10px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); font-weight: 700; }
.seg button.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
textarea { width: 100%; min-height: 90px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); padding: 10px; font-family: ui-monospace, monospace; font-size: .75rem; color: var(--text); }
input[type="text"] { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); }
input[type="range"] { width: 100%; }

/* Toast (aviso rápido) e confete */
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 60; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 92vw; text-align: center; animation: drop .25s; }
@keyframes drop { from { transform: translate(-50%, -30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
.errbox { background: var(--err-soft); color: var(--err); border: 2px solid var(--err); border-radius: 12px; padding: 10px; font-size: .85rem; margin: 10px 0; white-space: pre-line; }
.listen-bar { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 35; display: flex; justify-content: center; padding: 0 16px; }
.listen-bar .inner { width: 100%; max-width: 560px; background: #46178f; color: #fff; border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.listen-bar button { background: rgba(255,255,255,.2); border: 0; color: #fff; border-radius: 10px; padding: 6px 10px; font-weight: 800; }

/* Níveis de estudo, capa da lição, glossário */
.lvl-cards { display: grid; gap: 10px; margin: 10px 0 14px; }
.lvl-card { text-align: left; border: 2px solid var(--border); border-radius: 14px; padding: 12px 14px; background: var(--surface); box-shadow: 0 3px 0 var(--border); width: 100%; }
.lvl-card.on { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 3px 0 var(--primary); }
.lvl-card .t { font-weight: 800; }
.lvl-card .st { float: right; font-size: .8rem; font-weight: 700; color: var(--ok); }
.chip-nivel { display: inline-block; font-size: .75rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; }
.node .lvls { font-size: .85rem; margin-top: 2px; letter-spacing: 2px; }
.node .lvls i { font-style: normal; opacity: .25; filter: grayscale(1); }

<script>
/* =====================================================================
   EngProd Play — lógica do app
   Tudo em JavaScript puro (sem bibliotecas). O progresso fica no
   localStorage do navegador. O conteúdo vem de window.MODULOS,
   preenchido pelos arquivos da pasta "conteudo/".
   ===================================================================== */
"use strict";

/* ---------------------------------------------------------------------
   CONFIGURAÇÕES GERAIS (pode ajustar à vontade)
   --------------------------------------------------------------------- */
const CHAVE_STORAGE = "engprod_play_v1";
const VIDAS_MAX = 5;
const INTERVALOS_REVISAO = [1, 2, 4, 8, 15]; // dias entre revisões → cai em D+1, D+3, D+7, D+15, D+30
const NOMES_REVISAO = ["D+1", "D+3", "D+7", "D+15", "D+30"];
const TEMPO_QUIZ = 20;         // segundos por pergunta no Quiz Relâmpago
const PERGUNTAS_QUIZ = 10;
const NIVEIS = [
  { xp: 0, nome: "Estagiário", icone: "🎒" },
  { xp: 150, nome: "Analista", icone: "📊" },
  { xp: 400, nome: "Engenheiro Júnior", icone: "🔧" },
  { xp: 800, nome: "Engenheiro Pleno", icone: "⚙️" },
  { xp: 1400, nome: "Engenheiro Sênior", icone: "🏅" },
  { xp: 2200, nome: "Gerente de Produção", icone: "🧭" },
  { xp: 3500, nome: "Diretor Industrial", icone: "👑" }
];
/* Níveis de ESTUDO de cada lição (diferentes dos níveis de carreira acima).
   A progressão é de profundidade, não de tamanho de texto:
   Fácil = fundamentos · Médio = aplicação · Difícil = aprofundamento/decisão. */
const NIVEIS_ESTUDO = {
  facil:   { nome: "Fácil",   sub: "Fundamentos",    icone: "🌱", ordem: 1, xp: 10, desc: "Conceitos desde o início, termos definidos, exemplos simples e exercícios diretos." },
  medio:   { nome: "Médio",   sub: "Aplicação",      icone: "🔧", ordem: 2, xp: 15, desc: "Fórmulas com legenda, exemplos numéricos, casos e comparação de métodos." },
  dificil: { nome: "Difícil", sub: "Aprofundamento", icone: "🧠", ordem: 3, xp: 20, desc: "Hipóteses, limitações, modelagem, trade-offs e decisões justificadas." },
  unico:   { nome: "Nível único", sub: "Ainda não dividido em níveis", icone: "📘", ordem: 1, xp: 10, desc: "Esta lição ainda não foi dividida em Fácil, Médio e Difícil." }
};
const ORDEM_NIVEIS = ["facil", "medio", "dificil"];
/* Conquistas gerais (as de cada módulo vêm dos arquivos de conteúdo) */
const CONQUISTAS_GERAIS = [
  { id: "primeira-licao", nome: "Primeiro Turno", icone: "🎒", descricao: "Concluiu a primeira lição." },
  { id: "licao-perfeita", nome: "Zero Defeito", icone: "💎", descricao: "Concluiu uma lição sem errar nada." },
  { id: "meta-diaria", nome: "Meta Batida", icone: "🎯", descricao: "Atingiu a meta diária de XP." },
  { id: "ofensiva-3", nome: "Caldeira Acesa", icone: "🔥", descricao: "3 dias de ofensiva." },
  { id: "ofensiva-7", nome: "7 Dias de Ofensiva", icone: "📅", descricao: "Uma semana inteira estudando." },
  { id: "ofensiva-30", nome: "Fábrica 24/7", icone: "🏭", descricao: "30 dias de ofensiva." },
  { id: "xp-500", nome: "Linha Aquecida", icone: "⚡", descricao: "Juntou 500 XP." },
  { id: "xp-2000", nome: "Alta Produtividade", icone: "🚀", descricao: "Juntou 2.000 XP." },
  { id: "quiz-perfeito", nome: "Relâmpago Perfeito", icone: "🌩️", descricao: "Acertou todas no Quiz Relâmpago." },
  { id: "combo-5", nome: "Combo x5", icone: "🔗", descricao: "5 acertos seguidos no Quiz Relâmpago." },
  { id: "revisor", nome: "Revisor Dedicado", icone: "🔁", descricao: "Acertou 20 perguntas na revisão espaçada." },
  { id: "cartas-50", nome: "Cartas na Mesa", icone: "🃏", descricao: "Revisou 50 flashcards." },
  { id: "grupo", nome: "Trabalho em Equipe", icone: "🤝", descricao: "Jogou um desafio em grupo." },
  { id: "ouvinte", nome: "Estudante do Ônibus", icone: "🎧", descricao: "Usou o modo Ouvir." },
  { id: "diretor", nome: "Diretor Industrial", icone: "👑", descricao: "Chegou ao nível máximo." },
  { id: "dificil-5", nome: "Raciocínio de Engenheiro", icone: "🧠", descricao: "Concluiu 5 lições no nível Difícil." }
];

/* ---------------------------------------------------------------------
   UTILITÁRIOS
   --------------------------------------------------------------------- */
const $ = (sel, raiz = document) => raiz.querySelector(sel);
const $$ = (sel, raiz = document) => Array.from(raiz.querySelectorAll(sel));
const app = () => document.getElementById("app");

// Data local no formato AAAA-MM-DD
function hoje(offsetDias = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDias);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function somarDias(dataStr, dias) {
  const [a, m, d] = dataStr.split("-").map(Number);
  const dt = new Date(a, m - 1, d + dias);
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
}
function embaralhar(lista) {
  const a = lista.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Protege contra HTML malicioso/quebrado e aplica **negrito**, *itálico* e quebras de linha
function esc(t) { return String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function fmt(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/\n/g, "<br>");
}
function numeroBR(n) { return Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 2 }); }

/* ---------------------------------------------------------------------
   ESTADO (progresso salvo no navegador)
   --------------------------------------------------------------------- */
function estadoInicial() {
  return {
    versao: 1,
    xpTotal: 0,
    xpPorDia: {},              // { "2026-09-23": 40 }
    ofensiva: { atual: 0, recorde: 0, ultimoDia: null, congeladoEm: null },
    vidas: VIDAS_MAX, diaVidas: hoje(),
    licoes: {},                // { "m01-l1": { data, acertos, total, vezes } }
    questoes: {},              // estatística por questão { acertos, erros }
    revisao: {},               // { idQuestao: { etapa, proxima } }
    revisadas: 0, dominadas: 0,
    cartas: {},                // flashcards { id: { caixa, proxima } }
    cartasVistas: 0,
    conquistas: {},            // { id: data }
    ranking: [],               // melhores pontuações do Quiz
    metaBatidaEm: null,
    config: { meta: 50, som: true, tema: "auto", velocidadeVoz: 1, nome: "Eu", nivel: "facil", porSessao: 6 }
  };
}
let S = carregar();
function carregar() {
  try {
    const bruto = localStorage.getItem(CHAVE_STORAGE);
    if (!bruto) return estadoInicial();
    return mesclar(estadoInicial(), JSON.parse(bruto));
  } catch (e) {
    console.warn("Não foi possível ler o progresso:", e);
    return estadoInicial();
  }
}
// Garante que campos novos (de versões futuras do app) existam
function mesclar(base, salvo) {
  const r = Object.assign({}, base, salvo);
  r.config = Object.assign({}, base.config, salvo.config || {});
  r.ofensiva = Object.assign({}, base.ofensiva, salvo.ofensiva || {});
  return r;
}
function salvar() {
  try { localStorage.setItem(CHAVE_STORAGE, JSON.stringify(S)); }
  catch (e) { toast("⚠️ Não consegui salvar o progresso neste navegador."); }
}

/* ---------------------------------------------------------------------
   CONTEÚDO: índices para achar módulos, lições e questões rapidamente
   --------------------------------------------------------------------- */
let MODS = [];            // módulos ordenados pela trilha
let LICOES = [];          // todas as lições em ordem
const Q = {};             // id -> questão (com .modulo e .licao)
const CARTAS = {};        // id -> flashcard
const errosConteudo = []; // problemas encontrados nos arquivos de conteúdo

function prepararConteudo() {
  MODS = (window.MODULOS || []).slice().sort((a, b) => (a.ordem ?? a.numero) - (b.ordem ?? b.numero));
  // Banco de questões extra (conteudo/banco-questoes.js): cada item diz em que lição entra
  (window.BANCO || []).forEach(item => {
    const l = MODS.flatMap(m => m.licoes || []).find(x => x.id === item.licao);
    if (!l) { errosConteudo.push(`Banco: lição "${item.licao}" não existe (questão ${item.id})`); return; }
    const q = Object.assign({}, item); delete q.licao;
    (l.questoes = l.questoes || []).push(q);
  });
  const ids = new Set();
  MODS.forEach(m => {
    if (!m.id || !Array.isArray(m.licoes)) { errosConteudo.push(`Módulo "${m.titulo || "?"}" sem id ou sem licoes.`); return; }
    m.licoes.forEach(l => {
      l.modulo = m.id;
      LICOES.push(l);
      (l.blocos || []).forEach(b => { if (b.nivel && !ORDEM_NIVEIS.includes(b.nivel)) errosConteudo.push(`${l.id}: bloco com nível inválido "${b.nivel}"`); });
      (l.questoes || []).forEach(q => {
        if (ids.has(q.id)) errosConteudo.push(`ID de questão repetido: ${q.id}`);
        ids.add(q.id);
        q.modulo = m.id; q.licao = l.id;
        validarQuestao(q);
        Q[q.id] = q;
      });
    });
    (m.flashcards || []).forEach(c => { c.modulo = m.id; CARTAS[c.id] = c; });
  });
}
function validarQuestao(q) {
  const erro = msg => errosConteudo.push(`${q.id}: ${msg}`);
  if (!q.pergunta) erro("falta 'pergunta'");
  if (["multipla", "lacuna", "caso"].includes(q.tipo)) {
    if (!Array.isArray(q.opcoes) || q.opcoes.length < 2) erro("precisa de 'opcoes' (lista)");
    else if (!(q.correta >= 0 && q.correta < q.opcoes.length)) erro("'correta' fora da lista de opções");
  } else if (q.tipo === "vf") { if (typeof q.correta !== "boolean") erro("'correta' deve ser true ou false"); }
  else if (q.tipo === "ligar") { if (!Array.isArray(q.pares) || q.pares.length < 2) erro("precisa de 'pares'"); }
  else if (q.tipo === "ordenar") { if (!Array.isArray(q.itens) || q.itens.length < 2) erro("precisa de 'itens'"); }
  else if (q.tipo === "calculo") { if (typeof q.resposta !== "number" && !q.variaveis) erro("'resposta' deve ser número"); }
  else if (q.tipo === "discursiva") { if (!q.respostaModelo) erro("discursiva precisa de 'respostaModelo'"); }
  else erro(`tipo desconhecido "${q.tipo}"`);
  if (q.nivel && !ORDEM_NIVEIS.includes(q.nivel)) erro(`nível inválido "${q.nivel}" (use facil, medio ou dificil)`);
  if (q.variaveis) Parametros.validar(q).forEach(msg => erro("modelo com números sorteados: " + msg));
  if (q.justificativas && (!q.opcoes || q.justificativas.length !== q.opcoes.length)) erro("'justificativas' deve ter o mesmo tamanho de 'opcoes'");
}
const modulo = id => MODS.find(m => m.id === id);
const licaoConcluida = id => !!S.licoes[id];
function licaoLiberada(id) {
  if (licaoConcluida(id)) return true;
  const i = LICOES.findIndex(l => l.id === id);
  if (i === 0) return true;
  if (i < 0) return false;
  // Trilha paralela: a 1ª lição de um módulo com "liberaApos" depende só desses módulos
  const m = modulo(LICOES[i].modulo);
  if (m && m.liberaApos && m.licoes[0].id === id)
    return [].concat(m.liberaApos).every(mid => { const pre = modulo(mid); return pre && moduloConcluido(pre); });
  return licaoConcluida(LICOES[i - 1].id);
}
/* Sorteio das questões da lição (banco de questões):
   prioriza as nunca vistas e as que você mais erra, variando os tipos. */
function selecionarQuestoes(pool, n) {
  if (!n || pool.length <= n) return embaralhar(pool);
  const peso = q => {
    const st = S.questoes[q.id];
    if (!st) return 3 + Math.random();
    return (st.erros > st.acertos ? 2 : 0) + (S.revisao[q.id] ? 1 : 0) + Math.random() * 1.5;
  };
  const ordem = pool.map(q => ({ q, p: peso(q) })).sort((a, b) => b.p - a.p);
  const escolhidas = [], tipos = new Set();
  ordem.forEach(x => { if (escolhidas.length < n && !tipos.has(x.q.tipo)) { escolhidas.push(x.q); tipos.add(x.q.tipo); } });
  ordem.forEach(x => { if (escolhidas.length < n && !escolhidas.includes(x.q)) escolhidas.push(x.q); });
  return embaralhar(escolhidas);
}
function moduloLiberado(m) { return m.licoes.length > 0 && licaoLiberada(m.licoes[0].id); }
function moduloConcluido(m) { return m.licoes.every(l => licaoConcluida(l.id)); }
function proximaLicao() { return LICOES.find(l => !licaoConcluida(l.id) && licaoLiberada(l.id)); }
/* ---- Níveis de estudo: helpers ----
   Um bloco/questão SEM "nivel" aparece em todos os níveis da lição.
   Uma lição sem nenhum item com "nivel" é tratada como "nível único". */
function niveisDaLicao(l) {
  const set = new Set();
  (l.blocos || []).concat(l.questoes || []).forEach(x => { if (x.nivel) set.add(x.nivel); });
  const lista = ORDEM_NIVEIS.filter(n => set.has(n));
  return lista.length ? lista : ["unico"];
}
function doNivel(lista, nivel) { return (lista || []).filter(x => nivel === "unico" || !x.nivel || x.nivel === nivel); }
// Campo que pode ser comum a todos os níveis (texto/lista) ou separado ({ facil, medio, dificil })
function porNivel(valor, nivel) {
  if (valor == null) return null;
  if (typeof valor === "string" || Array.isArray(valor)) return valor;
  return valor[nivel] ?? null;
}
function registroNivel(id, n) { const r = S.licoes[id]; return r && r.niveis ? r.niveis[n] : null; }
function nivelConcluido(id, n) { return n === "unico" ? licaoConcluida(id) : !!registroNivel(id, n); }
function moduloTemNiveis(m) { return m.licoes.some(l => niveisDaLicao(l)[0] !== "unico"); }
// O quiz usa só questões até o nível padrão escolhido
function nivelPermitido(q) { return !q.nivel || NIVEIS_ESTUDO[q.nivel].ordem <= (NIVEIS_ESTUDO[S.config.nivel] || NIVEIS_ESTUDO.facil).ordem; }
// Questões de módulos já liberados (para quiz e treino)
function questoesLiberadas(filtro) {
  return Object.values(Q).filter(q => licaoConcluida(q.licao) || licaoLiberada(q.licao)).filter(filtro || (() => true));
}

/* ---------------------------------------------------------------------
   XP, NÍVEL, OFENSIVA, VIDAS, META DIÁRIA
   --------------------------------------------------------------------- */
function nivelAtual(xp = S.xpTotal) {
  let n = 0;
  NIVEIS.forEach((nv, i) => { if (xp >= nv.xp) n = i; });
  return n;
}
function xpHoje() { return S.xpPorDia[hoje()] || 0; }
// Congelamento 🧊: se você faltou UM dia só, a ofensiva é salva (no máximo 1 vez a cada 7 dias).
// Isso evita o "quebrei a sequência, desisti de tudo".
function congelamentoDisponivel() {
  return !S.ofensiva.congeladoEm || S.ofensiva.congeladoEm <= hoje(-7);
}
function ofensivaVisivel() {
  const u = S.ofensiva.ultimoDia;
  if (u === hoje() || u === hoje(-1)) return S.ofensiva.atual;
  if (u === hoje(-2) && congelamentoDisponivel()) return S.ofensiva.atual; // será salva ao estudar hoje
  return 0; // faltou mais de um dia: a ofensiva quebrou
}
function ganharXP(qtd) {
  if (qtd <= 0) return;
  const nivelAntes = nivelAtual();
  S.xpTotal += qtd;
  S.xpPorDia[hoje()] = xpHoje() + qtd;
  // ofensiva: conta o dia no primeiro XP ganho
  if (S.ofensiva.ultimoDia !== hoje()) {
    const u = S.ofensiva.ultimoDia;
    if (u === hoje(-1)) S.ofensiva.atual++;
    else if (u === hoje(-2) && congelamentoDisponivel()) {
      S.ofensiva.atual++;
      S.ofensiva.congeladoEm = hoje(-1);
      toast("🧊 Congelamento usado: sua ofensiva foi salva!");
    } else S.ofensiva.atual = 1;
    S.ofensiva.ultimoDia = hoje();
    S.ofensiva.recorde = Math.max(S.ofensiva.recorde, S.ofensiva.atual);
    if (S.ofensiva.atual > 1) toast(`🔥 Ofensiva de ${S.ofensiva.atual} dias!`);
  }
  if (S.ofensiva.atual >= 3) desbloquear("ofensiva-3");
  if (S.ofensiva.atual >= 7) desbloquear("ofensiva-7");
  if (S.ofensiva.atual >= 30) desbloquear("ofensiva-30");
  if (S.xpTotal >= 500) desbloquear("xp-500");
  if (S.xpTotal >= 2000) desbloquear("xp-2000");
  // meta diária
  if (xpHoje() >= S.config.meta && S.metaBatidaEm !== hoje()) {
    S.metaBatidaEm = hoje();
    desbloquear("meta-diaria");
    setTimeout(() => { confete(); som("nivel"); toast("🎯 Meta diária batida!"); }, 600);
  }
  // subida de nível
  const nivelDepois = nivelAtual();
  if (nivelDepois > nivelAntes) {
    const nv = NIVEIS[nivelDepois];
    setTimeout(() => { confete(); som("nivel"); toast(`${nv.icone} Promoção! Agora você é ${nv.nome}!`); }, 1200);
    if (nivelDepois === NIVEIS.length - 1) desbloquear("diretor");
  }
  salvar();
}
// Vidas: recarregam por completo a cada novo dia; também voltam revisando
function atualizarVidasDoDia() {
  if (S.diaVidas !== hoje()) { S.vidas = VIDAS_MAX; S.diaVidas = hoje(); salvar(); }
}
function perderVida() { S.vidas = Math.max(0, S.vidas - 1); salvar(); }
function recuperarVida() { if (S.vidas < VIDAS_MAX) { S.vidas++; salvar(); return true; } return false; }

/* ---------------------------------------------------------------------
   CONQUISTAS
   --------------------------------------------------------------------- */
function todasConquistas() {
  return CONQUISTAS_GERAIS.concat(MODS.filter(m => m.conquista).map(m => m.conquista));
}
function desbloquear(id) {
  if (S.conquistas[id]) return;
  const c = todasConquistas().find(x => x.id === id);
  if (!c) return;
  S.conquistas[id] = hoje();
  salvar();
  setTimeout(() => { som("nivel"); toast(`${c.icone} Conquista: ${c.nome}!`); confete(); }, 900);
}

/* ---------------------------------------------------------------------
   REVISÃO ESPAÇADA (D+1, D+3, D+7, D+15, D+30)
   --------------------------------------------------------------------- */
// "Retenção confirmada": acertou de novo pelo menos 7 dias depois do 1º contato.
// É o que mais se aproxima de domínio real (concluir lição ≠ dominar).
function marcarRetencao(st, acertou) {
  if (!st.desde) st.desde = hoje();
  if (acertou && st.desde <= hoje(-7)) st.confirmada = true;
}
function registrarResposta(q, acertou) {
  const st = S.questoes[q.id] || (S.questoes[q.id] = { acertos: 0, erros: 0 });
  if (acertou) st.acertos++; else st.erros++;
  marcarRetencao(st, acertou);
  if (!acertou) S.revisao[q.id] = { etapa: 0, proxima: hoje(1) }; // errou → volta amanhã
  salvar();
}
function registrarRevisao(q, acertou) {
  const r = S.revisao[q.id] || { etapa: 0, proxima: hoje() };
  if (acertou) {
    r.etapa++;
    if (r.etapa >= INTERVALOS_REVISAO.length) { delete S.revisao[q.id]; S.dominadas++; }
    else { r.proxima = hoje(INTERVALOS_REVISAO[r.etapa]); S.revisao[q.id] = r; }
    S.revisadas++;
    if (S.revisadas >= 20) desbloquear("revisor");
  } else {
    S.revisao[q.id] = { etapa: 0, proxima: hoje(1) };
  }
  const st = S.questoes[q.id] || (S.questoes[q.id] = { acertos: 0, erros: 0 });
  if (acertou) st.acertos++; else st.erros++;
  marcarRetencao(st, acertou);
  salvar();
}
function revisoesPendentes() {
  return Object.keys(S.revisao).filter(id => Q[id] && S.revisao[id].proxima <= hoje());
}
function cartasPendentes(modId) {
  return Object.values(CARTAS).filter(c => (!modId || c.modulo === modId) && moduloLiberado(modulo(c.modulo)))
    .filter(c => !S.cartas[c.id] || S.cartas[c.id].proxima <= hoje());
}

/* ---------------------------------------------------------------------
   SONS (gerados pelo navegador, sem arquivos)
   --------------------------------------------------------------------- */
let audioCtx = null;
function som(tipo) {
  if (!S.config.som) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notas = {
      acerto: [[660, 0], [880, .09]],
      erro: [[220, 0], [180, .12]],
      nivel: [[523, 0], [659, .1], [784, .2], [1047, .3]],
      clique: [[440, 0]],
      tique: [[1200, 0]]
    }[tipo] || [[440, 0]];
    notas.forEach(([freq, atraso]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = tipo === "erro" ? "sawtooth" : "sine";
      o.frequency.value = freq;
      const t0 = audioCtx.currentTime + atraso;
      const dur = tipo === "tique" ? .05 : .16;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(tipo === "erro" ? .08 : .18, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + .02);
    });
  } catch (e) { /* sem áudio: tudo bem */ }
}

/* ---------------------------------------------------------------------
   CONFETE (animação de comemoração)
   --------------------------------------------------------------------- */
function confete() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ["#e21b3c", "#1368ce", "#d89e00", "#26890c", "#7b4bc4", "#ffffff"];
  const ps = Array.from({ length: 140 }, () => ({
    x: cv.width / 2, y: cv.height / 3, vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 4,
    r: Math.random() * 6 + 4, c: cores[Math.floor(Math.random() * cores.length)], a: Math.random() * 6
  }));
  const inicio = performance.now();
  (function quadro(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    });
    if (t - inicio < 2600) requestAnimationFrame(quadro); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(inicio);
}

/* ---------------------------------------------------------------------
   AVISO RÁPIDO (toast) — fila para não sobrepor
   --------------------------------------------------------------------- */
const filaToast = [];
let toastAtivo = false;
function toast(msg) { filaToast.push(msg); if (!toastAtivo) proximoToast(); }
function proximoToast() {
  const msg = filaToast.shift();
  if (!msg) { toastAtivo = false; return; }
  toastAtivo = true;
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.remove(); proximoToast(); }, 2300);
}

/* ---------------------------------------------------------------------
   VOZ: "Ouvir a lição" (síntese de voz do navegador, em português)
   --------------------------------------------------------------------- */
function limparParaFala(t) {
  return String(t || "").replace(/\*\*/g, "").replace(/\*/g, "")
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu, "")
    // símbolos de fórmulas lidos por extenso (estatística, matemática)
    .replace(/x̄/g, "x barra").replace(/ȳ/g, "y barra").replace(/ŷ/g, "y chapéu").replace(/μ₀/g, "mi zero")
    .replace(/μ/g, "mi").replace(/σ/g, "sigma").replace(/Σ/g, "soma de ").replace(/α/g, "alfa").replace(/β/g, "beta")
    .replace(/λ/g, "lambda").replace(/√/g, "raiz de ").replace(/²/g, " ao quadrado").replace(/±/g, " mais ou menos ")
    .replace(/≈/g, " aproximadamente ").replace(/≥/g, " maior ou igual a ").replace(/≤/g, " menor ou igual a ")
    .replace(/·/g, " vezes ").replace(/=/g, " igual a ")
    .replace(/ < /g, " menor que ").replace(/ > /g, " maior que ").replace(/[│├└┤┼─▁▂▃▄▆█┘┌┐]/g, " ")
    .replace(/→/g, ", ").replace(/÷/g, " dividido por ").replace(/×/g, " vezes ").replace(/≠/g, " diferente de ")
    .replace(/−/g, " menos ").replace(/%/g, " por cento").replace(/\n/g, ". ");
}
function vozPT() {
  const vozes = speechSynthesis.getVoices();
  return vozes.find(v => v.lang === "pt-BR") || vozes.find(v => v.lang && v.lang.startsWith("pt"));
}
function falar(partes, titulo = "Ouvindo…") {
  if (!("speechSynthesis" in window)) { toast("Seu navegador não tem leitura em voz alta 😕"); return; }
  speechSynthesis.cancel();
  // Divide em frases curtas: alguns celulares param de falar no meio de textos longos
  const lista = (Array.isArray(partes) ? partes : [partes]).map(limparParaFala)
    .flatMap(t => t.split(/(?<=[.!?:;])\s+/)).map(t => t.trim()).filter(t => t.replace(/[.\s]/g, ""));
  if (!lista.length) return;
  $("#listen-title").textContent = titulo;
  $("#listenbar").classList.remove("hidden");
  desbloquear("ouvinte");
  lista.forEach((txt, i) => {
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = "pt-BR"; u.rate = S.config.velocidadeVoz;
    const v = vozPT(); if (v) u.voice = v;
    if (i === lista.length - 1) u.onend = () => $("#listenbar").classList.add("hidden");
    speechSynthesis.speak(u);
  });
}
function textoFalaBloco(b) {
  if (b.tipo === "recall") return [b.pergunta, b.resposta];
  const partes = [b.titulo || "", b.texto];
  if (b.legenda) partes.push("Onde: " + b.legenda.map(([s, d]) => `${s}: ${d}`).join("; "));
  return partes;
}
function pararFala() { if ("speechSynthesis" in window) speechSynthesis.cancel(); $("#listenbar").classList.add("hidden"); }
document.getElementById("listen-stop").onclick = pararFala;
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {}; // força carregar as vozes

/* =====================================================================
   COMPONENTE: RENDERIZAR UMA QUESTÃO
   Usado na lição e na revisão. Chama aoResponder(acertou) após verificar.
   ===================================================================== */
function renderQuestao(q, cont, aoResponder) {
  q = Parametros.instanciar(q); // questões-modelo ganham números novos a cada vez
  cont.dataset.qid = q.id;      // identifica a questão exibida (útil para testes automáticos)
  cont._q = q;
  let resposta = null;     // resposta escolhida pelo usuário
  let pronto = () => resposta !== null;
  let corrigir;            // função que devolve true/false
  let html = "";
  if (q.tipo === "caso" && q.contexto) html += `<div class="q-contexto">🏭 ${fmt(q.contexto)}</div>`;
  const rotulos = { multipla: "Escolha a alternativa", vf: "Verdadeiro ou falso?", lacuna: "Complete a lacuna", ligar: "Ligue as colunas", ordenar: "Coloque em ordem", caso: "Mini estudo de caso", calculo: "Calcule", discursiva: "Questão discursiva (autoavaliação)" };
  html += `<div class="small muted">${q.nivel ? `<span class="chip-nivel">${NIVEIS_ESTUDO[q.nivel].icone} ${NIVEIS_ESTUDO[q.nivel].nome}</span> ` : ""}${q.parametrica ? `<span class="chip-nivel" title="Os números mudam a cada tentativa">🎲 números sorteados</span> ` : ""}<b>${rotulos[q.tipo] || ""}</b></div>`;

  // Discursiva: escreve (ou pensa) → vê resposta-modelo e critérios → autoavalia
  if (q.tipo === "discursiva") {
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div>
      <textarea id="disc" style="min-height:130px;font-family:inherit;font-size:.95rem" placeholder="Escreva sua resposta (ou pense nela com calma) antes de ver a resposta-modelo…"></textarea>
      <p class="small muted">✍️ Escrever a resposta fixa muito mais do que só ler. A correção é por autoavaliação honesta.</p>
      <div class="footer-action" id="disc-acao"><button class="btn" id="verificar">Ver resposta-modelo</button></div>`;
    cont.innerHTML = html;
    $("#verificar", cont).onclick = () => {
      $("#disc", cont).readOnly = true;
      $("#disc-acao", cont).outerHTML = `<div class="bloco dica mt"><div class="tag">📝 Resposta-modelo</div>${fmt(q.respostaModelo)}</div>
        ${q.criterios && q.criterios.length ? `<div class="bloco criterios"><div class="tag">✅ Critérios: marque o que sua resposta contemplou</div>
          ${q.criterios.map((c, i) => `<label><input type="checkbox" data-c="${i}"> <span>${fmt(c)}</span></label>`).join("")}</div>` : ""}
        ${q.explicacao ? `<p class="small muted">${fmt(q.explicacao)}</p>` : ""}
        <p class="small"><b>Como foi?</b> “Parcial” e “Errei” voltam na revisão espaçada.</p>
        <div class="self-eval mb" id="disc-aval">
          <button class="btn danger" data-a="0">😵 Errei</button>
          <button class="btn sec" data-a="1">😐 Parcial</button>
          <button class="btn" data-a="2">😎 Acertei</button>
        </div>`;
      som("clique");
      $$("#disc-aval [data-a]", cont).forEach(b => b.onclick = () => {
        const acertou = b.dataset.a === "2";
        som(acertou ? "acerto" : "erro");
        aoResponder(acertou);
      });
    };
    return;
  }

  if (q.tipo === "multipla" || q.tipo === "caso") {
    const ordem = embaralhar(q.opcoes.map((_, i) => i));
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div><div class="opts">` +
      ordem.map(i => `<button class="opt" data-i="${i}">${fmt(q.opcoes[i])}</button>`).join("") + `</div>`;
    cont.innerHTML = html;
    $$(".opt", cont).forEach(b => b.onclick = () => { $$(".opt", cont).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); resposta = +b.dataset.i; som("clique"); atualizarBotao(); });
    corrigir = () => {
      $$(".opt", cont).forEach(b => { b.disabled = true; if (+b.dataset.i === q.correta) b.classList.add("ok"); else if (b.classList.contains("sel")) b.classList.add("bad"); });
      return resposta === q.correta;
    };
  }
  else if (q.tipo === "vf") {
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div><div class="vf">
      <button class="opt" data-v="1">✅ Verdadeiro</button><button class="opt" data-v="0">❌ Falso</button></div>`;
    cont.innerHTML = html;
    $$(".opt", cont).forEach(b => b.onclick = () => { $$(".opt", cont).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); resposta = b.dataset.v === "1"; som("clique"); atualizarBotao(); });
    corrigir = () => {
      $$(".opt", cont).forEach(b => { b.disabled = true; const v = b.dataset.v === "1"; if (v === q.correta) b.classList.add("ok"); else if (b.classList.contains("sel")) b.classList.add("bad"); });
      return resposta === q.correta;
    };
  }
  else if (q.tipo === "lacuna") {
    const partes = String(q.pergunta).split("___");
    html += `<div class="q-enunciado">${fmt(partes[0])}<span class="blank" id="blank">&nbsp;?&nbsp;</span>${fmt(partes.slice(1).join("___"))}</div>
      <div class="chips">` + embaralhar(q.opcoes.map((_, i) => i)).map(i => `<button class="opt" data-i="${i}">${esc(q.opcoes[i])}</button>`).join("") + `</div>`;
    cont.innerHTML = html;
    $$(".opt", cont).forEach(b => b.onclick = () => { $$(".opt", cont).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); resposta = +b.dataset.i; $("#blank", cont).textContent = q.opcoes[resposta]; som("clique"); atualizarBotao(); });
    corrigir = () => {
      $$(".opt", cont).forEach(b => { b.disabled = true; if (+b.dataset.i === q.correta) b.classList.add("ok"); else if (b.classList.contains("sel")) b.classList.add("bad"); });
      return resposta === q.correta;
    };
  }
  else if (q.tipo === "ligar") {
    // Toque em um item da esquerda e depois no par da direita. Erros contam.
    let selEsq = null, feitos = 0, erros = 0;
    const esq = embaralhar(q.pares.map((_, i) => i)), dir = embaralhar(q.pares.map((_, i) => i));
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div><div class="match">
      <div class="col">${esq.map(i => `<button class="opt" data-l="${i}">${esc(q.pares[i][0])}</button>`).join("")}</div>
      <div class="col">${dir.map(i => `<button class="opt" data-r="${i}">${esc(q.pares[i][1])}</button>`).join("")}</div></div>
      <p class="small muted mt">Toque em um item da esquerda e depois no par da direita.</p>`;
    cont.innerHTML = html;
    pronto = () => feitos === q.pares.length;
    $$("[data-l]", cont).forEach(b => b.onclick = () => { if (b.disabled) return; $$("[data-l]", cont).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); selEsq = +b.dataset.l; som("clique"); });
    $$("[data-r]", cont).forEach(b => b.onclick = () => {
      if (b.disabled || selEsq === null) return;
      const bl = $(`[data-l="${selEsq}"]`, cont);
      if (+b.dataset.r === selEsq) {
        [b, bl].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; });
        feitos++; som("acerto");
      } else {
        erros++; som("erro"); b.classList.add("bad", "shake");
        setTimeout(() => b.classList.remove("bad", "shake"), 400);
      }
      selEsq = null; atualizarBotao();
    });
    corrigir = () => erros === 0;
  }
  else if (q.tipo === "ordenar") {
    let escolhidos = [];
    const banco = embaralhar(q.itens.map((_, i) => i));
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div><div class="order-answer" id="oa"></div><div class="opts" id="ob"></div>
      <p class="small muted">Toque nos itens na ordem certa. Toque de novo para remover.</p>`;
    cont.innerHTML = html;
    const desenhar = () => {
      $("#oa", cont).innerHTML = escolhidos.length ? escolhidos.map((i, p) => `<button class="opt" data-rem="${p}"><span class="num">${p + 1}</span>${esc(q.itens[i])}</button>`).join("") : `<span class="small muted" style="padding:10px">Sua sequência aparece aqui</span>`;
      $("#ob", cont).innerHTML = banco.filter(i => !escolhidos.includes(i)).map(i => `<button class="opt" data-add="${i}">${esc(q.itens[i])}</button>`).join("");
      $$("[data-rem]", cont).forEach(b => b.onclick = () => { escolhidos.splice(+b.dataset.rem, 1); som("clique"); desenhar(); atualizarBotao(); });
      $$("[data-add]", cont).forEach(b => b.onclick = () => { escolhidos.push(+b.dataset.add); som("clique"); desenhar(); atualizarBotao(); });
    };
    desenhar();
    pronto = () => escolhidos.length === q.itens.length;
    corrigir = () => {
      const ok = escolhidos.every((v, p) => v === p);
      $$("[data-rem]", cont).forEach((b, p) => { b.disabled = true; b.classList.add(escolhidos[p] === p ? "ok" : "bad"); });
      return ok;
    };
  }
  else if (q.tipo === "calculo") {
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div>
      <input class="numinput" id="num" inputmode="decimal" autocomplete="off" placeholder="Sua resposta${q.unidade ? " (" + esc(q.unidade) + ")" : ""}">
      <p class="small muted mt">🟢 Use vírgula ou ponto para decimais.</p>`;
    cont.innerHTML = html;
    const inp = $("#num", cont);
    inp.oninput = () => { const v = parseFloat(inp.value.replace(/\s/g, "").replace(",", ".")); resposta = isNaN(v) ? null : v; atualizarBotao(); };
    corrigir = () => {
      inp.disabled = true;
      const tol = q.tolerancia ?? Math.max(0.01, Math.abs(q.resposta) * 0.01);
      return Math.abs(resposta - q.resposta) <= tol;
    };
  }
  else {
    cont.innerHTML = `<div class="errbox">Tipo de questão desconhecido: ${esc(q.tipo)}</div>`;
    corrigir = () => true; pronto = () => true;
  }

  // Botão "Verificar" e painel de feedback
  const acao = document.createElement("div");
  acao.className = "footer-action";
  acao.innerHTML = `<button class="btn" id="verificar" disabled>Verificar</button>`;
  cont.appendChild(acao);
  const btn = $("#verificar", cont);
  function atualizarBotao() { btn.disabled = !pronto(); }
  atualizarBotao();
  btn.onclick = () => {
    if (!pronto()) return;
    const acertou = corrigir();
    acao.remove();
    som(acertou ? "acerto" : "erro");
    let expl = q.explicacao || "";
    if (q.tipo === "calculo") expl = `Resposta: ${numeroBR(q.resposta)} ${q.unidade || ""}\n\n${q.resolucao || ""}\n\n${expl}`;
    if (!acertou && ["multipla", "caso", "lacuna"].includes(q.tipo)) expl = `Correta: ${q.opcoes[q.correta]}\n\n${expl}`;
    // Por que cada alternativa está certa ou errada (quando o conteúdo traz "justificativas")
    if (q.justificativas) expl += "\n\n" + q.opcoes.map((o, i) => `${i === q.correta ? "✅" : "❌"} **${o}** — ${q.justificativas[i]}`).join("\n");
    if (!acertou && q.tipo === "ordenar") expl = `Ordem certa:\n${q.itens.map((t, i) => `${i + 1}. ${t}`).join("\n")}\n\n${expl}`;
    if (!acertou && q.tipo === "ligar") expl = `Você errou algum par no caminho.\n\n${expl}`;
    const sh = document.createElement("div");
    sh.className = "sheet " + (acertou ? "ok" : "bad");
    sh.innerHTML = `<div class="inner"><h3>${acertou ? "✅ Mandou bem!" : "❌ Quase!"}</h3>
      <div class="expl">${fmt(expl)}</div>
      <div class="row mt"><button class="iconbtn" id="ouvir-expl" aria-label="Ouvir explicação">🔊</button>
      <button class="btn grow" id="continuar-q">Continuar</button></div></div>`;
    document.body.appendChild(sh);
    $("#ouvir-expl", sh).onclick = () => falar(expl, "Explicação");
    $("#continuar-q", sh).onclick = () => { pararFala(); sh.remove(); aoResponder(acertou); };
    $("#continuar-q", sh).focus();
  };
}

/* =====================================================================
   TELA: LIÇÃO (conteúdo em blocos → exercícios → resultado)
   ===================================================================== */
const ROTULO_BLOCO = {
  conceito: "🔴 Conceito-chave", atencao: "🟡 Atenção", dica: "🟢 Dica prática", formula: "🔵 Fórmula",
  conexao: "🟣 Conexão", bobo: "😂 Exemplo do dia a dia", serio: "🏭 Na empresa", mnemonico: "🔊 Para memorizar",
  recall: "🤔 Antes de ler…", mapa: "🧠 Mapa mental", texto: "📖",
  contexto: "🏭 Por que isso importa", exemplo: "🧮 Exemplo resolvido", passos: "🛠️ Passo a passo",
  limitacao: "⚖️ Limitações e trade-offs", referencia: "📚 Para aprofundar"
};
function htmlBloco(b) {
  if (b.tipo === "recall") {
    return `<div class="bloco recall"><div class="tag">${ROTULO_BLOCO.recall}</div><h3>${fmt(b.pergunta)}</h3>
      <p class="small muted">Pense na sua resposta antes de revelar (recuperação ativa).</p>
      <button class="btn small sec" data-revelar>👀 Revelar</button><div class="reveal hidden">${fmt(b.resposta)}</div></div>`;
  }
  let corpo = b.tipo === "mapa" ? `<pre>${esc(b.texto)}</pre>` : fmt(b.texto);
  // Fórmulas com legenda das variáveis
  if (b.legenda) corpo += `<table class="legenda">${b.legenda.map(([sim, desc]) => `<tr><td>${esc(sim)}</td><td>${fmt(desc)}</td></tr>`).join("")}</table>`;
  // não repete o título quando ele é igual ao rótulo do bloco (ex.: "Por que isso importa")
  const repetido = b.titulo && (ROTULO_BLOCO[b.tipo] || "").toLowerCase().endsWith(String(b.titulo).toLowerCase());
  return `<div class="bloco ${b.tipo}"><div class="tag">${ROTULO_BLOCO[b.tipo] || ""}</div>${b.titulo && !repetido ? `<h3>${fmt(b.titulo)}</h3>` : ""}${corpo}</div>`;
}
/* Capa da lição: objetivos, pré-requisitos e escolha do nível */
function telaCapa(l) {
  const m = modulo(l.modulo);
  const niveis = niveisDaLicao(l);
  const unico = niveis[0] === "unico";
  let sel = niveis.includes(S.config.nivel) ? S.config.nivel : niveis[0];
  function desenhar() {
    const obj = porNivel(l.objetivos, sel) || [];

    const nq = S.config.porSessao ? Math.min(S.config.porSessao, nBanco) : nBanco;
    const nModelos = banco.filter(q => q.variaveis).length;
    const minutos = Math.max(3, Math.round(nb * 0.8 + nq * 0.9));
    const pre = l.prerequisitos || [];
    const sugerirFacil = !unico && sel !== "facil" && niveis.includes("facil") && !nivelConcluido(l.id, "facil");
    app().innerHTML = `<div class="lesson-top"><button class="iconbtn" id="voltar" aria-label="Voltar">✕</button>
        <div class="grow small muted">${m.icone} ${esc(m.titulo)}</div></div>
      <h1>${l.icone || "⭐"} ${esc(l.titulo)}</h1>
      ${unico
        ? `<div class="card small"><b>📘 Nível único.</b> <span class="muted">Esta lição ainda não foi dividida em Fácil, Médio e Difícil; o conteúdo corresponde aos fundamentos com alguma aplicação.</span></div>`
        : `<p class="small muted">Escolha o nível. Você pode refazer a lição em outro nível quando quiser.</p>
           <div class="lvl-cards">${niveis.map(n => {
             const r = registroNivel(l.id, n), N = NIVEIS_ESTUDO[n];
             return `<button class="lvl-card ${n === sel ? "on" : ""}" data-n="${n}">
               ${r ? `<span class="st">✓ ${r.melhor ?? Math.round(r.acertos / Math.max(1, r.total) * 100)}%</span>` : ""}

           }).join("")}</div>`}
      ${sugerirFacil ? `<div class="bloco atencao"><div class="tag">💡 Sugestão</div>Se o tema é novo para você, comece pelo <b>Fácil</b>. O ${NIVEIS_ESTUDO[sel].nome} pressupõe os fundamentos.</div>` : ""}
      ${obj.length ? `<div class="bloco conceito"><div class="tag">🎯 Ao final, você será capaz de</div><ul class="obj-list">${obj.map(o => `<li>${fmt(o)}</li>`).join("")}</ul></div>` : ""}
      ${pre.length ? `<div class="bloco conexao"><div class="tag">🧩 Pré-requisitos</div><ul class="obj-list">${pre.map(p => {
          const alvo = p.licao && LICOES.find(x => x.id === p.licao);
          const pode = alvo && licaoLiberada(alvo.id);
          return `<li>${fmt(p.texto)}${pode ? ` — <a href="#licao/${alvo.id}">revisar “${esc(alvo.titulo)}”</a>` : alvo ? " <span class='muted'>(lição ainda bloqueada)</span>" : ""}</li>`;
        }).join("")}</ul></div>` : ""}
      <p class="small muted">⏱️ ~${minutos} min · ${nb} blocos · ${nq} exercícios${nBanco > nq ? ` sorteados de um banco de ${nBanco}` : ""}${nModelos ? ` · 🎲 ${nModelos} com números que mudam a cada vez` : ""}${(m.glossario || []).length ? ` · <a href="#glossario/${m.id}">📖 glossário do módulo</a>` : ""}</p>
      <div class="footer-action"><button class="btn" id="comecar">Começar${unico ? "" : ` no ${NIVEIS_ESTUDO[sel].nome}`} ▶</button></div>`;
    $("#voltar").onclick = () => ir("trilha");
    $$(".lvl-card").forEach(b => b.onclick = () => { sel = b.dataset.n; som("clique"); desenhar(); });

}
function telaLicao(id, nivel) {
  const l = LICOES.find(x => x.id === id);
  if (!l) { ir("trilha"); return; }
  if (!licaoLiberada(id)) { toast("🔒 Lição bloqueada"); ir("trilha"); return; }
  if (!nivel || !niveisDaLicao(l).includes(nivel)) { telaCapa(l); return; }
  if (S.vidas <= 0) { semVidas(); return; }
  const m = modulo(l.modulo);
  const NV = NIVEIS_ESTUDO[nivel];
  const blocos = doNivel(l.blocos, nivel);
  const questoes = selecionarQuestoes(doNivel(l.questoes, nivel), S.config.porSessao);
  const totalPassos = blocos.length + questoes.length;
  let passo = 0, idxBloco = 0;
  const fila = questoes.slice();          // questões pendentes (erradas voltam para o fim)
  const jaErrou = new Set();
  let acertosPrimeira = 0;
  let saindo = false;

  function topo() {
    return `<div class="lesson-top">
      <button class="iconbtn" id="sair" aria-label="Sair">✕</button>
      <div class="progress"><div style="width:${Math.round(passo / totalPassos * 100)}%"></div></div>
      <span class="hearts">❤️ ${S.vidas}</span></div>`;
  }
  function ligarSair() {
    $("#sair").onclick = () => { if (confirm("Sair da lição? O progresso desta lição será perdido.")) { saindo = true; ir("trilha"); } };
  }
  // Fase 1: conteúdo, um bloco por vez (chunking)
  function mostrarBloco() {
    if (idxBloco >= blocos.length) { proximaQuestao(); return; }
    const b = blocos[idxBloco];
    app().innerHTML = topo() + `<div class="small muted mb">${m.icone} ${esc(m.titulo)} · ${esc(l.titulo)} ${nivel !== "unico" ? `<span class="chip-nivel">${NV.icone} ${NV.nome}</span>` : ""}</div>
      ${htmlBloco(b)}
      <div class="row"><button class="btn sec small" id="ouvir">🔊 Ouvir</button>
      <span class="grow small muted" style="text-align:right">${idxBloco + 1}/${blocos.length}</span></div>
      <div class="footer-action"><button class="btn" id="prox">${idxBloco + 1 < blocos.length ? "Próximo" : "Vamos praticar! 💪"}</button></div>`;
    ligarSair();
    const rv = $("[data-revelar]");
    if (rv) rv.onclick = () => { rv.nextElementSibling.classList.remove("hidden"); rv.remove(); som("clique"); };
    $("#ouvir").onclick = () => falar(textoFalaBloco(b), l.titulo);
    $("#prox").onclick = () => { pararFala(); idxBloco++; passo++; mostrarBloco(); window.scrollTo(0, 0); };
  }
  // Fase 2: exercícios
  function proximaQuestao() {
    if (!fila.length) { concluir(); return; }
    const q = fila.shift();
    app().innerHTML = topo() + `<div id="qarea" class="lesson-pad"></div>`;
    ligarSair();
    renderQuestao(q, $("#qarea"), acertou => {
      if (saindo) return;
      if (acertou) {
        if (!jaErrou.has(q.id)) { acertosPrimeira++; registrarResposta(q, true); }
        passo++;
      } else {
        if (!jaErrou.has(q.id)) registrarResposta(q, false);
        jaErrou.add(q.id);
        fila.push(q); // volta para o fim, como no Duolingo
        perderVida();
        if (S.vidas <= 0) { semVidas(); return; }
      }
      proximaQuestao();
      window.scrollTo(0, 0);
    });
  }
  function concluir() {
    const repetida = nivelConcluido(l.id, nivel);
    const perfeita = jaErrou.size === 0 && questoes.length > 0;
    const pct = questoes.length ? Math.round(acertosPrimeira / questoes.length * 100) : 100;
    const xp = (repetida ? 5 : NV.xp) + acertosPrimeira * 2 + (perfeita ? 5 : 0);
    const reg = S.licoes[l.id] || { vezes: 0 };
    reg.niveis = reg.niveis || {};
    const ant = reg.niveis[nivel];
    reg.niveis[nivel] = { data: hoje(), acertos: acertosPrimeira, total: questoes.length, vezes: (ant ? ant.vezes : 0) + 1, melhor: Math.max(ant ? ant.melhor || 0 : 0, pct) };
    Object.assign(reg, { data: hoje(), acertos: acertosPrimeira, total: questoes.length, vezes: reg.vezes + 1 });
    S.licoes[l.id] = reg;
    salvar();
    ganharXP(xp);
    desbloquear("primeira-licao");
    if (perfeita) desbloquear("licao-perfeita");
    if (LICOES.filter(x => nivelConcluido(x.id, "dificil")).length >= 5) desbloquear("dificil-5");
    if (moduloConcluido(m) && m.conquista) desbloquear(m.conquista.id);
    confete(); som("nivel");
    const prox = proximaLicao();
    const niveis = niveisDaLicao(l), idx = niveis.indexOf(nivel);
    const acima = niveis[idx + 1], abaixo = niveis[idx - 1];
    const resumo = porNivel(l.resumo, nivel);
    // Recomendação honesta a partir do desempenho (não do simples fato de concluir)
    let recomendacao = "";
    if (pct >= 80 && acima) recomendacao = `<div class="bloco dica" style="text-align:left"><div class="tag">📈 Próximo passo</div>Bom domínio neste nível (${pct}%). Quando quiser, aprofunde no <b>${NIVEIS_ESTUDO[acima].icone} ${NIVEIS_ESTUDO[acima].nome}</b>.</div>`;
    else if (pct < 60) recomendacao = `<div class="bloco atencao" style="text-align:left"><div class="tag">💡 Recomendação</div>Acerto de primeira abaixo de 60%. Releia o resumo abaixo${(l.prerequisitos || []).length ? ", confira os pré-requisitos na capa" : ""}${abaixo ? ` e considere refazer no <b>${NIVEIS_ESTUDO[abaixo].nome}</b>` : " e refaça a lição amanhã"}. As questões erradas voltam na revisão.</div>`;
    app().innerHTML = `<div class="center" style="padding-top:30px">
      <div style="font-size:4rem">${perfeita ? "💎" : "🎉"}</div>
      <h1>Lição concluída!</h1>
      <p class="muted">${esc(l.titulo)}${nivel !== "unico" ? ` · ${NV.icone} ${NV.nome}` : ""}</p>
      <div class="stat-grid mt mb">
        <div class="stat"><div class="v">+${xp}</div><div class="l">XP ganhos</div></div>
        <div class="stat"><div class="v">${pct}%</div><div class="l">acertos de primeira</div></div>
      </div>
      ${jaErrou.size ? `<p class="small muted">🔁 ${jaErrou.size} pergunta(s) que você errou voltarão na revisão em D+1.</p>` : `<p class="small muted">Zero defeito! Nenhum erro. 💎</p>`}
      ${recomendacao}
      ${resumo ? `<div class="bloco texto" style="text-align:left"><div class="tag">📝 Resumo da lição</div>${fmt(resumo)}
        <div class="mt"><button class="btn small sec" id="ouvir-resumo">🔊 Ouvir resumo</button></div></div>` : ""}
      ${prox ? `<button class="btn" id="seguir">Próxima lição ▶</button>` : ""}
      ${acima && pct >= 60 ? `<button class="btn sec" id="subir">${NIVEIS_ESTUDO[acima].icone} Fazer esta lição no ${NIVEIS_ESTUDO[acima].nome}</button>` : ""}
      <button class="btn sec" onclick="ir('trilha')">Voltar à trilha</button>
    </div>`;
    const s = $("#seguir");
    if (s) s.onclick = () => ir("licao/" + prox.id);
    const sb = $("#subir");
    if (sb) sb.onclick = () => ir(`licao/${l.id}/${acima}`);
    const orr = $("#ouvir-resumo");
    if (orr) orr.onclick = () => falar(resumo, "Resumo: " + l.titulo);
  }
  mostrarBloco();
}
function semVidas() {
  som("erro");
  app().innerHTML = `<div class="center" style="padding-top:50px">
    <div style="font-size:4rem">💔</div><h1>Acabaram as vidas</h1>
    <p class="muted">Recupere vidas revisando: cada acerto na revisão devolve ❤️ 1 vida. Amanhã elas recarregam sozinhas.</p>
    <button class="btn" onclick="ir('revisao/vidas')">🔁 Revisar para recuperar vidas</button>

}

/* =====================================================================
   TELA: REVISAR (central de revisão + flashcards)

  const agenda = {};
  Object.values(S.revisao).forEach(r => { if (r.proxima > hoje()) agenda[r.proxima] = (agenda[r.proxima] || 0) + 1; });
  const proximas = Object.keys(agenda).sort().slice(0, 5);
  const fracas = pontosFracos(5);
  app().innerHTML = barraTopo() + `<h1>🔁 Revisar</h1>
    <div class="card">
      <h2>Revisão espaçada</h2>
      <p class="muted small">Perguntas que você errou voltam em D+1, D+3, D+7, D+15 e D+30. Cada acerto: +3 XP e ❤️ +1 vida.</p>
      <div class="stat-grid mb">
        <div class="stat"><div class="v">${pend.length}</div><div class="l">para hoje</div></div>
        <div class="stat"><div class="v">${S.dominadas}</div><div class="l">dominadas (passaram do D+30)</div></div>
      </div>

      ${fracas.length ? `<button class="btn sec" onclick="ir('revisao/fracos')">🎯 Treinar meus pontos fracos</button>` : ""}

    <div class="card">
