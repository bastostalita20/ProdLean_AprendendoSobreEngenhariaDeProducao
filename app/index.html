<style>
/* =====================================================================
   1. CORES E TEMA (claro/escuro)
   As cores do curso: 🔴 conceito · 🟡 atenção · 🟢 dica · 🔵 fórmula · 🟣 conexão
   ===================================================================== */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --surface-2: #eef1ec;
  --text: #1c2321;
  --muted: #5c6863;
  --border: #d9dfd9;
  --primary: #1f8a4c;       /* verde "engenharia" (botões principais) */
  --primary-dark: #166a39;
  --primary-soft: #dcf2e4;
  --gold: #e3a008;
  --locked: #c3cac5;
  /* código de cores do curso */
  --c-conceito: #d7263d;
  --c-atencao: #c98a00;
  --c-dica: #1f8a4c;
  --c-formula: #1d6fd1;
  --c-conexao: #7b4bc4;
  /* cores do Kahoot (fixas) */
  --k-red: #e21b3c;
  --k-blue: #1368ce;
  --k-yellow: #d89e00;
  --k-green: #26890c;
  --ok: #1f8a4c;
  --ok-soft: #dcf2e4;
  --err: #c62839;
  --err-soft: #fbe1e4;
  --shadow: 0 2px 0 rgba(0,0,0,.08);
  --radius: 16px;
  color-scheme: light;
}
/* Tema escuro automático (quando o celular está no modo escuro) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --surface: #1b2220; --surface-2: #242d2a; --text: #e8eeea; --muted: #9aa8a1;
    --border: #2f3a36; --primary: #2fae66; --primary-dark: #238a50; --primary-soft: #1d3a2a;
    --locked: #3a4642; --c-conceito: #ff5a6e; --c-atencao: #f0b429; --c-dica: #3fc47a;
    --c-formula: #5aa2ff; --c-conexao: #b28bff; --ok: #3fc47a; --ok-soft: #1d3a2a;
    --err: #ff6b7a; --err-soft: #3d2227; --shadow: 0 2px 0 rgba(0,0,0,.4); color-scheme: dark;
  }
}
/* Tema escuro escolhido manualmente nas configurações */
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1b2220; --surface-2: #242d2a; --text: #e8eeea; --muted: #9aa8a1;
  --border: #2f3a36; --primary: #2fae66; --primary-dark: #238a50; --primary-soft: #1d3a2a;
  --locked: #3a4642; --c-conceito: #ff5a6e; --c-atencao: #f0b429; --c-dica: #3fc47a;
  --c-formula: #5aa2ff; --c-conexao: #b28bff; --ok: #3fc47a; --ok-soft: #1d3a2a;
  --err: #ff6b7a; --err-soft: #3d2227; --shadow: 0 2px 0 rgba(0,0,0,.4); color-scheme: dark;
}

/* =====================================================================
   2. BASE
   ===================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.45;
  min-height: 100vh; overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.2; }
h1 { font-size: 1.4rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.05rem; }
p { margin: 0 0 .6rem; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 0 16px calc(84px + env(safe-area-inset-bottom)); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.hidden { display: none !important; }
.mt { margin-top: 12px; } .mb { margin-bottom: 12px; }

/* Barra superior (ofensiva, XP, vidas) */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
  padding: calc(10px + env(safe-area-inset-top)) 0 10px; border-bottom: 1px solid var(--border); margin-bottom: 14px;
}
.chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: .92rem; white-space: nowrap; }
.chip.off { opacity: .45; filter: grayscale(1); }

/* Navegação inferior */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--surface);
  border-top: 1px solid var(--border); display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-inner { display: flex; width: 100%; max-width: 560px; }
.nav a { flex: 1; text-align: center; text-decoration: none; color: var(--muted); padding: 8px 0 10px; font-size: .72rem; font-weight: 600; }
.nav a .ico { display: block; font-size: 1.45rem; line-height: 1.3; }
.nav a.active { color: var(--primary); }
.nav a.active .ico { transform: scale(1.12); }

/* Cartões e botões */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card.link { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
.card.link .big { font-size: 1.9rem; }
.btn {
  display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 800; letter-spacing: .02em;
  background: var(--primary); color: #fff; box-shadow: 0 4px 0 var(--primary-dark); text-transform: uppercase; font-size: .95rem;
  transition: transform .05s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary-dark); }
.btn:disabled { background: var(--locked); box-shadow: none; color: var(--muted); cursor: not-allowed; }
.btn.sec { background: var(--surface); color: var(--text); border: 2px solid var(--border); box-shadow: 0 3px 0 var(--border); }
.btn.danger { background: var(--err); box-shadow: 0 4px 0 #7d1522; }
.btn.small { padding: 9px 12px; font-size: .8rem; width: auto; display: inline-block; }
.btn + .btn { margin-top: 10px; }
.iconbtn { background: none; border: 0; font-size: 1.4rem; padding: 6px; border-radius: 10px; }
.progress { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress > div { height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s; }
.progress.gold > div { background: var(--gold); }

/* =====================================================================
   3. TELA INICIAL
   ===================================================================== */
.hero { text-align: center; padding: 8px 0 4px; }
.hero .flame { font-size: 3.2rem; line-height: 1; }
.hero .streak-num { font-size: 2rem; font-weight: 900; }
.goal-ring { position: relative; width: 120px; height: 120px; margin: 6px auto; }
.goal-ring svg { transform: rotate(-90deg); }
.goal-ring .lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 10px; text-align: center; text-decoration: none; color: inherit; box-shadow: var(--shadow); position: relative; }
.tile .big { font-size: 1.8rem; display: block; }
.badge { position: absolute; top: 6px; right: 8px; background: var(--err); color: #fff; font-size: .72rem; font-weight: 800; border-radius: 999px; padding: 1px 7px; }

/* Hub, abas, períodos, conteúdo e mapas mentais */
.hub-card { display: flex; gap: 14px; align-items: center; text-decoration: none; color: #fff; border-radius: var(--radius); padding: 18px 16px; margin-bottom: 12px; box-shadow: 0 5px 0 rgba(0,0,0,.25); font-size: 1.4rem; }
.hub-card b { display: block; font-size: 1.25rem; margin-bottom: 2px; }
.hub-card .small { display: block; opacity: .92; }
.hub-card .hub-ico { font-size: 2.6rem; }
.hub-card.ex { background: linear-gradient(135deg, #1f8a4c, #2fae66); }
.hub-card.mp { background: linear-gradient(135deg, #6a3fc1, #9b6bea); }
.hub-card.ct { background: linear-gradient(135deg, #1f5fbf, #3f8ae6); }
.hub-card .progress { height: 8px; background: rgba(255,255,255,.3); display: block; }
.hub-card .progress > span { display: block; height: 100%; background: #fff; border-radius: 999px; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg a, .seg button { flex: 1; text-align: center; padding: 8px 6px; border-radius: 9px; border: 0; background: none; text-decoration: none; color: var(--muted); font-weight: 700; font-size: .9rem; }
.seg .on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.pchips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; }
.pchips a { flex: 0 0 auto; min-width: 48px; text-align: center; padding: 6px 8px; border-radius: 12px; border: 2px solid var(--border); text-decoration: none; color: var(--text); font-weight: 800; }
.pchips a small { display: block; font-size: .65rem; color: var(--muted); font-weight: 600; }
.pchips a.on { border-color: var(--primary); background: var(--primary-soft); }
.minilink { color: #fff; font-size: .8rem; font-weight: 700; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; text-decoration: none; }
details.periodo { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; }
details.periodo summary { cursor: pointer; padding: 4px 0; }
details.periodo[open] summary { margin-bottom: 8px; }
.card.disc { margin-bottom: 8px; }
.disc-head { color: #fff; border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.disc-head h1 { margin: 4px 0; }
.topico { margin: 18px 0; }
.topico h2 { border-bottom: 2px solid var(--border); padding-bottom: 4px; }
ul.pontos { padding-left: 20px; margin: 6px 0 10px; } ul.pontos li { margin-bottom: 6px; }
.opts { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.opts label { display: flex; gap: 8px; align-items: center; }
.a4-wrap { width: 100%; overflow: hidden; position: relative; margin-bottom: 20px; }
.a4 { --fs: 12px; position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 794px; height: 1123px; background: #fff; color: #1d1d1d; padding: 26px 26px 20px; font-size: var(--fs); line-height: 1.3; box-shadow: 0 2px 10px rgba(0,0,0,.25); display: flex; flex-direction: column; overflow: hidden; }
.a4 .lig { position: absolute; left: 0; top: 0; width: 794px; height: 1123px; pointer-events: none; z-index: 0; }
.a4-head, .a4-foot { display: flex; justify-content: space-between; font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: .06em; position: relative; z-index: 1; }
.a4-foot { margin-top: auto; justify-content: center; padding-top: 6px; }
.a4-body { display: grid; grid-template-columns: 1fr 150px 1fr; gap: 26px; margin-top: 10px; position: relative; z-index: 1; flex: 1; }
.a4 .col { display: flex; flex-direction: column; justify-content: space-around; gap: 12px; }
.a4 .meio { justify-content: center; }
.a4 .nucleo { background: #1d1d1d; color: #fff; border-radius: 18px; padding: 14px 10px; text-align: center; font-weight: 800; font-size: calc(var(--fs) * 1.35); line-height: 1.2; }
.a4 .nucleo .ni { font-size: 2.1em; margin-bottom: 4px; }
.a4 .ramo { background: #fff; border: 2px solid var(--c); border-radius: 12px; overflow: hidden; }
.a4 .ramo-t { background: var(--c); color: #fff; font-weight: 800; padding: 5px 8px; font-size: calc(var(--fs) * 1.1); }
.a4 .ramo ul { margin: 0; padding: 6px 8px 6px 22px; }
.a4 .ramo li { margin-bottom: 3px; }
.a4 .ramo li.f { list-style: none; margin-left: -14px; background: #f3f5fa; border-radius: 6px; padding: 3px 6px; }
.a4 .fx { font-family: "Cambria Math", "Times New Roman", serif; font-weight: 700; display: block; font-size: 1.05em; }
.a4 .sg { display: block; color: #444; font-size: .92em; }
.a4 .ramo li.pr, .a4 .ramo li.ex, .a4 .ramo li.mn { list-style: none; margin-left: -14px; }
.a4 .glos { position: relative; z-index: 1; margin-top: 14px; border: 2px dashed #999; border-radius: 12px; padding: 8px 10px; }
.a4 .glos-t { font-weight: 800; margin-bottom: 4px; }
.a4 .glos-g { column-count: 2; column-gap: 18px; } .a4 .glos-g div { break-inside: avoid; margin-bottom: 3px; }
.a4.pb .nucleo { background: #fff; color: #111; border: 3px solid #111; }
.a4.pb .ramo-t { background: #fff; color: #111; border-bottom: 2px solid #333; }
@media print {
  @page { size: A4; margin: 0; }
  html, body { background: #fff !important; }
  body * { visibility: hidden; }
  .a4, .a4 * { visibility: visible; }
  .a4 { position: fixed; left: 0; top: 0; transform: none !important; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .nav, .topbar, .no-print { display: none !important; }
}

/* =====================================================================
   4. TRILHA (estilo Duolingo)
   ===================================================================== */
.mod-banner { border-radius: var(--radius); padding: 14px; margin: 18px 0 8px; color: #fff; background: var(--primary); box-shadow: 0 4px 0 var(--primary-dark); }
.mod-banner.locked { background: var(--locked); box-shadow: none; color: var(--muted); }
.mod-banner .row { justify-content: space-between; }
.path { display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 40px 0 8px; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit; }
.node .ball {
  width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1.9rem; background: var(--locked); box-shadow: 0 6px 0 rgba(0,0,0,.18); border: 4px solid transparent;
}
.node.done .ball { background: var(--gold); box-shadow: 0 6px 0 #a87400; }
.node.current .ball { background: var(--primary); box-shadow: 0 6px 0 var(--primary-dark); animation: pulse 1.6s infinite; }
.node .lbl { margin-top: 8px; font-size: .78rem; font-weight: 700; max-width: 140px; text-align: center; color: var(--muted); }
.node.current .lbl { color: var(--text); }
.node .start { position: absolute; top: -30px; background: var(--surface); border: 2px solid var(--border); color: var(--primary); font-weight: 900; font-size: .75rem; padding: 3px 10px; border-radius: 10px; white-space: nowrap; animation: bob 1.4s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* =====================================================================
   5. LIÇÃO, BLOCOS E QUESTÕES
   ===================================================================== */
.lesson-top { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 0 12px; position: sticky; top: 0; background: var(--bg); z-index: 20; }
.lesson-top .progress { flex: 1; }
.hearts { font-weight: 800; color: var(--err); white-space: nowrap; }
.bloco { border-left: 6px solid var(--muted); background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.bloco .tag { font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.bloco h3 { margin-bottom: 6px; }
.tabela { overflow-x: auto; margin: 6px 0; } .tabela table { border-collapse: collapse; font-size: .85rem; min-width: 100%; } .tabela th, .tabela td { border: 1px solid var(--line, rgba(128,128,128,.35)); padding: 4px 6px; text-align: left; vertical-align: top; } .tabela th { background: rgba(128,128,128,.12); }
.bloco.conceito { border-color: var(--c-conceito); } .bloco.conceito .tag { color: var(--c-conceito); }
.bloco.atencao { border-color: var(--c-atencao); } .bloco.atencao .tag { color: var(--c-atencao); }
.bloco.dica { border-color: var(--c-dica); } .bloco.dica .tag { color: var(--c-dica); }
.bloco.formula { border-color: var(--c-formula); } .bloco.formula .tag { color: var(--c-formula); }
.bloco.conexao { border-color: var(--c-conexao); } .bloco.conexao .tag { color: var(--c-conexao); }
.bloco.bobo, .bloco.serio, .bloco.mnemonico, .bloco.recall, .bloco.mapa { border-color: var(--border); }
.bloco.mapa pre { white-space: pre-wrap; font-size: .85rem; line-height: 1.2; margin: 0; overflow-x: auto; }
.reveal { margin-top: 10px; }
.q-enunciado { font-size: 1.15rem; font-weight: 700; margin: 6px 0 14px; }
.q-contexto { background: var(--surface-2); border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: .95rem; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 13px 14px; box-shadow: 0 3px 0 var(--border); font-weight: 600; }
.opt.sel { border-color: var(--c-formula); background: color-mix(in srgb, var(--c-formula) 12%, var(--surface)); box-shadow: 0 3px 0 var(--c-formula); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 var(--ok); }
.opt.bad { border-color: var(--err); background: var(--err-soft); box-shadow: 0 3px 0 var(--err); }
.opt:disabled { cursor: default; }
.vf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vf .opt { text-align: center; font-size: 1.05rem; padding: 18px; }
.blank { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--c-formula); text-align: center; font-weight: 800; color: var(--c-formula); padding: 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .opt { padding: 10px 14px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; }
.match .opt { font-size: .9rem; padding: 11px 10px; min-height: 52px; }
.match .opt.done { opacity: .35; border-color: var(--ok); box-shadow: none; }
.order-answer { min-height: 60px; border: 2px dashed var(--border); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.order-answer .opt { display: flex; gap: 8px; align-items: center; }
.order-answer .num { background: var(--c-formula); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; flex: none; }
.numinput { width: 100%; font-size: 1.4rem; padding: 12px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface); text-align: center; }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

/* Painel de feedback (sobe de baixo, estilo Duolingo) */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; justify-content: center; animation: up .2s; }
.sheet .inner { width: 100%; max-width: 560px; }
.sheet.ok { background: var(--ok-soft); border-top: 2px solid var(--ok); }
.sheet.bad { background: var(--err-soft); border-top: 2px solid var(--err); }
.sheet h3 { color: var(--ok); } .sheet.bad h3 { color: var(--err); }
.sheet .expl { white-space: pre-line; font-size: .95rem; max-height: 38vh; overflow: auto; }
.sheet.bad .btn { background: var(--err); box-shadow: 0 4px 0 #7d1522; }
@keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.footer-action { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom)); margin-top: 18px; }
.lesson-pad { padding-bottom: 260px; }

/* =====================================================================
   6. QUIZ RELÂMPAGO (estilo Kahoot)
   ===================================================================== */
.k-question { background: var(--surface); border-radius: var(--radius); padding: 16px; font-weight: 800; font-size: 1.15rem; text-align: center; box-shadow: var(--shadow); margin-bottom: 12px; min-height: 90px; display: flex; align-items: center; justify-content: center; }
.k-timer { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.k-timer .t { width: 52px; height: 52px; border-radius: 50%; background: #46178f; color: #fff; font-weight: 900; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; flex: none; }
.k-timer .progress > div { background: #46178f; transition: width .1s linear; }
.k-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.k-tile { border: 0; border-radius: 12px; color: #fff; font-weight: 800; padding: 16px 10px; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 0 rgba(0,0,0,.25); text-align: center; font-size: .95rem; }
.k-tile .shape { font-size: 1.6rem; line-height: 1; }
.k-tile.red { background: var(--k-red); } .k-tile.blue { background: var(--k-blue); }
.k-tile.yellow { background: var(--k-yellow); } .k-tile.green { background: var(--k-green); }
.k-tile.dim { opacity: .3; }
.k-result { text-align: center; padding: 24px 12px; border-radius: var(--radius); color: #fff; margin-bottom: 12px; }
.k-result.ok { background: var(--k-green); } .k-result.bad { background: var(--k-red); }

/* ---------------------------------------------------------------------
   CONTEÚDO: índices para achar módulos, lições e questões rapidamente
   --------------------------------------------------------------------- */
let MODS = [];            // módulos ordenados pela trilha
let LICOES = [];          // todas as lições em ordem
const Q = {};             // id -> questão (com .modulo e .licao)
const CARTAS = {};        // id -> flashcard
const errosConteudo = []; // problemas encontrados nos arquivos de conteúdo

function prepararConteudo() {
  MODS = (window.MODULOS || []).slice().sort((a, b) => (a.ordem ?? a.numero) - (b.ordem ?? b.numero));
  (window.DISCIPLINAS || []).slice().sort((a, b) => a.periodo - b.periodo).forEach((d, k) => {
    try { MODS.push(disciplinaParaModulo(d, k)); } catch (e) { errosConteudo.push(`Disciplina "${d.nome || d.id}": ${e.message}`); }
  });
  // Banco de questões extra (conteudo/banco-questoes.js): cada item diz em que lição entra
  (window.BANCO || []).forEach(item => {
    const l = MODS.flatMap(m => m.licoes || []).find(x => x.id === item.licao);
    if (!l) { errosConteudo.push(`Banco: lição "${item.licao}" não existe (questão ${item.id})`); return; }
    const q = Object.assign({}, item); delete q.licao;
    (l.questoes = l.questoes || []).push(q);
  });
  const ids = new Set();
  MODS.forEach(m => {
    if (!m.id || !Array.isArray(m.licoes)) { errosConteudo.push(`Módulo "${m.titulo || "?"}" sem id ou sem licoes.`); return; }
    m.licoes.forEach(l => {
      l.modulo = m.id;
      LICOES.push(l);
      (l.blocos || []).forEach(b => { if (b.nivel && !ORDEM_NIVEIS.includes(b.nivel)) errosConteudo.push(`${l.id}: bloco com nível inválido "${b.nivel}"`); });
      (l.questoes || []).forEach(q => {
        if (ids.has(q.id)) errosConteudo.push(`ID de questão repetido: ${q.id}`);
        ids.add(q.id);
        q.modulo = m.id; q.licao = l.id;
        validarQuestao(q);
        Q[q.id] = q;
      });
    });
    (m.flashcards || []).forEach(c => { c.modulo = m.id; CARTAS[c.id] = c; });
  });
  validarProblemas();
}
function validarQuestao(q) {
  const erro = msg => errosConteudo.push(`${q.id}: ${msg}`);
  if (!q.pergunta) erro("falta 'pergunta'");
  if (["multipla", "lacuna", "caso"].includes(q.tipo)) {
    if (!Array.isArray(q.opcoes) || q.opcoes.length < 2) erro("precisa de 'opcoes' (lista)");
    else if (!(q.correta >= 0 && q.correta < q.opcoes.length)) erro("'correta' fora da lista de opções");
  } else if (q.tipo === "vf") { if (typeof q.correta !== "boolean") erro("'correta' deve ser true ou false"); }
  else if (q.tipo === "ligar") { if (!Array.isArray(q.pares) || q.pares.length < 2) erro("precisa de 'pares'"); }
  else if (q.tipo === "ordenar") { if (!Array.isArray(q.itens) || q.itens.length < 2) erro("precisa de 'itens'"); }
  else if (q.tipo === "calculo") { if (typeof q.resposta !== "number" && !q.variaveis) erro("'resposta' deve ser número"); }
  else if (q.tipo === "discursiva") { if (!q.respostaModelo) erro("discursiva precisa de 'respostaModelo'"); }
  else erro(`tipo desconhecido "${q.tipo}"`);
  if (q.nivel && !ORDEM_NIVEIS.includes(q.nivel)) erro(`nível inválido "${q.nivel}" (use facil, medio ou dificil)`);
  if (q.variaveis) Parametros.validar(q).forEach(msg => erro("modelo com números sorteados: " + msg));
  if (q.justificativas && (!q.opcoes || q.justificativas.length !== q.opcoes.length)) erro("'justificativas' deve ter o mesmo tamanho de 'opcoes'");
}
const modulo = id => MODS.find(m => m.id === id);
const licaoConcluida = id => !!S.licoes[id];
function licaoLiberada(id) {
  if (licaoConcluida(id)) return true;
  const i = LICOES.findIndex(l => l.id === id);
  if (i === 0) return true;
  if (i < 0) return false;
  // Trilha paralela: a 1ª lição de um módulo com "liberaApos" depende só desses módulos
  const m = modulo(LICOES[i].modulo);
  if (m && m.grade && m.licoes[0].id === id) return true; // cada disciplina da grade começa liberada
  if (m && m.liberaApos && m.licoes[0].id === id)
    return [].concat(m.liberaApos).every(mid => { const pre = modulo(mid); return pre && moduloConcluido(pre); });

/* Sorteio das questões da lição (banco de questões):

function selecionarQuestoes(pool, n) {

  const peso = q => {
    const st = S.questoes[q.id];
    if (!st) return 3 + Math.random();
    return (st.erros > st.acertos ? 2 : 0) + (S.revisao[q.id] ? 1 : 0) + Math.random() * 1.5;
  };

  ordem.forEach(x => { if (escolhidas.length < n && !tipos.has(x.q.tipo)) { escolhidas.push(x.q); tipos.add(x.q.tipo); } });
  ordem.forEach(x => { if (escolhidas.length < n && !escolhidas.includes(x.q)) escolhidas.push(x.q); });

/* ---- Níveis de estudo: helpers ----

/* ---------------------------------------------------------------------
   XP, NÍVEL, OFENSIVA, VIDAS, META DIÁRIA
   --------------------------------------------------------------------- */
function nivelAtual(xp = S.xpTotal) {
  let n = 0;
  NIVEIS.forEach((nv, i) => { if (xp >= nv.xp) n = i; });
  return n;
}
function xpHoje() { return S.xpPorDia[hoje()] || 0; }
// Congelamento 🧊: se você faltou UM dia só, a ofensiva é salva (no máximo 1 vez a cada 7 dias).
// Isso evita o "quebrei a sequência, desisti de tudo".
function congelamentoDisponivel() {
  return !S.ofensiva.congeladoEm || S.ofensiva.congeladoEm <= hoje(-7);
}
function ofensivaVisivel() {
  const u = S.ofensiva.ultimoDia;
  if (u === hoje() || u === hoje(-1)) return S.ofensiva.atual;
  if (u === hoje(-2) && congelamentoDisponivel()) return S.ofensiva.atual; // será salva ao estudar hoje
  return 0; // faltou mais de um dia: a ofensiva quebrou
}
function ganharXP(qtd) {
  if (qtd <= 0) return;
  const nivelAntes = nivelAtual();
  S.xpTotal += qtd;
  S.xpPorDia[hoje()] = xpHoje() + qtd;
  // ofensiva: conta o dia no primeiro XP ganho
  if (S.ofensiva.ultimoDia !== hoje()) {
    const u = S.ofensiva.ultimoDia;
    if (u === hoje(-1)) S.ofensiva.atual++;
    else if (u === hoje(-2) && congelamentoDisponivel()) {
      S.ofensiva.atual++;
      S.ofensiva.congeladoEm = hoje(-1);
      toast("🧊 Congelamento usado: sua ofensiva foi salva!");
    } else S.ofensiva.atual = 1;
    S.ofensiva.ultimoDia = hoje();
    S.ofensiva.recorde = Math.max(S.ofensiva.recorde, S.ofensiva.atual);
    if (S.ofensiva.atual > 1) toast(`🔥 Ofensiva de ${S.ofensiva.atual} dias!`);
  }
  if (S.ofensiva.atual >= 3) desbloquear("ofensiva-3");
  if (S.ofensiva.atual >= 7) desbloquear("ofensiva-7");
  if (S.ofensiva.atual >= 30) desbloquear("ofensiva-30");
  if (S.xpTotal >= 500) desbloquear("xp-500");
  if (S.xpTotal >= 2000) desbloquear("xp-2000");
  // meta diária
  if (xpHoje() >= S.config.meta && S.metaBatidaEm !== hoje()) {
    S.metaBatidaEm = hoje();
    desbloquear("meta-diaria");
    setTimeout(() => { confete(); som("nivel"); toast("🎯 Meta diária batida!"); }, 600);
  }
  // subida de nível
  const nivelDepois = nivelAtual();
  if (nivelDepois > nivelAntes) {
    const nv = NIVEIS[nivelDepois];
    setTimeout(() => { confete(); som("nivel"); toast(`${nv.icone} Promoção! Agora você é ${nv.nome}!`); }, 1200);
    if (nivelDepois === NIVEIS.length - 1) desbloquear("diretor");
  }

}
// Vidas: recarregam por completo a cada novo dia; também voltam revisando
function atualizarVidasDoDia() {

}

/* ---------------------------------------------------------------------
   CONQUISTAS
   --------------------------------------------------------------------- */
function todasConquistas() {
  return CONQUISTAS_GERAIS.concat(MODS.filter(m => m.conquista).map(m => m.conquista));
}
function desbloquear(id) {
  if (S.conquistas[id]) return;

/* ---------------------------------------------------------------------
   REVISÃO ESPAÇADA (D+1, D+3, D+7, D+15, D+30)
   --------------------------------------------------------------------- */
// "Retenção confirmada": acertou de novo pelo menos 7 dias depois do 1º contato.
// É o que mais se aproxima de domínio real (concluir lição ≠ dominar).
function marcarRetencao(st, acertou) {
  if (!st.desde) st.desde = hoje();
  if (acertou && st.desde <= hoje(-7)) st.confirmada = true;
}
function registrarResposta(q, acertou) {
  const st = S.questoes[q.id] || (S.questoes[q.id] = { acertos: 0, erros: 0 });
  if (acertou) st.acertos++; else st.erros++;
  marcarRetencao(st, acertou);
  if (!acertou) S.revisao[q.id] = { etapa: 0, proxima: hoje(1) }; // errou → volta amanhã
  salvar();
}
function registrarRevisao(q, acertou) {
  const r = S.revisao[q.id] || { etapa: 0, proxima: hoje() };
  if (acertou) {
    r.etapa++;
    if (r.etapa >= INTERVALOS_REVISAO.length) { delete S.revisao[q.id]; S.dominadas++; }
    else { r.proxima = hoje(INTERVALOS_REVISAO[r.etapa]); S.revisao[q.id] = r; }
    S.revisadas++;
    if (S.revisadas >= 20) desbloquear("revisor");
  } else {
    S.revisao[q.id] = { etapa: 0, proxima: hoje(1) };
  }
  const st = S.questoes[q.id] || (S.questoes[q.id] = { acertos: 0, erros: 0 });
  if (acertou) st.acertos++; else st.erros++;
  marcarRetencao(st, acertou);
  salvar();
}

  return Object.keys(S.revisao).filter(id => Q[id] && S.revisao[id].proxima <= hoje());
}

  return Object.values(CARTAS).filter(c => (!modId || c.modulo === modId) && moduloLiberado(modulo(c.modulo)))
    .filter(c => !S.cartas[c.id] || S.cartas[c.id].proxima <= hoje());
}

/* ---------------------------------------------------------------------
   SONS (gerados pelo navegador, sem arquivos)
   --------------------------------------------------------------------- */
let audioCtx = null;
function som(tipo) {
  if (!S.config.som) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notas = {
      acerto: [[660, 0], [880, .09]],
      erro: [[220, 0], [180, .12]],
      nivel: [[523, 0], [659, .1], [784, .2], [1047, .3]],
      clique: [[440, 0]],
      tique: [[1200, 0]]
    }[tipo] || [[440, 0]];
    notas.forEach(([freq, atraso]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = tipo === "erro" ? "sawtooth" : "sine";
      o.frequency.value = freq;
      const t0 = audioCtx.currentTime + atraso;
      const dur = tipo === "tique" ? .05 : .16;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(tipo === "erro" ? .08 : .18, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + .02);
    });
  } catch (e) { /* sem áudio: tudo bem */ }
}

/* ---------------------------------------------------------------------
   CONFETE (animação de comemoração)
   --------------------------------------------------------------------- */
function confete() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ["#e21b3c", "#1368ce", "#d89e00", "#26890c", "#7b4bc4", "#ffffff"];
  const ps = Array.from({ length: 140 }, () => ({
    x: cv.width / 2, y: cv.height / 3, vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 4,
    r: Math.random() * 6 + 4, c: cores[Math.floor(Math.random() * cores.length)], a: Math.random() * 6
  }));
  const inicio = performance.now();
  (function quadro(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    });
    if (t - inicio < 2600) requestAnimationFrame(quadro); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(inicio);
}

/* ---------------------------------------------------------------------
   AVISO RÁPIDO (toast) — fila para não sobrepor
   --------------------------------------------------------------------- */
const filaToast = [];

/* ---------------------------------------------------------------------
   VOZ: "Ouvir a lição" (síntese de voz do navegador, em português)
   --------------------------------------------------------------------- */
function limparParaFala(t) {
  return String(expandirSiglas(t || "")).replace(/^\s*\|[\s:|-]+\|\s*$/gm, "").replace(/\|/g, ", ") // tabelas: lê as células, não as barras
    .replace(/\/h\b/g, " por hora").replace(/\/(dia|mês|ano|semana|turno|pedido|unidade|un|min|kg|t)\b/g, " por $1") // unidades: "un/dia" → "un por dia"
    .replace(/\*\*/g, "").replace(/\*/g, "")
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu, "")
    // símbolos de fórmulas lidos por extenso (estatística, matemática)
    .replace(/x̄/g, "x barra").replace(/ȳ/g, "y barra").replace(/ŷ/g, "y chapéu").replace(/μ₀/g, "mi zero")
    .replace(/μ/g, "mi").replace(/σ/g, "sigma").replace(/Σ/g, "soma de ").replace(/α/g, "alfa").replace(/β/g, "beta")
    .replace(/λ/g, "lambda").replace(/√/g, "raiz de ").replace(/²/g, " ao quadrado").replace(/±/g, " mais ou menos ")
    .replace(/≈/g, " aproximadamente ").replace(/≥/g, " maior ou igual a ").replace(/≤/g, " menor ou igual a ")
    .replace(/·/g, " vezes ").replace(/=/g, " igual a ")
    .replace(/ < /g, " menor que ").replace(/ > /g, " maior que ").replace(/[│├└┤┼─▁▂▃▄▆█┘┌┐]/g, " ")
    .replace(/→/g, ", ").replace(/÷/g, " dividido por ").replace(/×/g, " vezes ").replace(/≠/g, " diferente de ")
    .replace(/−/g, " menos ").replace(/%/g, " por cento").replace(/\n/g, ". ");
}
function vozPT() {
  const vozes = speechSynthesis.getVoices();
  return vozes.find(v => v.lang === "pt-BR") || vozes.find(v => v.lang && v.lang.startsWith("pt"));
}
function falar(partes, titulo = "Ouvindo…") {
  if (!("speechSynthesis" in window)) { toast("Seu navegador não tem leitura em voz alta 😕"); return; }
  speechSynthesis.cancel();
  // Divide em frases curtas: alguns celulares param de falar no meio de textos longos
  const lista = (Array.isArray(partes) ? partes : [partes]).map(limparParaFala)
    .flatMap(t => t.split(/(?<=[.!?:;])\s+/)).map(t => t.trim()).filter(t => t.replace(/[.\s]/g, ""));
  if (!lista.length) return;
  $("#listen-title").textContent = titulo;
  $("#listenbar").classList.remove("hidden");
  document.body.classList.add("ouvindo");
  desbloquear("ouvinte");
  lista.forEach((txt, i) => {
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = "pt-BR"; u.rate = S.config.velocidadeVoz;
    const v = vozPT(); if (v) u.voice = v;
    if (i === lista.length - 1) u.onend = () => { $("#listenbar").classList.add("hidden"); document.body.classList.remove("ouvindo"); };
    speechSynthesis.speak(u);
  });
}
function textoFalaBloco(b) {
  if (b.tipo === "recall") return [b.pergunta, b.resposta];
  const partes = [b.titulo || "", b.texto];
  if (b.legenda) partes.push("Onde: " + b.legenda.map(([s, d]) => `${s}: ${d}`).join("; "));
  return partes;
}
function pararFala() { if ("speechSynthesis" in window) speechSynthesis.cancel(); $("#listenbar").classList.add("hidden"); document.body.classList.remove("ouvindo"); }
// Textos para ouvir: uma lição inteira (no nível escolhido) e um tópico da grade
function textoFalaLicao(l, nivel) {

  return ["Lição: " + l.titulo + "."].concat(doNivel(l.blocos, nv).filter(b => b.tipo !== "mapa").flatMap(textoFalaBloco));

function textoFalaTopico(tp, i) {

const PROB = () => window.PROBLEMAS || { categorias: [], problemas: [], ferramentas: {}, areasEstagio: [] };

const norm = t => String(t ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

// Confere se problemas, ferramentas e desafios apontam para conteúdo que existe
function validarProblemas() {
  const P = PROB(), F = P.ferramentas, idsL = new Set(LICOES.map(l => l.id)), err = m => errosConteudo.push(m);
  Object.entries(F).forEach(([id, f]) => {
    ["nome", "oque", "paraque", "quando", "exemplo", "erros"].forEach(c => { if (!f[c]) err(`Ferramenta ${id}: falta '${c}'`); });
    (f.ver || []).forEach(v => { if (!idsL.has(v)) err(`Ferramenta ${id}: lição "${v}" não existe`); });
  });
  P.problemas.forEach(p => {
    if (!P.categorias.some(c => c.id === p.cat)) err(`Problema ${p.id}: categoria "${p.cat}" não existe`);
    (p.ferramentas || []).forEach(f => { if (!F[f]) err(`Problema ${p.id}: ferramenta "${f}" não existe`); });
  });
  P.areasEstagio.forEach(a => {
    a.cats.forEach(c => { if (!P.categorias.some(x => x.id === c)) err(`Modo Estágio ${a.id}: categoria "${c}" não existe`); });
    a.ferramentas.forEach(f => { if (!F[f]) err(`Modo Estágio ${a.id}: ferramenta "${f}" não existe`); });
    a.estudo.forEach(m => { if (!modulo(m)) err(`Modo Estágio ${a.id}: módulo "${m}" não existe`); });
  });
  const ids = new Set();
  (window.DESAFIOS || []).forEach(d => {
    if (ids.has(d.id)) err(`Desafio repetido: ${d.id}`); ids.add(d.id);
    if (!Array.isArray(d.opcoes) || !(d.correta >= 0 && d.correta < d.opcoes.length)) err(`Desafio ${d.id}: 'correta' fora das opções`);
    if (!d.porque || !d.pratica) err(`Desafio ${d.id}: falta 'porque' ou 'pratica'`);
    if (d.ferramenta && !F[d.ferramenta]) err(`Desafio ${d.id}: ferramenta "${d.ferramenta}" não existe`);
  });
}

/* ---- Busca: conceitos, ferramentas, fórmulas, disciplinas, problemas… ---- */
const PARADAS = new Set(["de", "da", "do", "das", "dos", "e", "o", "a", "os", "as", "em", "no", "na", "nos", "nas", "para", "com", "um", "uma", "por", "que", "como", "meu", "minha", "tenho", "esta", "muito"]);
let INDICE = null;
function indiceBusca() {
  if (INDICE) return INDICE;
  const I = [], termosVistos = new Set();
  const add = e => { e.n = norm(e.titulo); e.nt = norm([e.titulo, e.termos, e.sub, e.txt].join(" ")); I.push(e); };
  Object.entries(PROB().ferramentas).forEach(([id, f]) => add({ k: "f:" + id, tipo: "Ferramenta", icone: f.icone || "🧰", titulo: f.nome, sub: f.oque, termos: f.termos, txt: f.paraque + " " + f.quando, href: "#ferramenta/" + id }));
  PROB().problemas.forEach(p => add({ k: "p:" + p.id, tipo: "Problema", icone: "🚨", titulo: p.titulo, sub: p.desc, termos: p.termos, txt: p.ferramentas.map(f => FERR(f) ? FERR(f).nome : "").join(" "), href: "#problema/" + p.id }));
  MODS.forEach(m => {
    add({ k: "m:" + m.id, tipo: m.grade ? "Disciplina" : "Módulo", icone: m.icone, titulo: m.titulo,
      sub: m.grade ? `${m.periodo}º período · ${(AREAS[m.fonte.area] || AREAS.producao).nome}` : `Módulo ${m.numero} do curso`, txt: m.objetivo, href: "#conteudo/" + m.id });
    (m.glossario || []).forEach(g => {
      const n = norm(g.termo); if (termosVistos.has(n)) return; termosVistos.add(n);
      const k = `g:${m.id}:${g.termo}`;
      add({ k, tipo: "Conceito", icone: "📖", titulo: g.termo, sub: g.definicao, href: "#consulta/" + enc(k) });
    });
    m.licoes.forEach(l => {
      if (/chef/i.test(l.titulo)) return;
      const k = "l:" + l.id, href = "#consulta/" + enc(k);
      add({ k, tipo: m.grade ? "Tópico" : "Lição", icone: l.icone || m.icone, titulo: l.titulo, sub: m.titulo, txt: (l.blocos || []).map(b => b.titulo || "").join(" "), href });
      (l.blocos || []).filter(b => b.tipo === "formula").forEach(b => {
        if (m.grade) (b.legenda || []).forEach(([f, sig]) => add({ k, tipo: "Fórmula", icone: "📐", titulo: f, sub: `${limpar(sig)} · ${m.titulo}`, href }));
        else if (b.titulo) add({ k, tipo: "Fórmula", icone: "📐", titulo: limpar(b.titulo), sub: `${limpar(b.texto).split("\n")[0]} · ${l.titulo}`, href });
      });
    });
  });
  return (INDICE = I);
}
function buscar(q, lim = 40) {
  const nq = norm(q).trim();
  if (nq.length < 2) return [];
  // palavras relevantes; plural simples vira singular ("filas" acha "fila")
  const toks = nq.split(/[\s,;:/()?!.-]+/).filter(t => t && !PARADAS.has(t)).map(t => t.length > 4 && t.endsWith("s") ? t.slice(0, -1) : t);
  if (!toks.length) return [];
  const peso = { Ferramenta: 30, Problema: 22, Conceito: 18, Disciplina: 14, "Módulo": 14, "Lição": 10, "Tópico": 10, "Fórmula": 6 };
  const pref = new Set((areaEstagio() || {}).ferramentas || []);
  const vistos = new Set();
  const pontuados = indiceBusca().map(e => {
    const achou = toks.filter(t => e.nt.includes(t)).length;
    if (!achou) return null;
    const todos = achou === toks.length;
    if (!todos && achou < Math.ceil(toks.length / 2)) return null;
    let s = (peso[e.tipo] || 0) + (todos ? 200 : achou * 20);
    if (e.n === nq) s += 100; else if (e.n.startsWith(nq)) s += 60; else if (e.n.includes(nq)) s += 45; else if (toks.every(t => e.n.includes(t))) s += 30;
    if (pref.has(e.k.slice(2))) s += 8;
    return { e, s };
  }).filter(Boolean).sort((a, b) => b.s - a.s || a.e.titulo.length - b.e.titulo.length);
  return pontuados.filter(x => { const c = x.e.tipo + "|" + x.e.n; if (vistos.has(c)) return false; vistos.add(c); return true; })
    .slice(0, lim).map(x => x.e);
}

/* ---- Fichas de consulta em níveis: 30 s → 3 min → prática → teste → aprofunde ---- */
const linkConteudo = l => `#conteudo/${l.modulo}/${l.id}`;
function questaoDeTeste(l, nt) {
  const qs = (l.questoes || []).filter(q => ["multipla", "vf", "caso", "lacuna", "calculo"].includes(q.tipo));
  const rel = nt ? qs.filter(q => norm(q.pergunta + " " + (q.explicacao || "") + " " + (q.opcoes || []).join(" ")).includes(nt)) : [];
  const pool = rel.length ? rel : qs.filter(q => q.nivel !== "dificil");
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : (qs[0] || null);
}
// Monta a ficha de um conceito (termo do glossário) ou de uma lição/tópico a partir dos blocos que já existem
function fichaDeLicao(l, termo, resumo, tipo) {
  const m = modulo(l.modulo), nt = termo ? norm(termo) : "";
  const base = (l.blocos || []).filter(b => !["mapa", "recall", "referencia"].includes(b.tipo));
  const txt = b => norm([b.titulo, b.texto, (b.legenda || []).flat().join(" ")].join(" "));
  const conceito = tipo === "Conceito";
  const escolher = (tipos, n, soRelacionados) => {
    const c = base.filter(b => tipos.includes(b.tipo)), r = nt ? c.filter(b => txt(b).includes(nt)) : [];
    const lista = r.length || soRelacionados ? r : c.filter(b => !b.nivel || b.nivel === "facil").concat(c);
    return lista.filter((b, i, a) => a.indexOf(b) === i).slice(0, n);
  };
  const pc = base.find(b => b.tipo === "conceito");
  const ctx = base.find(b => b.tipo === "contexto");
  const rel = Object.entries(PROB().ferramentas).filter(([, f]) => (f.ver || []).includes(l.id));
  return {
    tipo, icone: conceito ? "📖" : (l.icone || m.icone), titulo: termo || l.titulo,
    origem: `${m.icone} ${m.grade ? `${m.titulo} · ${m.periodo}º período` : `Módulo ${m.numero} — ${m.titulo}`}${conceito ? ` · lição “${l.titulo}”` : ""}`,
    resumo: resumo || porNivel(l.resumo, "facil") || (pc ? primeiraFrase(pc.texto) : m.objetivo),
    paraque: !conceito && ctx ? ctx.texto : null,
    entenda: escolher(["conceito", "texto", "dica", "passos", "conexao", "mnemonico"], 3, false),
    formulas: escolher(["formula"], 2, conceito),
    pratica: escolher(["exemplo", "serio", "bobo"], 2, false),
    erros: escolher(["atencao", "limitacao"], 1, conceito),
    teste: questaoDeTeste(l, nt),
    aprofundar: [
      { href: linkConteudo(l), icone: "📚", tipo: "Conteúdo completo", titulo: l.titulo, sub: m.titulo },
      licaoLiberada(l.id) ? { href: "#licao/" + l.id, icone: "🎮", tipo: "Exercícios", titulo: "Fazer a lição", sub: `${(l.questoes || []).length} exercícios · níveis e revisão` } : null,
      { href: "#mapa/" + m.id, icone: "🧠", tipo: "Mapa mental A4", titulo: m.titulo, sub: "tópicos, fórmulas e significados numa folha" }
    ].filter(Boolean),
    relacionadas: rel.map(([id, f]) => ({ href: "#ferramenta/" + id, icone: f.icone, tipo: "Ferramenta", titulo: f.nome, sub: f.oque }))
  };
}
function fichaDeFerramenta(id) {
  const f = FERR(id), ver = (f.ver || []).map(v => LICOES.find(l => l.id === v)).filter(Boolean);
  const d = (window.DESAFIOS || []).find(x => x.ferramenta === id);

// Ordem de leitura da ficha: resumo → entenda → erros → prática
function textoFalaFicha(F) {
  const p = [F.titulo + ".", "O que é: " + F.resumo];
  if (F.paraque) p.push("Para que serve: " + F.paraque);
  if (F.quando) p.push("Quando usar: " + F.quando);
  if ((F.dados || []).length) p.push("Dados necessários: " + F.dados.join("; ") + ".");
  (F.formulasTxt || []).forEach(([f, sig]) => p.push(`Fórmula: ${f}. ${sig}.`));
  (F.formulas || []).concat(F.entenda || []).forEach(b => p.push(...textoFalaBloco(b)));
  if (F.errosTxt) p.push("Erros comuns: " + F.errosTxt);
  (F.erros || []).forEach(b => p.push("Erros comuns. " + (b.titulo || ""), b.texto));
  if (F.exemploTxt) p.push("Exemplo prático: " + F.exemploTxt);
  (F.pratica || []).forEach(b => p.push(...textoFalaBloco(b)));
  return p;
}
function telaConsulta(kParam) {
  const k = dec(kParam);
  let F = null;
  if (k.startsWith("f:")) { ir("ferramenta/" + k.slice(2)); return; }

    const [, modId, ...resto] = k.split(":"), termo = resto.join(":");
    const m = modulo(modId), g = m && (m.glossario || []).find(x => x.termo === termo);
    if (g) {

      const nt = norm(termo);
      const pont = l => (norm(l.titulo).includes(nt) ? 6 : 0) + (l.blocos || []).reduce((s, b) => s + (norm(b.titulo).includes(nt) ? 3 : 0) + (norm(b.texto).split(nt).length - 1), 0);
      const l = m.licoes.filter(x => !/chef/i.test(x.titulo)).map(x => ({ x, p: pont(x) })).sort((a, b) => b.p - a.p)[0];
      F = fichaDeLicao(l ? l.x : m.licoes[0], termo, g.definicao, "Conceito");
    }
  } else if (k.startsWith("l:")) {
    const l = LICOES.find(x => x.id === k.slice(2));
    if (l) F = fichaDeLicao(l, null, null, modulo(l.modulo).grade ? "Tópico" : "Lição");
  }
  if (!F) { toast("Não encontrei esse item 😕"); ir("consultar"); return; }
  mostrarFicha(F, { k, href: "#consulta/" + enc(k), icone: F.icone, tipo: F.tipo, titulo: F.titulo, sub: F.origem }, "consultar");
}

   ===================================================================== */
function desafioDoDia() {
  const D = window.DESAFIOS || [];
  if (!D.length) return null;
  if (S.desafioDia && S.desafioDia.data === hoje()) { const d = D.find(x => x.id === S.desafioDia.id); if (d) return d; }
  let pool = D.filter(d => !S.desafios[d.id]);
  if (!pool.length) pool = D.slice();
  const A = areaEstagio();
  if (A) { const da = pool.filter(d => (d.areas || []).includes(A.id)); if (da.length) pool = da; }
  const d = pool[Number(hoje().replace(/-/g, "")) % pool.length]; // o mesmo desafio o dia inteiro
  S.desafioDia = { data: hoje(), id: d.id };
  salvar();
  return d;
}
function telaDesafio(modo, param) {
  const D = window.DESAFIOS || [];
  if (modo === "historico") return telaHistoricoDesafios();
  let d;
  if (modo === "ver") d = D.find(x => x.id === param);
  else if (modo === "extra") {
    d = D.find(x => x.id === param);
    if (!d) { location.replace("#desafio/extra/" + sortearExtra()); return; } // cada desafio extra tem seu próprio endereço
  } else d = desafioDoDia();
  if (!d) { app().innerHTML = barraTopo() + `<h1>⚡ Desafio</h1><p class="muted">Nenhum desafio disponível.</p>`; return; }
  const f = FERR(d.ferramenta), reg = S.desafios[d.id];
  const titulo = modo === "ver" ? "⚡ Desafio" : modo === "extra" ? "⚡ Desafio extra" : "⚡ Desafio do dia";
  const areas = (d.areas || []).map(a => PROB().areasEstagio.find(y => y.id === a)).filter(Boolean);
  const cab = barraTopo() + `<h1>${titulo}</h1><p class="lead">Resolva em 2 minutos. Um problema real, uma decisão.</p>
    <div class="row wrap mb"><span class="chip-nivel">⏱️ ~2 min</span>${areas.map(a => `<span class="chip-nivel">${a.icone} ${esc(a.nome)}</span>`).join("")}</div>`;
  const resultado = acertou => `
    <div class="card"><b>${fmt(d.pergunta)}</b></div>
    <div class="bloco ${acertou ? "dica" : "atencao"}"><div class="tag">${acertou ? "✅ Resposta certa" : "❌ Não foi dessa vez"}</div><b>Resposta:</b> ${fmt(d.opcoes[d.correta])}</div>
    <div class="bloco conceito"><div class="tag">🤔 Por quê?</div>${fmt(d.porque)}</div>
    <div class="bloco serio"><div class="tag">🏭 Na prática</div>${fmt(d.pratica)}</div>
    <button class="btn small sec mb" id="ouvir-desafio">🔊 Ouvir a explicação</button>
    ${f ? `<h2 class="sec-t">Quer entender melhor?</h2><div class="lista">${htmlItem({ href: "#ferramenta/" + d.ferramenta, icone: f.icone, tipo: "Ferramenta", titulo: f.nome, sub: f.oque })}</div>` : ""}
    <a class="btn" href="#desafio/extra/${sortearExtra(d.id)}">⚡ Mais um desafio</a>
    <a class="btn sec" href="#desafio/historico">🕘 Desafios feitos (${Object.keys(S.desafios).length})</a>`;
  const jaFeito = reg && (modo === "ver" || reg.data === hoje());
  const ligarOuvir = () => { $("#ouvir-desafio").onclick = () => falar(["Resposta: " + d.opcoes[d.correta] + ".", "Por quê? " + d.porque, "Na prática: " + d.pratica], "Desafio"); };
  if (jaFeito) { app().innerHTML = cab + resultado(reg.acertou); ligarOuvir(); return; }
  app().innerHTML = cab + `<div id="qarea" class="lesson-pad"></div>`;
  const q = { id: "desafio-" + d.id, tipo: "multipla", pergunta: d.pergunta, opcoes: d.opcoes, correta: d.correta, explicacao: d.porque };
  renderQuestao(q, $("#qarea"), acertou => {
    const primeira = !S.desafios[d.id];
    S.desafios[d.id] = { data: hoje(), acertou };
    salvar();
    if (primeira) ganharXP(acertou ? 10 : 3); // conta para a meta diária e a ofensiva
    app().innerHTML = cab + resultado(acertou);
    ligarOuvir();
    window.scrollTo(0, 0);
  });
}
// Sorteia um desafio ainda não feito (da área do Modo Estágio, se houver), diferente do atual
function sortearExtra(atual) {
  const D = (window.DESAFIOS || []).filter(x => x.id !== atual), A = areaEstagio();
  const nao = D.filter(x => !S.desafios[x.id]);
  let pool = nao.length ? nao : D;
  if (A) { const pa = pool.filter(x => (x.areas || []).includes(A.id)); if (pa.length) pool = pa; }
  return pool.length ? pool[Math.floor(Math.random() * pool.length)].id : (atual || "");
}

function listaPorPeriodo(link, filtro) {
  const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const f = norm(filtro || "");
  let html = "";
  for (let p = 1; p <= 10; p++) {
    const ds = disciplinas().filter(m => m.periodo === p && (!f || norm(m.titulo + " " + m.numero).includes(f)));
    if (!ds.length) continue;

const limpar = t => String(t || "").replace(/\*\*/g, "").replace(/\*/g, "");

const primeiraFrase = t => {
  const ls = limpar(t).split("\n").map(x => x.trim().replace(/^(•|-|\d+\.)\s*/, "")).filter(x => x && !x.startsWith("|"));
  let x = ls[0] || "";
  if (/:$/.test(x) && ls[1]) x += " " + ls[1];
  const i = x.slice(20).search(/[.;](\s|$)/);
  x = i >= 0 ? x.slice(0, i + 20) : x;
  return x.length > 150 ? x.slice(0, x.lastIndexOf(" ", 148)) + "…" : x;
};

        mnemonicos: b.filter(x => x.tipo === "mnemonico").map(x => primeiraFrase(x.texto)).slice(0, 1) };
    }),

}

    const x1 = esquerda ? N.x : N.x + N.w, x2 = esquerda ? R.x + R.w : R.x, y2 = R.y + 14;
    const cor = getComputedStyle(r).getPropertyValue("--c").trim() || "#555";
    return `<path d="M${x1},${cy} C${(x1 + x2) / 2},${cy} ${(x1 + x2) / 2},${y2} ${x2},${y2}" stroke="${cor}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  }).join("");
}
