/* =====================================================================
   1. CORES E TEMA (claro/escuro)
   As cores do curso: 🔴 conceito · 🟡 atenção · 🟢 dica · 🔵 fórmula · 🟣 conexão
   ===================================================================== */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --surface-2: #eef1ec;
  --text: #1c2321;
  --muted: #5c6863;
  --border: #d9dfd9;
  --primary: #1f8a4c;       /* verde "engenharia" (botões principais) */
  --primary-dark: #166a39;
  --primary-texto: #166a39;  /* verde para texto pequeno (contraste AA) */
  --primary-soft: #dcf2e4;
  --gold: #e3a008;
  --locked: #c3cac5;
  /* código de cores do curso */
  --c-conceito: #d7263d;
  --c-atencao: #c98a00;
  --c-dica: #1f8a4c;
  --c-formula: #1d6fd1;
  --c-conexao: #7b4bc4;
  /* cores do Kahoot (fixas) */
  --k-red: #e21b3c;
  --k-blue: #1368ce;
  --k-yellow: #d89e00;
  --k-green: #26890c;
  --ok: #1f8a4c;
  --ok-soft: #dcf2e4;
  --err: #c62839;
  --err-soft: #fbe1e4;
  --shadow: 0 2px 0 rgba(0,0,0,.08);
  --radius: 16px;
  color-scheme: light;
}
/* Tema escuro automático (quando o celular está no modo escuro) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --surface: #1b2220; --surface-2: #242d2a; --text: #e8eeea; --muted: #9aa8a1;
    --border: #2f3a36; --primary: #2fae66; --primary-dark: #238a50; --primary-soft: #1d3a2a; --primary-texto: #3fc77a;
    --locked: #3a4642; --c-conceito: #ff5a6e; --c-atencao: #f0b429; --c-dica: #3fc47a;
    --c-formula: #5aa2ff; --c-conexao: #b28bff; --ok: #3fc47a; --ok-soft: #1d3a2a;
    --err: #ff6b7a; --err-soft: #3d2227; --shadow: 0 2px 0 rgba(0,0,0,.4); color-scheme: dark;
  }
}
/* Tema escuro escolhido manualmente nas configurações */
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1b2220; --surface-2: #242d2a; --text: #e8eeea; --muted: #9aa8a1;
  --border: #2f3a36; --primary: #2fae66; --primary-dark: #238a50; --primary-soft: #1d3a2a; --primary-texto: #3fc77a;
  --locked: #3a4642; --c-conceito: #ff5a6e; --c-atencao: #f0b429; --c-dica: #3fc47a;
  --c-formula: #5aa2ff; --c-conexao: #b28bff; --ok: #3fc47a; --ok-soft: #1d3a2a;

/* =====================================================================

.hub-card { display: flex; gap: 14px; align-items: center; text-decoration: none; color: #fff; border-radius: var(--radius); padding: 18px 16px; margin-bottom: 12px; box-shadow: 0 5px 0 rgba(0,0,0,.25); font-size: 1.4rem; }

/* =====================================================================
   4. TRILHA (estilo Duolingo)
   ===================================================================== */
.mod-banner { border-radius: var(--radius); padding: 14px; margin: 18px 0 8px; color: #fff; background: var(--primary); box-shadow: 0 4px 0 var(--primary-dark); }
.mod-banner.locked { background: var(--locked); box-shadow: none; color: var(--muted); }
.mod-banner .row { justify-content: space-between; }
.path { display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 40px 0 8px; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit; }
.node .ball {
  width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1.9rem; background: var(--locked); box-shadow: 0 6px 0 rgba(0,0,0,.18); border: 4px solid transparent;
}
.node.done .ball { background: var(--gold); box-shadow: 0 6px 0 #a87400; }

/* =====================================================================
   5. LIÇÃO, BLOCOS E QUESTÕES
   ===================================================================== */
.lesson-top { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 0 12px; position: sticky; top: 0; background: var(--bg); z-index: 20; }

.bloco.conceito { border-color: var(--c-conceito); } .bloco.conceito .tag { color: var(--c-conceito); }
.bloco.atencao { border-color: var(--c-atencao); } .bloco.atencao .tag { color: var(--c-atencao); }
.bloco.dica { border-color: var(--c-dica); } .bloco.dica .tag { color: var(--c-dica); }

.reveal { margin-top: 10px; }
.q-enunciado { font-size: 1.15rem; font-weight: 700; margin: 6px 0 14px; }

.numinput { width: 100%; font-size: 1.4rem; padding: 12px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface); text-align: center; }
.shake { animation: shake .35s; }

/* Painel de feedback (sobe de baixo, estilo Duolingo) */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; justify-content: center; animation: up .2s; }

.sheet.ok { background: var(--ok-soft); border-top: 2px solid var(--ok); }
.sheet.bad { background: var(--err-soft); border-top: 2px solid var(--err); }
.sheet h3 { color: var(--ok); } .sheet.bad h3 { color: var(--err); }
.sheet .expl { white-space: pre-line; font-size: .95rem; max-height: 38vh; overflow: auto; }
.sheet.bad .btn { background: var(--err); box-shadow: 0 4px 0 #7d1522; }
@keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.footer-action { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom)); margin-top: 18px; }
.lesson-pad { padding-bottom: 260px; }

/* =====================================================================
   6. QUIZ RELÂMPAGO (estilo Kahoot)
   ===================================================================== */
.k-question { background: var(--surface); border-radius: var(--radius); padding: 16px; font-weight: 800; font-size: 1.15rem; text-align: center; box-shadow: var(--shadow); margin-bottom: 12px; min-height: 90px; display: flex; align-items: center; justify-content: center; }
.k-timer { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.k-timer .t { width: 52px; height: 52px; border-radius: 50%; background: #46178f; color: #fff; font-weight: 900; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; flex: none; }
.k-timer .progress > div { background: #46178f; transition: width .1s linear; }
.k-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.k-tile { border: 0; border-radius: 12px; color: #fff; font-weight: 800; padding: 16px 10px; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 0 rgba(0,0,0,.25); text-align: center; font-size: .95rem; }
.k-tile .shape { font-size: 1.6rem; line-height: 1; }
.k-tile.red { background: var(--k-red); } .k-tile.blue { background: var(--k-blue); }
.k-tile.yellow { background: var(--k-yellow); } .k-tile.green { background: var(--k-green); }
.k-tile.dim { opacity: .3; }
.k-result { text-align: center; padding: 24px 12px; border-radius: var(--radius); color: #fff; margin-bottom: 12px; }
.k-result.ok { background: var(--k-green); } .k-result.bad { background: var(--k-red); }
.k-result .pts { font-size: 2rem; font-weight: 900; }
.rank { list-style: none; padding: 0; margin: 0; }
.rank li { display: flex; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); margin-bottom: 6px; font-weight: 600; }
.rank li:first-child { background: color-mix(in srgb, var(--gold) 30%, var(--surface)); }
.pass-screen { text-align: center; padding: 50px 10px; }
.pass-screen .big { font-size: 4rem; }

/* =====================================================================
   7. FLASHCARDS (virar carta)
   ===================================================================== */
.flip { perspective: 1000px; height: 300px; margin-bottom: 14px; }
.flip .inner { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.flip.on .inner { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; background: var(--surface); border: 2px solid var(--border); box-shadow: 0 6px 0 var(--border); display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; font-size: 1.15rem; font-weight: 700; overflow: auto; }
.flip .back { transform: rotateY(180deg); border-color: var(--c-formula); box-shadow: 0 6px 0 var(--c-formula); font-weight: 600; }
.flip .hint { position: absolute; bottom: 10px; left: 0; right: 0; font-size: .75rem; color: var(--muted); font-weight: 600; }
.self-eval { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.self-eval .btn { padding: 12px 6px; font-size: .8rem; }

/* =====================================================================
   8. CONQUISTAS, PERFIL, GRÁFICOS
   ===================================================================== */
.ach { display: flex; gap: 12px; align-items: center; }
.ach .ico { font-size: 2rem; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--surface-2); flex: none; }
.ach.locked .ico { filter: grayscale(1); opacity: .35; }
.ach.locked .nm { color: var(--muted); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
.stat .v { font-size: 1.5rem; font-weight: 900; }
.stat .l { font-size: .8rem; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-top: 18px; border-bottom: 1px solid var(--border); }
.bars .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; }
.bars .b .fill { width: 100%; max-width: 22px; background: var(--primary); border-radius: 4px 4px 0 0; min-height: 2px; }
.bars .b.today .fill { background: var(--gold); }
.bars .b .val { position: absolute; top: -2px; font-size: .68rem; font-weight: 700; color: var(--text); }
.bars-x { display: flex; gap: 4px; }
.bars-x span { flex: 1; text-align: center; font-size: .62rem; color: var(--muted); }
.hbar { margin-bottom: 10px; }
.hbar .top { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 600; margin-bottom: 3px; }
.hbar .progress { height: 10px; }
.level-card { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: 0; }
.level-card .progress { background: rgba(255,255,255,.25); }
.level-card .progress > div { background: #fff; }

/* Configurações */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 70px; padding: 10px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); font-weight: 700; }
.seg button.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
textarea { width: 100%; min-height: 90px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); padding: 10px; font-family: ui-monospace, monospace; font-size: .75rem; color: var(--text); }
input[type="text"] { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); }
input[type="range"] { width: 100%; }

/* Toast (aviso rápido) e confete */
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 60; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 92vw; text-align: center; animation: drop .25s; }
@keyframes drop { from { transform: translate(-50%, -30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
.errbox { background: var(--err-soft); color: var(--err); border: 2px solid var(--err); border-radius: 12px; padding: 10px; font-size: .85rem; margin: 10px 0; white-space: pre-line; }
.ouvindo .app { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
.listen-bar { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 35; display: flex; justify-content: center; padding: 0 16px; }
.listen-bar .inner { width: 100%; max-width: 560px; background: #46178f; color: #fff; border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.listen-bar button { background: rgba(255,255,255,.2); border: 0; color: #fff; border-radius: 10px; padding: 6px 10px; font-weight: 800; }

/* Níveis de estudo, capa da lição, glossário */
.lvl-cards { display: grid; gap: 10px; margin: 10px 0 14px; }
.lvl-card { text-align: left; border: 2px solid var(--border); border-radius: 14px; padding: 12px 14px; background: var(--surface); box-shadow: 0 3px 0 var(--border); width: 100%; }
.lvl-card.on { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 3px 0 var(--primary); }
.lvl-card .t { font-weight: 800; }
.lvl-card .st { float: right; font-size: .8rem; font-weight: 700; color: var(--ok); }
.chip-nivel { display: inline-block; font-size: .75rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; }
.node .lvls { font-size: .85rem; margin-top: 2px; letter-spacing: 2px; }
.node .lvls i { font-style: normal; opacity: .25; filter: grayscale(1); }
.node .lvls i.on { opacity: 1; filter: none; }
.obj-list { margin: 6px 0 0; padding-left: 20px; }
.obj-list li { margin-bottom: 4px; }
.bloco table.legenda { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .88rem; }
.bloco table.legenda td { border-top: 1px solid var(--border); padding: 4px 6px; vertical-align: top; }
.bloco table.legenda td:first-child { font-weight: 800; white-space: nowrap; color: var(--c-formula); width: 1%; }
.bloco.exemplo { border-color: var(--c-formula); } .bloco.exemplo .tag { color: var(--c-formula); }
.bloco.limitacao { border-color: var(--c-atencao); } .bloco.limitacao .tag { color: var(--c-atencao); }
.bloco.contexto, .bloco.passos, .bloco.referencia { border-color: var(--border); }
.bloco ul, .bloco ol { margin: 6px 0 0; padding-left: 20px; }
.glos-item { padding: 10px 0; border-top: 1px solid var(--border); }
.glos-item:first-child { border-top: 0; }
.criterios label { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; font-size: .95rem; }
.just { list-style: none; padding: 0; margin: 8px 0 0; }
.just li { margin-bottom: 6px; }

/* =====================================================================
   9. EXPERIÊNCIA "PROBLEMA": início, busca, caminhos, fichas de consulta
   Um único componente de linha (.mini) serve para resultados de busca,
   problemas, ferramentas, histórico, favoritos e opções de estudo.
   ===================================================================== */
a.btn { text-decoration: none; text-align: center; }
.home-hello { padding: 4px 0 2px; }
.home-hello h1 { font-size: 1.65rem; margin-bottom: 2px; }
.lead { color: var(--muted); font-size: 1.02rem; margin: 0 0 14px; }
.busca-grande { position: relative; margin: 2px 0 8px; }
.busca-grande .lupa { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; pointer-events: none; }
.busca-grande input { width: 100%; min-height: 56px; padding: 14px 16px 14px 46px; font-size: 1.05rem; border-radius: 16px; border: 2px solid var(--border); background: var(--surface); color: var(--text); box-shadow: var(--shadow); -webkit-appearance: none; appearance: none; }
.busca-grande input:focus { outline: none; border-color: var(--c-formula); }
.lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.mini { display: flex; gap: 12px; align-items: center; padding: 12px 14px; min-height: 60px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); text-decoration: none; color: inherit; box-shadow: var(--shadow); }
.mini .mi { font-size: 1.45rem; width: 34px; text-align: center; flex: none; }
.mini .mtx { min-width: 0; }
.mini b { display: block; line-height: 1.3; }
.mini .ms { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: .84rem; color: var(--muted); margin-top: 2px; }
.mini .chev { color: var(--muted); font-size: 1.3rem; flex: none; }
.eyebrow { display: block; font-size: .7rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 1px; }
.badge-in { background: var(--err); color: #fff; font-size: .72rem; font-weight: 800; border-radius: 999px; padding: 1px 8px; flex: none; }
.path-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 8px; }
.path-card { display: flex; flex-direction: column; gap: 6px; min-height: 150px; padding: 16px 14px; border-radius: 20px; color: #fff; text-decoration: none; box-shadow: 0 5px 0 rgba(0,0,0,.22); position: relative; }
.path-card:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
.path-card .pi { font-size: 2rem; line-height: 1; }
.path-card b { font-size: 1.08rem; line-height: 1.2; }
.path-card .pd { font-size: .82rem; line-height: 1.3; opacity: .96; }
.path-card.prob { background: linear-gradient(135deg, #b3261e, #c2410c); }
.path-card.cons { background: linear-gradient(135deg, #1a4fa0, #1f5fbf); }
.path-card.desa { background: linear-gradient(135deg, #5b33a8, #6a3fc1); }
.path-card.estu { background: linear-gradient(135deg, #146c3a, #1a7f45); }
.path-card .selo { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,.25); border-radius: 999px; font-size: .7rem; font-weight: 800; padding: 2px 8px; }
.sec-t { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 8px; }
.estagio-line { display: block; padding: 11px 14px; border-radius: 12px; border: 1px dashed var(--border); color: var(--muted); text-decoration: none; font-size: .88rem; margin: 8px 0 14px; }
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 12px; text-decoration: none; color: inherit; min-height: 100px; display: flex; flex-direction: column; gap: 4px; position: relative; box-shadow: var(--shadow); text-align: left; font: inherit; width: 100%; }
.cat-card .ci { font-size: 1.7rem; line-height: 1.1; }
.cat-card small { color: var(--muted); font-size: .78rem; line-height: 1.25; }
.cat-card.fav { border: 2px solid var(--primary); }
.cat-card.on { border: 2px solid var(--primary); background: var(--primary-soft); }
.cat-card .star { position: absolute; top: 8px; right: 10px; font-size: .8rem; }
/* Estudar em 3 blocos (abas) e filtro de nível; Início enxuto */
.abas { display: flex; gap: 4px; padding: 4px; margin: 4px 0 12px; border-radius: 14px; background: var(--surface-2); }
.abas a { flex: 1; text-align: center; padding: 9px 4px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 800; font-size: .92rem; }
.abas a.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.nivel-filtro { display: flex; gap: 6px; margin-bottom: 4px; }
.nivel-filtro button { flex: 1; min-height: 40px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font-weight: 700; font-size: .85rem; cursor: pointer; }
.nivel-filtro button.on { border-color: var(--primary); background: var(--primary-soft); }
.home-desafio { padding: 14px; }
.home-desafio .q-enunciado { font-size: 1rem; }
.home-rev { gap: 8px; }
.topbar .avatar { font-size: 1.1rem; }
.chips-row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.chips-row a { flex: 0 0 auto; }
.carregando { text-align: center; padding: 60px 16px; }
.carregando .spin { width: 36px; height: 36px; margin: 0 auto 12px; border-radius: 50%; border: 4px solid var(--border); border-top-color: var(--primary); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.chips-sug { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.chips-sug a { display: inline-flex; align-items: center; min-height: 40px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); text-decoration: none; color: var(--text); font-weight: 600; font-size: .88rem; }
.ficha-head { margin-bottom: 6px; }
.ficha-head h1 { font-size: 1.5rem; margin: 2px 0 4px; }
.favbtn { border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; min-height: 40px; font-weight: 700; font-size: .88rem; background: var(--surface); }
.favbtn.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 16%, var(--surface)); }
.cnav { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 6px; margin: 0 -2px; }
.cnav button { flex: none; min-height: 40px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 700; font-size: .85rem; }
.csec { margin: 20px 0; scroll-margin-top: 70px; }
.csec > h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; font-size: 1.12rem; }
.csec > h2 small { font-size: .8rem; color: var(--muted); font-weight: 600; }
.resumo-box { background: color-mix(in srgb, var(--c-formula) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c-formula) 35%, var(--border)); border-radius: 16px; padding: 14px; font-size: 1.02rem; }
.resumo-box p:last-child { margin-bottom: 0; }
.dados-list { margin: 6px 0 0; padding-left: 20px; }
.fx-l { padding: 7px 0; border-top: 1px solid var(--border); }
.fx-l:first-of-type { border-top: 0; }
.fx-l .fx { display: block; font-family: "Cambria Math", "Times New Roman", serif; font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.alvo { outline: 3px solid var(--c-formula); outline-offset: 4px; border-radius: 12px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* =====================================================================
   ESTILO PROFISSIONAL (v2) — público de engenharia
   Sóbrio, denso e legível: azul petróleo + âmbar, Inter no texto,
   JetBrains Mono em números, fórmulas e tabelas, ícones de linha.
   Esta camada vem por último e substitui o visual anterior.
   ===================================================================== */
@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(vendor/fontes/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;src:url(vendor/fontes/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url(vendor/fontes/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:700;font-display:swap;src:url(vendor/fontes/inter-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400;font-display:swap;src:url(vendor/fontes/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:600;font-display:swap;src:url(vendor/fontes/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #eef2f5; --text: #14212b; --muted: #546270; --border: #d8e0e6;
  --primary: #0f4c5c; --primary-dark: #0a3742; --primary-texto: #0f4c5c; --primary-soft: #e2edf0;
  --accent: #c27803; --accent-soft: #fdf3e1; --gold: #c27803; --locked: #c8d1d8;
  --ok: #1e7f4f; --ok-soft: #e3f2ea; --err: #b42318; --err-soft: #fdecea; --warn: #b54708; --warn-soft: #fef0c7; --info: #175cd3; --info-soft: #e8f0fe;
  --c-conceito: #0f4c5c; --c-atencao: #b54708; --c-dica: #1e7f4f; --c-formula: #175cd3; --c-conexao: #6941c6;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08); --radius: 12px;
  --fonte: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1418; --surface: #142028; --surface-2: #1b2a33; --text: #e5edf2; --muted: #93a4b0; --border: #283a45;
  --primary: #3d93a8; --primary-dark: #2b7487; --primary-texto: #6cbfd3; --primary-soft: #12313b; --accent: #f0b03c; --accent-soft: #3a2c10; --gold: #f0b03c; --locked: #33444f;
  --ok: #48b57e; --ok-soft: #133024; --err: #f0766b; --err-soft: #3b1d1b; --warn: #f2a453; --warn-soft: #3a2812; --info: #6aa5ff; --info-soft: #14243f;
  --c-conceito: #6cbfd3; --c-atencao: #f2a453; --c-dica: #48b57e; --c-formula: #6aa5ff; --c-conexao: #a98bfa; --shadow: 0 1px 2px rgba(0,0,0,.4); } }
:root[data-theme="dark"] {
  --bg: #0d1418; --surface: #142028; --surface-2: #1b2a33; --text: #e5edf2; --muted: #93a4b0; --border: #283a45;
  --primary: #3d93a8; --primary-dark: #2b7487; --primary-texto: #6cbfd3; --primary-soft: #12313b; --accent: #f0b03c; --accent-soft: #3a2c10; --gold: #f0b03c; --locked: #33444f;
  --ok: #48b57e; --ok-soft: #133024; --err: #f0766b; --err-soft: #3b1d1b; --warn: #f2a453; --warn-soft: #3a2812; --info: #6aa5ff; --info-soft: #14243f;
  --c-conceito: #6cbfd3; --c-atencao: #f2a453; --c-dica: #48b57e; --c-formula: #6aa5ff; --c-conexao: #a98bfa; --shadow: 0 1px 2px rgba(0,0,0,.4); }
body { font-family: var(--fonte); font-size: 15.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -.01em; } h2 { font-size: 1.12rem; font-weight: 650; } h3 { font-size: 1rem; font-weight: 650; }
.num, .mono, code, kbd, .fx, .stat .v, .numinput, .tabela td.n, .tab-num td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
/* ícones de linha */
.ic { width: 1.15em; height: 1.15em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
.ic.lg { width: 1.5em; height: 1.5em; } .ic.xl { width: 2em; height: 2em; }
.ic-box { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: var(--primary-soft); color: var(--primary-texto); flex: none; }
.ic-box .ic { width: 20px; height: 20px; }
h1 .ic, h2 .ic { color: var(--primary-texto); margin-right: 6px; }
/* barras */
.topbar { background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom-color: var(--border); }
.chip { font-weight: 600; font-size: .85rem; padding: 4px 10px; border-radius: 8px; gap: 6px; box-shadow: none; }
.chip .ic { width: 15px; height: 15px; }
.chip.off { filter: none; }
.nav { box-shadow: 0 -1px 0 var(--border); border-top: 0; }
.nav a { font-size: .7rem; font-weight: 600; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.nav a .ic { width: 22px; height: 22px; stroke-width: 1.9; }
.nav a.active { color: var(--primary-texto); }
.nav a.active .ic { stroke-width: 2.3; }
/* botões e cartões */
.btn { border-radius: 10px; padding: 12px 16px; font-weight: 600; letter-spacing: 0; text-transform: none; font-size: .95rem; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.sec { border: 1px solid var(--border); box-shadow: var(--shadow); background: var(--surface); color: var(--text); }
.btn.danger { box-shadow: var(--shadow); }
.btn.small { padding: 8px 12px; font-size: .85rem; display: inline-flex; }
.card, .bloco, .stat, details.periodo, .tile { border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
.bloco { border-left-width: 3px; }
.bloco .tag { font-size: .7rem; letter-spacing: .06em; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.progress { height: 8px; } .progress > div { background: var(--primary); }
.stat .v { font-size: 1.35rem; font-weight: 600; }
.opt { border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); font-weight: 500; padding: 12px 14px; }
.opt.sel { box-shadow: 0 0 0 2px var(--c-formula) inset; }
.opt.ok { box-shadow: 0 0 0 2px var(--ok) inset; } .opt.bad { box-shadow: 0 0 0 2px var(--err) inset; }
.q-enunciado { font-size: 1.05rem; font-weight: 600; line-height: 1.45; }
.sheet { box-shadow: 0 -6px 20px rgba(0,0,0,.12); } .sheet.bad .btn { box-shadow: var(--shadow); }
.pchips a { border: 1px solid var(--border); border-radius: 8px; font-weight: 600; } .pchips a.on { border-color: var(--primary); color: var(--primary-texto); }
.chips-sug a { border-radius: 8px; font-weight: 500; }
.lvl-card { border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); }
.seg button.on { color: var(--primary-texto); }
.level-card { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
/* tabelas técnicas: cabeçalho fixo, números à direita, rolagem horizontal no celular */
.tabela { overflow: auto; max-height: 70vh; border: 1px solid var(--border); border-radius: 10px; margin: 8px 0; -webkit-overflow-scrolling: touch; }
.tabela table { border-collapse: separate; border-spacing: 0; font-size: .85rem; min-width: 100%; }
.tabela th, .tabela td { border: 0; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 6px 9px; white-space: nowrap; }
.tabela th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); font-weight: 600; font-family: var(--fonte); text-align: left; }
.tabela td.n, .tabela th.n { text-align: right; }
.tabela th:first-child, .tabela td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; font-family: var(--fonte); text-align: left; }
.tabela th:first-child { z-index: 2; background: var(--surface-2); }
.tabela td.txt { white-space: normal; min-width: 160px; font-family: var(--fonte); }
.tabela td:not(.n) { white-space: normal; min-width: 7em; max-width: 22em; font-family: var(--fonte); }
/* fórmulas (KaTeX) com legenda de variáveis */
.formula-box { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin: 8px 0; overflow-x: auto; }
.formula-box .katex-display { margin: .2em 0; }
.formula-box .fx-txt { font-family: var(--mono); font-size: .92rem; }
.formula-box .sig { font-size: .85rem; color: var(--muted); margin-top: 4px; }
.fx-l.formula-box { border-top: 0; }
/* busca agrupada por assunto */
.assuntos { display: grid; gap: 10px; margin: 8px 0 14px; }
.assunto-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.assunto-card .ac-head { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px 8px; text-decoration: none; color: var(--text); }
.assunto-card .ac-head b { display: block; font-size: 1.02rem; }
.assunto-card .ms { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: .88rem; }
.ac-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px 62px; }
.chip-a { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); text-decoration: none; font-size: .82rem; font-weight: 500; }
.chip-a .ic { width: 15px; height: 15px; color: var(--primary); }
.chip-a .num, .abas-t .num, .chip-f .num { font-family: var(--mono); font-size: .78em; color: var(--muted); }
.chip-a:hover { border-color: var(--primary); }
.rel-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rel-chips a { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); text-decoration: none; color: var(--text); font-size: .85rem; background: var(--surface); }
@media (max-width: 420px) { .ac-chips { padding-left: 14px; } }
/* página do assunto em abas */
.abas-t { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--border); margin: 10px 0 14px; scrollbar-width: none; position: sticky; top: 0; background: var(--bg); z-index: 3; }
.abas-t::-webkit-scrollbar { display: none; }
.abas-t button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; font: inherit; font-weight: 600; font-size: .9rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
.abas-t button.on { color: var(--primary); border-bottom-color: var(--primary); }
.filtro-nivel { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-f { min-height: 36px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font: inherit; font-size: .88rem; cursor: pointer; color: var(--text); }
.chip-f.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, var(--surface)); color: var(--primary); font-weight: 600; }
.prog { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 6px 0 10px; }
.prog > div { height: 100%; background: var(--primary); border-radius: 3px; transition: width .3s; }
.selo.ok { background: var(--ok-soft); color: var(--ok); }
.selo .ic { width: 13px; height: 13px; }
/* tela Exercícios */
.stats-ex { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0 4px; }
.stats-ex > div { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.stats-ex .v { font-size: 1.3rem; font-weight: 600; }
@media (max-width: 480px) { .stats-ex { grid-template-columns: repeat(2, 1fr); } }
.modos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.modo { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font: inherit; color: var(--text); cursor: pointer; }
.modo .ic { width: 20px; height: 20px; color: var(--primary); }
.modo.on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: color-mix(in srgb, var(--primary) 7%, var(--surface)); }
.filtros-ex { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.filtros-ex label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
.filtros-ex select, .comecar-ex select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; min-height: 42px; width: 100%; }
.comecar-ex select { width: auto; min-height: 36px; padding: 6px 8px; }
@media (max-width: 560px) { .filtros-ex { grid-template-columns: 1fr; } }
.comecar-ex { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 16px 0; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.comecar-ex .btn { margin-left: auto; }
.sess-top { align-items: center; gap: 10px; }
.sess-top .small:first-child { flex: 1; }
button.link { background: none; border: 0; color: var(--primary); font: inherit; cursor: pointer; padding: 4px; }
.relogio { font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); }
.relogio.pouco { background: var(--err-soft, #fde8e8); color: var(--err, #b42318); }
.destaque { font-size: 1.8rem; font-weight: 700; margin: 8px 0 0; color: var(--primary); }
.correcao { display: grid; gap: 6px; }
.corr { border: 1px solid var(--border); border-left: 4px solid var(--ok); border-radius: 8px; padding: 8px 12px; background: var(--surface); }
.corr.bad { border-left-color: var(--err, #b42318); }
.corr summary { cursor: pointer; font-size: .9rem; }
.corr summary .num { color: var(--muted); margin-right: 4px; }
.lvl-card.travado { opacity: .65; }
.prog-lista { display: grid; gap: 8px; margin-bottom: 8px; }
.prog-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--text); }
.prog-item .grow { display: flex; flex-direction: column; min-width: 0; }
.prog-item b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.prog-item .prog { grid-column: 1 / -1; margin: 4px 0 0; display: block; }
.prog-item .prog > span { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
#app p.small > a, #app a.link { color: var(--primary); text-decoration: none; font-weight: 500; }
#app p.small > a:hover, #app a.link:hover { text-decoration: underline; }
.fx[data-k="1"] { font-family: inherit; font-weight: 400; overflow-x: auto; overflow-y: hidden; max-width: 100%; }
.fx-l .fx[data-k="1"], .a4 .fx[data-k="1"] { font-size: 1.08rem; padding: 2px 0; }
.bloco.formula b.fx[data-k="1"] { display: block; padding: 6px 0; font-size: 1.08rem; }
.fx .katex { white-space: normal; }
.a4 .fx[data-k="1"] { font-size: 1em; font-weight: 400; }
.a4 .fx .katex { white-space: normal; font-size: 1em; }
.legenda-var { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; font-size: .82rem; margin-top: 6px; color: var(--text); }
.legenda-var .s { font-family: var(--mono); color: var(--primary-texto); }
.legenda-var .u { font-family: var(--mono); color: var(--muted); text-align: right; }
.katex { font-size: 1.08em; }
/* selo de nível */
.selo { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
.selo.facil { background: var(--ok-soft); color: var(--ok); } .selo.medio { background: var(--info-soft); color: var(--info); }
.selo.dificil, .selo.especialista { background: #1b1f24; color: #f0b03c; }
</style>

// Data local no formato AAAA-MM-DD
function hoje(offsetDias = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDias);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function somarDias(dataStr, dias) {
  const [a, m, d] = dataStr.split("-").map(Number);
  const dt = new Date(a, m - 1, d + dias);
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
}
function embaralhar(lista) {
  const a = lista.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Protege contra HTML malicioso/quebrado e aplica **negrito**, *itálico* e quebras de linha
function esc(t) { return String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
// Siglas (conteudo/siglas.js): na primeira vez que aparece em cada texto, a sigla ganha o significado
// entre parênteses — "CPI (índice de desempenho de custo)". Não explica quando já há parênteses ao lado,
// quando o contexto não define o sentido, nos mapas A4 (semSiglas) nem quando entregaria a resposta (siglasBloqueadas).
let semSiglas = false, siglasBloqueadas = null, _siglas = null;
function prepararSiglas() {
  const por = new Map();
  (window.SIGLAS || []).forEach(([s, sig, ctx]) => { if (!por.has(s)) por.set(s, []); por.get(s).push({ sig, ctx: ctx ? new RegExp(ctx) : null }); });
  const chaves = [...por.keys()].sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\&]/g, "\\$&"));
  _siglas = { por, re: chaves.length ? new RegExp(`(?<![A-Za-zÀ-ÿ0-9&/])(${chaves.join("|")})((?<=NR|ISO|NBR)[- ]\\d(?:[\\d./:-]*\\d)?)?(?![A-Za-zÀ-ÿ0-9&/])`, "g") : null };
}
function expandirSiglas(t) {
  if (semSiglas || !t) return t;
  if (!_siglas) prepararSiglas();
  if (!_siglas.re) return t;
  const feitas = new Set(), txt0 = String(t);
  const achar = s => { const l = _siglas.por.get(s); return l && l.find(x => !x.ctx || x.ctx.test(txt0)); };
  // Pares com barra ("IDC/CPI", "PMP/MPS"): um só parêntese; se os sentidos diferem, os dois
  t = txt0.replace(/(?<![A-Za-zÀ-ÿ0-9&/])([A-Z][A-Za-z0-9&]{1,6})\/([A-Z][A-Za-z0-9&]{1,6})(?![A-Za-zÀ-ÿ0-9&/])(?!\**\s*\()/g, (m, a, b) => {
    const ea = achar(a), eb = achar(b);
    if (!ea || !eb || feitas.has(a) || feitas.has(b) || (siglasBloqueadas && (siglasBloqueadas.has(a) || siglasBloqueadas.has(b)))) return m;
    feitas.add(a); feitas.add(b);
    return norm(ea.sig) === norm(eb.sig) ? `${m} (${ea.sig})` : `${m} (${ea.sig} / ${eb.sig})`;
  });
  return t.replace(_siglas.re, (m, s, num, pos, txt) => {
    if (feitas.has(s) || (siglasBloqueadas && siglasBloqueadas.has(s))) return m;
    const antes = txt.slice(Math.max(0, pos - 3), pos), depois = txt.slice(pos + m.length);
    if (/\(\s*\**$/.test(antes) || /^\**\s*\(/.test(depois) || /^\**\s*\/[A-Z]/.test(depois) || /[A-Z]\/\**$/.test(antes)) { feitas.add(s); return m; }
    const e = _siglas.por.get(s).find(x => !x.ctx || x.ctx.test(txt));
    if (!e) return m;
    feitas.add(s);
    return `${m} (${e.sig})`; // "NR-12", "ISO 9001": o número já vem junto da sigla em m
  });
}
// Bloqueia a explicação das siglas cujo significado aparece nas alternativas (senão entregaria a resposta)
function bloquearSiglas(textos) {
  if (!_siglas) prepararSiglas();
  const alvo = norm(textos.join(" | "));
  const b = new Set();
  _siglas.por.forEach((lista, s) => { if (lista.some(x => { const n = norm(x.sig); return alvo.includes(n.slice(0, Math.min(n.length, 16))); })) b.add(s); });
  return b;
}
function bloqueioDaQuestao(q) {
  if (!_siglas) prepararSiglas();
  if (/sigla|significa|quer dizer|abreviaç/i.test((q.pergunta || "") + " " + (q.contexto || ""))) return new Set(_siglas.por.keys());
  return bloquearSiglas([...(q.opcoes || []), ...(q.pares || []).flat(), ...(q.itens || [])].map(String));
}
function fmt(t) {
  // equações em negrito ("**Q* = √(2DS ÷ H)**") viram fórmulas KaTeX; ficam protegidas da expansão de siglas
  const eqs = [];
  t = String(t ?? "").replace(/\*\*([^*\n]+)\*\*/g, (m, f) => /[=≈≤≥]/.test(f) ? (eqs.push(f.trim()), `\u0001${eqs.length - 1}\u0001`) : m);
  t = expandirSiglas(t);
  const inl = x => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/\u0001(\d+)\u0001/g, (m, i) => htmlFx(eqs[i], "b"));
  // Tabelas simples em Markdown (linhas começando com "|"); o resto vira texto com quebras de linha
  const linhas = String(t ?? "").split("\n"), out = [];
  for (let i = 0; i < linhas.length; i++) {
    if (!/^\s*\|/.test(linhas[i])) { out.push(inl(linhas[i]) + (i < linhas.length - 1 && !/^\s*\|/.test(linhas[i + 1] || "") ? "<br>" : "")); continue; }
    const tab = [];
    while (i < linhas.length && /^\s*\|/.test(linhas[i])) tab.push(linhas[i++]);
    i--;
    const cel = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
    const corpo = tab.filter(l => !/^\s*\|[\s:|-]+\|\s*$/.test(l));
    out.push('<div class="tabela"><table>' + corpo.map((l, k) => "<tr>" + cel(l).map(c => k === 0 ? `<th>${inl(c)}</th>` : `<td${ehNum(c) ? ' class="n"' : ""}>${inl(c)}</td>`).join("") + "</tr>").join("") + "</table></div>");
  }
  return out.join("");
}
// célula numérica (alinhada à direita): "1.250", "−3,5", "R$ 12", "85%", "12 h", "**40**"
function ehNum(c) { return /^\**\s*[−-]?\s*(R\$\s*)?[\d.,]+\s*(%|h|min|d|un|kg|t|m)?\s*\**$/.test(String(c).trim()) && /\d/.test(c); }
function numeroBR(n) { return Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 2 }); }

/* ---------------------------------------------------------------------
   CONTEÚDO: índices para achar módulos, lições e questões rapidamente
   --------------------------------------------------------------------- */
let MODS = [];            // módulos ordenados pela trilha
let LICOES = [];          // todas as lições em ordem
const Q = {};             // id -> questão (com .modulo e .licao)
const CARTAS = {};        // id -> flashcard
const errosConteudo = []; // problemas encontrados nos arquivos de conteúdo

function prepararConteudo() {
  MODS = (window.MODULOS || []).slice().sort((a, b) => (a.ordem ?? a.numero) - (b.ordem ?? b.numero));
  (window.DISCIPLINAS || []).slice().sort((a, b) => a.periodo - b.periodo).forEach((d, k) => {
    try { MODS.push(disciplinaParaModulo(d, k)); } catch (e) { errosConteudo.push(`Disciplina "${d.nome || d.id}": ${e.message}`); }
  });
  // Banco de questões extra (conteudo/banco-questoes.js): cada item diz em que lição entra
  (window.BANCO || []).forEach(item => {
    const l = MODS.flatMap(m => m.licoes || []).find(x => x.id === item.licao);
    if (!l) { errosConteudo.push(`Banco: lição "${item.licao}" não existe (questão ${item.id})`); return; }
    const q = Object.assign({}, item); delete q.licao;
    (l.questoes = l.questoes || []).push(q);
  });
  const ids = new Set();
  MODS.forEach(m => {
    if (!m.id || !Array.isArray(m.licoes)) { errosConteudo.push(`Módulo "${m.titulo || "?"}" sem id ou sem licoes.`); return; }
    m.licoes.forEach(l => {
      l.modulo = m.id;
      LICOES.push(l);
      (l.blocos || []).forEach(b => { if (b.nivel && !ORDEM_NIVEIS.includes(b.nivel)) errosConteudo.push(`${l.id}: bloco com nível inválido "${b.nivel}"`); });
      (l.questoes || []).forEach(q => {
        if (ids.has(q.id)) errosConteudo.push(`ID de questão repetido: ${q.id}`);
        ids.add(q.id);
        q.modulo = m.id; q.licao = l.id;
        validarQuestao(q);
        Q[q.id] = q;
      });
    });
    (m.flashcards || []).forEach(c => { c.modulo = m.id; CARTAS[c.id] = c; });
  });
  validarProblemas();
}
function validarQuestao(q) {
  if (q._stub) return; // esboço do catálogo: a questão completa é validada ao carregar o módulo
  const erro = msg => errosConteudo.push(`${q.id}: ${msg}`);
  if (!q.pergunta) erro("falta 'pergunta'");
  if (["multipla", "lacuna", "caso"].includes(q.tipo)) {
    if (!Array.isArray(q.opcoes) || q.opcoes.length < 2) erro("precisa de 'opcoes' (lista)");
    else if (!(q.correta >= 0 && q.correta < q.opcoes.length)) erro("'correta' fora da lista de opções");
  } else if (q.tipo === "vf") { if (typeof q.correta !== "boolean") erro("'correta' deve ser true ou false"); }
  else if (q.tipo === "ligar") { if (!Array.isArray(q.pares) || q.pares.length < 2) erro("precisa de 'pares'"); }
  else if (q.tipo === "ordenar") { if (!Array.isArray(q.itens) || q.itens.length < 2) erro("precisa de 'itens'"); }
  else if (q.tipo === "calculo") { if (typeof q.resposta !== "number" && !q.variaveis) erro("'resposta' deve ser número"); }
  else if (q.tipo === "discursiva") { if (!q.respostaModelo) erro("discursiva precisa de 'respostaModelo'"); }
  else erro(`tipo desconhecido "${q.tipo}"`);
  if (q.nivel && !ORDEM_NIVEIS.includes(q.nivel)) erro(`nível inválido "${q.nivel}" (use facil, medio ou dificil)`);
  if (q.variaveis) Parametros.validar(q).forEach(msg => erro("modelo com números sorteados: " + msg));
  if (q.justificativas && (!q.opcoes || q.justificativas.length !== q.opcoes.length)) erro("'justificativas' deve ter o mesmo tamanho de 'opcoes'");
}
const modulo = id => MODS.find(m => m.id === id);
const licaoConcluida = id => !!S.licoes[id];
function licaoLiberada(id) {
  if (licaoConcluida(id)) return true;
  const i = LICOES.findIndex(l => l.id === id);
  if (i === 0) return true;
  if (i < 0) return false;
  // Trilha paralela: a 1ª lição de um módulo com "liberaApos" depende só desses módulos
  const m = modulo(LICOES[i].modulo);
  if (m && m.grade && m.licoes[0].id === id) return true; // cada disciplina da grade começa liberada
  if (m && m.liberaApos && m.licoes[0].id === id)
    return [].concat(m.liberaApos).every(mid => { const pre = modulo(mid); return pre && moduloConcluido(pre); });
  return licaoConcluida(LICOES[i - 1].id);
}
/* Sorteio das questões da lição (banco de questões):
   prioriza as nunca vistas e as que você mais erra, variando os tipos. */
function selecionarQuestoes(pool, n) {
  if (!n || pool.length <= n) return embaralhar(pool);
  const peso = q => {
    const st = S.questoes[q.id];
    if (!st) return 3 + Math.random();
    return (st.erros > st.acertos ? 2 : 0) + (S.revisao[q.id] ? 1 : 0) + Math.random() * 1.5;
  };
  const ordem = pool.map(q => ({ q, p: peso(q) })).sort((a, b) => b.p - a.p);
  const escolhidas = [], tipos = new Set();
  ordem.forEach(x => { if (escolhidas.length < n && !tipos.has(x.q.tipo)) { escolhidas.push(x.q); tipos.add(x.q.tipo); } });
  ordem.forEach(x => { if (escolhidas.length < n && !escolhidas.includes(x.q)) escolhidas.push(x.q); });
  return embaralhar(escolhidas);
}
function moduloLiberado(m) { return m.licoes.length > 0 && licaoLiberada(m.licoes[0].id); }
function moduloConcluido(m) { return m.licoes.every(l => licaoConcluida(l.id)); }
function proximaLicao() { return LICOES.find(l => !licaoConcluida(l.id) && licaoLiberada(l.id)); }
/* ---- Níveis de estudo: helpers ----
   Um bloco/questão SEM "nivel" aparece em todos os níveis da lição.
   Uma lição sem nenhum item com "nivel" é tratada como "nível único". */
function niveisDaLicao(l) {
  const set = new Set();
  (l.blocos || []).concat(l.questoes || []).forEach(x => { if (x.nivel) set.add(x.nivel); });
  const lista = ORDEM_NIVEIS.filter(n => set.has(n));
  return lista.length ? lista : ["unico"];
}
function doNivel(lista, nivel) { return (lista || []).filter(x => nivel === "unico" || !x.nivel || x.nivel === nivel); }
// Campo que pode ser comum a todos os níveis (texto/lista) ou separado ({ facil, medio, dificil })
function porNivel(valor, nivel) {
  if (valor == null) return null;
  if (typeof valor === "string" || Array.isArray(valor)) return valor;
  return valor[nivel] ?? null;
}
function registroNivel(id, n) { const r = S.licoes[id]; return r && r.niveis ? r.niveis[n] : null; }
function nivelConcluido(id, n) { return n === "unico" ? licaoConcluida(id) : !!registroNivel(id, n); }
function moduloTemNiveis(m) { return m.licoes.some(l => niveisDaLicao(l)[0] !== "unico"); }
// O quiz usa só questões até o nível padrão escolhido
function nivelPermitido(q) { return !q.nivel || NIVEIS_ESTUDO[q.nivel].ordem <= (NIVEIS_ESTUDO[S.config.nivel] || NIVEIS_ESTUDO.facil).ordem; }
// Questões de módulos já liberados (para quiz e treino)
function questoesLiberadas(filtro) {
  return Object.values(Q).filter(q => licaoConcluida(q.licao) || licaoLiberada(q.licao)).filter(filtro || (() => true));
}

/* ---------------------------------------------------------------------
   XP, NÍVEL, OFENSIVA, VIDAS, META DIÁRIA
   --------------------------------------------------------------------- */
function nivelAtual(xp = S.xpTotal) {
  let n = 0;
  NIVEIS.forEach((nv, i) => { if (xp >= nv.xp) n = i; });
  return n;
}
function xpHoje() { return S.xpPorDia[hoje()] || 0; }
// Congelamento 🧊: se você faltou UM dia só, a ofensiva é salva (no máximo 1 vez a cada 7 dias).
// Isso evita o "quebrei a sequência, desisti de tudo".
function congelamentoDisponivel() {
  return !S.ofensiva.congeladoEm || S.ofensiva.congeladoEm <= hoje(-7);
}
function ofensivaVisivel() {
  const u = S.ofensiva.ultimoDia;
  if (u === hoje() || u === hoje(-1)) return S.ofensiva.atual;
  if (u === hoje(-2) && congelamentoDisponivel()) return S.ofensiva.atual; // será salva ao estudar hoje
  return 0; // faltou mais de um dia: a ofensiva quebrou
}
function ganharXP(qtd) {
  if (qtd <= 0) return;
  const nivelAntes = nivelAtual();
  S.xpTotal += qtd;
  S.xpPorDia[hoje()] = xpHoje() + qtd;
  // ofensiva: conta o dia no primeiro XP ganho
  if (S.ofensiva.ultimoDia !== hoje()) {
    const u = S.ofensiva.ultimoDia;
    if (u === hoje(-1)) S.ofensiva.atual++;
    else if (u === hoje(-2) && congelamentoDisponivel()) {
      S.ofensiva.atual++;
      S.ofensiva.congeladoEm = hoje(-1);
      toast("🧊 Congelamento usado: sua ofensiva foi salva!");
    } else S.ofensiva.atual = 1;
    S.ofensiva.ultimoDia = hoje();
    S.ofensiva.recorde = Math.max(S.ofensiva.recorde, S.ofensiva.atual);
    if (S.ofensiva.atual > 1) toast(`🔥 Ofensiva de ${S.ofensiva.atual} dias!`);
  }
  if (S.ofensiva.atual >= 3) desbloquear("ofensiva-3");
  if (S.ofensiva.atual >= 7) desbloquear("ofensiva-7");
  if (S.ofensiva.atual >= 30) desbloquear("ofensiva-30");
  if (S.xpTotal >= 500) desbloquear("xp-500");
  if (S.xpTotal >= 2000) desbloquear("xp-2000");
  // meta diária
  if (xpHoje() >= S.config.meta && S.metaBatidaEm !== hoje()) {
    S.metaBatidaEm = hoje();
    desbloquear("meta-diaria");
    setTimeout(() => { confete(); som("nivel"); toast("🎯 Meta diária batida!"); }, 600);
  }
  // subida de nível
  const nivelDepois = nivelAtual();
  if (nivelDepois > nivelAntes) {
    const nv = NIVEIS[nivelDepois];
    setTimeout(() => { confete(); som("nivel"); toast(`${nv.icone} Promoção! Agora você é ${nv.nome}!`); }, 1200);
    if (nivelDepois === NIVEIS.length - 1) desbloquear("diretor");
  }
  salvar();
}

// "Retenção confirmada": acertou de novo pelo menos 7 dias depois do 1º contato.
// É o que mais se aproxima de domínio real (concluir lição ≠ dominar).
function marcarRetencao(st, acertou) {
  if (!st.desde) st.desde = hoje();
  if (acertou && st.desde <= hoje(-7)) st.confirmada = true;
}
function registrarResposta(q, acertou) {
  const st = S.questoes[q.id] || (S.questoes[q.id] = { acertos: 0, erros: 0 });
  if (acertou) st.acertos++; else st.erros++;
  st.ult = acertou ? 1 : 0; // último resultado: errou → entra no caderno de erros; acertou depois → sai
  marcarRetencao(st, acertou);
  if (!acertou) S.revisao[q.id] = { etapa: 0, proxima: hoje(1) }; // errou → volta amanhã
  salvar();
}
function registrarRevisao(q, acertou) {
  const r = S.revisao[q.id] || { etapa: 0, proxima: hoje() };
  if (acertou) {
    r.etapa++;
    if (r.etapa >= INTERVALOS_REVISAO.length) { delete S.revisao[q.id]; S.dominadas++; }
    else { r.proxima = hoje(INTERVALOS_REVISAO[r.etapa]); S.revisao[q.id] = r; }
    S.revisadas++;
    if (S.revisadas >= 20) desbloquear("revisor");
  } else {
    S.revisao[q.id] = { etapa: 0, proxima: hoje(1) };
  }
  const st = S.questoes[q.id] || (S.questoes[q.id] = { acertos: 0, erros: 0 });
  if (acertou) st.acertos++; else st.erros++;
  marcarRetencao(st, acertou);
  salvar();
}

   --------------------------------------------------------------------- */
let audioCtx = null;
function som(tipo) {
  if (!S.config.som) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notas = {
      acerto: [[660, 0], [880, .09]],
      erro: [[220, 0], [180, .12]],
      nivel: [[523, 0], [659, .1], [784, .2], [1047, .3]],
      clique: [[440, 0]],
      tique: [[1200, 0]]
    }[tipo] || [[440, 0]];
    notas.forEach(([freq, atraso]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = tipo === "erro" ? "sawtooth" : "sine";
      o.frequency.value = freq;
      const t0 = audioCtx.currentTime + atraso;
      const dur = tipo === "tique" ? .05 : .16;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(tipo === "erro" ? .08 : .18, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + .02);
    });
  } catch (e) { /* sem áudio: tudo bem */ }
}

/* ---------------------------------------------------------------------
   CONFETE (animação de comemoração)
   --------------------------------------------------------------------- */
function confete() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ["#e21b3c", "#1368ce", "#d89e00", "#26890c", "#7b4bc4", "#ffffff"];
  const ps = Array.from({ length: 140 }, () => ({
    x: cv.width / 2, y: cv.height / 3, vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 4,
    r: Math.random() * 6 + 4, c: cores[Math.floor(Math.random() * cores.length)], a: Math.random() * 6
  }));
  const inicio = performance.now();
  (function quadro(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    });
    if (t - inicio < 2600) requestAnimationFrame(quadro); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(inicio);
}

function urlApp(hash) { return location.origin + location.pathname.replace(/index\.html$/, "") + (hash ? "#" + hash : ""); }

      g.fillStyle = "#17201c"; g.font = `150px ${fonte}`; g.fillText(icone || "⚡", 540, 360);
      const quebrar = (txt, max) => { const out = []; let l = ""; String(txt).split(" ").forEach(p => { if (g.measureText((l + " " + p).trim()).width > max && l) { out.push(l); l = p; } else l = (l + " " + p).trim(); }); if (l) out.push(l); return out; };

function limparParaFala(t) {
  return String(expandirSiglas(t || "")).replace(/^\s*\|[\s:|-]+\|\s*$/gm, "").replace(/\|/g, ", ") // tabelas: lê as células, não as barras
    .replace(/\/h\b/g, " por hora").replace(/\/(dia|mês|ano|semana|turno|pedido|unidade|un|min|kg|t)\b/g, " por $1") // unidades: "un/dia" → "un por dia"
    .replace(/\*\*/g, "").replace(/\*/g, "")
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu, "")
    // símbolos de fórmulas lidos por extenso (estatística, matemática)
    .replace(/x̄/g, "x barra").replace(/ȳ/g, "y barra").replace(/ŷ/g, "y chapéu").replace(/μ₀/g, "mi zero")
    .replace(/μ/g, "mi").replace(/σ/g, "sigma").replace(/Σ/g, "soma de ").replace(/α/g, "alfa").replace(/β/g, "beta")
    .replace(/λ/g, "lambda").replace(/√/g, "raiz de ").replace(/²/g, " ao quadrado").replace(/±/g, " mais ou menos ")
    .replace(/≈/g, " aproximadamente ").replace(/≥/g, " maior ou igual a ").replace(/≤/g, " menor ou igual a ")
    .replace(/·/g, " vezes ").replace(/=/g, " igual a ")
    .replace(/ < /g, " menor que ").replace(/ > /g, " maior que ").replace(/[│├└┤┼─▁▂▃▄▆█┘┌┐]/g, " ")
    .replace(/→/g, ", ").replace(/÷/g, " dividido por ").replace(/×/g, " vezes ").replace(/≠/g, " diferente de ")
    .replace(/−/g, " menos ").replace(/%/g, " por cento").replace(/\n/g, ". ");
}
function vozPT() {
  const vozes = speechSynthesis.getVoices();
  return vozes.find(v => v.lang === "pt-BR") || vozes.find(v => v.lang && v.lang.startsWith("pt"));
}
function falar(partes, titulo = "Ouvindo…") {
  if (!("speechSynthesis" in window)) { toast("Seu navegador não tem leitura em voz alta 😕"); return; }
  speechSynthesis.cancel();
  // Divide em frases curtas: alguns celulares param de falar no meio de textos longos
  const lista = (Array.isArray(partes) ? partes : [partes]).map(limparParaFala)
    .flatMap(t => t.split(/(?<=[.!?:;])\s+/)).map(t => t.trim()).filter(t => t.replace(/[.\s]/g, ""));
  if (!lista.length) return;
  $("#listen-title").textContent = titulo;
  $("#listenbar").classList.remove("hidden");
  document.body.classList.add("ouvindo");
  desbloquear("ouvinte");
  lista.forEach((txt, i) => {
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = "pt-BR"; u.rate = S.config.velocidadeVoz;
    const v = vozPT(); if (v) u.voice = v;
    if (i === lista.length - 1) u.onend = () => { $("#listenbar").classList.add("hidden"); document.body.classList.remove("ouvindo"); };

}

// O que cada tela precisa além do catálogo: módulos completos (ids ou "todos") e/ou a busca (glossário, flashcards, fórmulas)
function telaPrecisa(nome, param) {
  const modDe = lid => (LICOES.find(l => l.id === lid) || {}).modulo;
  const daQuestao = ids => ids.map(id => Q[id] && Q[id].modulo).filter(Boolean);
  switch (nome) {

    case "conteudo": case "mapa": return { mods: param ? [param] : [] };
    case "consulta": {
      const k = dec(param || "");
      return { mods: k.startsWith("l:") ? [modDe(k.slice(2))] : k.startsWith("g:") ? [k.split(":")[1]] : [], busca: true };
    }
    case "ferramenta": {
      const f = FERR(param), temDesafio = (window.DESAFIOS || []).some(d => d.ferramenta === param);
      return { mods: f && !temDesafio ? (f.ver || []).slice(0, 2).map(modDe) : [] };
    }
    case "assunto": {
      const k = dec(param || ""), a = BUSCA_PRONTA ? assunto(k) : null;
      const base = k.startsWith("f:") ? ((FERR(k.slice(2)) || {}).ver || []).map(modDe) : k.startsWith("g:") ? [k.split(":")[1]] : k.startsWith("l:") ? [modDe(k.slice(2))] : [];
      return { mods: [...new Set(base.concat(a ? modsDe(a) : []))].filter(Boolean), busca: true };
    }
    case "consultar": case "glossario": case "flashcards": return { mods: [], busca: true };
    case "perfil": return { mods: daQuestao(pontosFracos(5).map(q => q.id)) };
    case "revisao": return { mods: [...new Set(daQuestao(revisoesPendentes().concat(pontosFracos(10).map(q => q.id)))

    case "ouvir": return { mods: MODS.filter(m => !m.grade && moduloLiberado(m)).map(m => m.id) };

   GRADE CURRICULAR (disciplinas) — conteudo/grade/*.js
   Cada disciplina vira um "módulo" da trilha (aba Grade), com uma lição
   por tópico. O mesmo dado alimenta o Conteúdo e os Mapas mentais.
   ===================================================================== */
const AREAS = {
  exatas:     { nome: "Ciências exatas", cor: "#3b6fd8" },

  producao:   { nome: "Engenharia de Produção", cor: "#1f8a4c" },

function disciplinaParaModulo(d, k) {
  if (!d.id || !d.nome || !Array.isArray(d.topicos) || !d.topicos.length) throw new Error("precisa de id, nome e topicos");
  const qs = d.questoes || [];
  return {
    id: d.id, numero: "", titulo: d.nome, icone: d.icone || "📘", grade: true, periodo: d.periodo, fonte: d,
    ordem: 1000 + d.periodo * 100 + k,
    objetivo: d.intro,
    resumoAudio: [d.intro].concat(d.topicos.map(tp => tp.t + ". " + (tp.pontos || []).join(" "))).join(" "),
    glossario: (d.glossario || []).map(([termo, definicao]) => ({ termo, definicao })),
    licoes: d.topicos.map((tp, i) => {
      const blocos = [];
      if (tp.producao) blocos.push({ tipo: "contexto", titulo: "Na Engenharia de Produção", texto: tp.producao });
      if ((tp.pontos || []).length) blocos.push({ tipo: "conceito", titulo: tp.t, texto: tp.pontos.map(p => "• " + p).join("\n") });
      if ((tp.formulas || []).length) blocos.push({ tipo: "formula", titulo: "Fórmulas e significados", texto: "", legenda: tp.formulas });
      if (tp.exemplo) blocos.push({ tipo: "exemplo", titulo: "Exemplo", texto: tp.exemplo });
      const questoes = qs.filter(q => q.t === i).map(q => { const c = Object.assign({}, q); delete c.t; return c; });
      if (!questoes.length) errosConteudo.push(`${d.id}: o tópico "${tp.t}" não tem exercícios`);
      return { id: `${d.id}-l${i + 1}`, titulo: tp.t, icone: tp.icone || d.icone || "📘", blocos, questoes };
    })

}

   EXPERIÊNCIA "PROBLEMA": CONSULTAR · PROBLEMAS · DESAFIO · ESTUDAR

   resto reaproveita o que já existe (lições, disciplinas, glossários,
   questões, XP, ofensiva e revisão espaçada).
   ===================================================================== */
const PROB = () => window.PROBLEMAS || { categorias: [], problemas: [], ferramentas: {}, areasEstagio: [] };

// Confere se problemas, ferramentas e desafios apontam para conteúdo que existe
function validarProblemas() {
  const P = PROB(), F = P.ferramentas, idsL = new Set(LICOES.map(l => l.id)), err = m => errosConteudo.push(m);
  Object.entries(F).forEach(([id, f]) => {
    ["nome", "oque", "paraque", "quando", "exemplo", "erros"].forEach(c => { if (!f[c]) err(`Ferramenta ${id}: falta '${c}'`); });
    (f.ver || []).forEach(v => { if (!idsL.has(v)) err(`Ferramenta ${id}: lição "${v}" não existe`); });
  });
  P.problemas.forEach(p => {
    if (!P.categorias.some(c => c.id === p.cat)) err(`Problema ${p.id}: categoria "${p.cat}" não existe`);
    (p.ferramentas || []).forEach(f => { if (!F[f]) err(`Problema ${p.id}: ferramenta "${f}" não existe`); });
  });
  P.areasEstagio.forEach(a => {
    a.cats.forEach(c => { if (!P.categorias.some(x => x.id === c)) err(`Modo Estágio ${a.id}: categoria "${c}" não existe`); });
    a.ferramentas.forEach(f => { if (!F[f]) err(`Modo Estágio ${a.id}: ferramenta "${f}" não existe`); });
    a.estudo.forEach(m => { if (!modulo(m)) err(`Modo Estágio ${a.id}: módulo "${m}" não existe`); });
  });
  const ids = new Set();
  (window.DESAFIOS || []).forEach(d => {
    if (ids.has(d.id)) err(`Desafio repetido: ${d.id}`); ids.add(d.id);
    if (!Array.isArray(d.opcoes) || !(d.correta >= 0 && d.correta < d.opcoes.length)) err(`Desafio ${d.id}: 'correta' fora das opções`);
    if (!d.porque || !d.pratica) err(`Desafio ${d.id}: falta 'porque' ou 'pratica'`);
    if (d.ferramenta && !F[d.ferramenta]) err(`Desafio ${d.id}: ferramenta "${d.ferramenta}" não existe`);
  });
}

/* Filtro de emojis: remove pictogramas de todo texto mostrado (inclusive do conteúdo), exceto quando

  const r = t.replace(RE_EMOJI, m => { if (MANTER.has(m) || MANTER.has(m[0]) && !m.includes("\uFE0F")) return m; mudou = true; return ""; });

  if (m.type === "characterData") limparEmojisEm(m.target.parentNode); else m.addedNodes.forEach(n => n.nodeType === 1 ? limparEmojisEm(n) : n.nodeType === 3 && limparEmojisEm(n.parentNode));

/* ---- Busca: conceitos, ferramentas, fórmulas, disciplinas, problemas… ---- */
const PARADAS = new Set(["de", "da", "do", "das", "dos", "e", "o", "a", "os", "as", "em", "no", "na", "nos", "nas", "para", "com", "um", "uma", "por", "que", "como", "meu", "minha", "tenho", "esta", "muito"]);
let INDICE = null;
function indiceBusca() {
  if (INDICE) return INDICE;
  const I = [], termosVistos = new Set();
  const add = e => { e.n = norm(e.titulo); e.nt = norm([e.titulo, e.termos, e.sub, e.txt].join(" ")); I.push(e); };
  Object.entries(PROB().ferramentas).forEach(([id, f]) => add({ k: "f:" + id, tipo: "Ferramenta", icone: f.icone || "🧰", titulo: f.nome, sub: f.oque, termos: f.termos, txt: f.paraque + " " + f.quando, href: "#ferramenta/" + id }));

  MODS.forEach(m => {
    add({ k: "m:" + m.id, tipo: m.grade ? "Disciplina" : "Módulo", icone: m.icone, titulo: m.titulo,
      sub: m.grade ? `${m.periodo}º período · ${(AREAS[m.fonte.area] || AREAS.producao).nome}` : `Módulo ${m.numero} do curso`, txt: m.objetivo, href: "#conteudo/" + m.id });
    (m.glossario || []).forEach(g => {
      const n = norm(g.termo); if (termosVistos.has(n)) return; termosVistos.add(n);
      const k = `g:${m.id}:${g.termo}`;
      add({ k, tipo: "Conceito", icone: "📖", titulo: g.termo, sub: g.definicao, href: "#consulta/" + enc(k) });
    });
    m.licoes.forEach(l => {
      if (/chef/i.test(l.titulo)) return;
      const k = "l:" + l.id, href = "#consulta/" + enc(k);
      add({ k, tipo: m.grade ? "Tópico" : "Lição", icone: l.icone || m.icone, titulo: l.titulo, sub: m.titulo, txt: (l.blocos || []).map(b => b.titulo || "").join(" "), href });
      (l.blocos || []).filter(b => b.tipo === "formula").forEach(b => {
        if (m.grade) (b.legenda || []).forEach(([f, sig]) => add({ k, tipo: "Fórmula", icone: "📐", titulo: f, sub: `${limpar(sig)} · ${m.titulo}`, href }));
        else if (b.titulo) add({ k, tipo: "Fórmula", icone: "📐", titulo: limpar(b.titulo), sub: `${limpar(b.texto).split("\n")[0]} · ${l.titulo}`, href });

function buscar(q, lim = 40) {
  const nq = norm(q).trim();
  if (nq.length < 2) return [];
  // palavras relevantes; plural simples vira singular ("filas" acha "fila")
  const toks = nq.split(/[\s,;:/()?!.-]+/).filter(t => t && !PARADAS.has(t)).map(t => t.length > 4 && t.endsWith("s") ? t.slice(0, -1) : t);
  if (!toks.length) return [];
  const peso = { Ferramenta: 30, Problema: 22, Conceito: 18, Disciplina: 14, "Módulo": 14, "Lição": 10, "Tópico": 10, "Fórmula": 6 };
  const pref = new Set((areaEstagio() || {}).ferramentas || []);
  const vistos = new Set();
  const pontuados = indiceBusca().map(e => {
    const achou = toks.filter(t => e.nt.includes(t)).length;
    if (!achou) return null;
    const todos = achou === toks.length;
    if (!todos && achou < Math.ceil(toks.length / 2)) return null;
    let s = (peso[e.tipo] || 0) + (todos ? 200 : achou * 20);
    if (e.n === nq) s += 100; else if (e.n.startsWith(nq)) s += 60; else if (e.n.includes(nq)) s += 45; else if (toks.every(t => e.n.includes(t))) s += 30;
    if (pref.has(e.k.slice(2))) s += 8;
    return { e, s };
  }).filter(Boolean).sort((a, b) => b.s - a.s || a.e.titulo.length - b.e.titulo.length);
  return pontuados.filter(x => { const c = x.e.tipo + "|" + x.e.n; if (vistos.has(c)) return false; vistos.add(c); return true; })
    .slice(0, lim).map(x => x.e);
}

/* ---- Assuntos: junta ferramenta, conceito (glossário) e lições do mesmo tema ----
   Chaves: "f:<ferramenta>", "g:<módulo>:<termo>" (conceito sem ferramenta) ou "l:<lição>" (tópico avulso). */
let ASSUNTOS = null;
const baseNome = t => norm(String(t).replace(/\s*\([^)]*\)/g, "")).trim();
const siglaDe = t => { const m = String(t).match(/\(([A-Z][A-Za-z0-9&/ -]{1,12})\)/) || String(t).match(/^([A-Z][A-Z0-9&]{1,7})\b/); return m ? norm(m[1]) : ""; };
// O título contém o termo? Palavra a palavra, tolerando plural e flexão ("derivada" ↔ "Derivadas: taxas…")
const PAL_FRACAS = new Set(["de", "da", "do", "das", "dos", "e", "a", "o", "em", "na", "no", "para", "com"]);
function temPalavra(txt, termo) {

  if (!ts.length) return false;

  for (let i = 0; i + ts.length <= ws.length; i++) {

    while (j < ts.length && k < ws.length) { if (casa(ws[k], ts[j])) { j++; k++; } else if (PAL_FRACAS.has(ws[k]) && j > 0) k++; else break; }
    if (j === ts.length) return true;
  }
  return false;
}
function assuntos() {
  const I = indiceBusca();
  if (ASSUNTOS && ASSUNTOS._de === I) return ASSUNTOS;
  const A = new Map(), dono = new Map(); // dono: chave de busca (g:/l:) → chave do assunto
  // nomes compostos ("Caminho crítico (CPM) e PERT") valem também pelas partes
  const fs = Object.entries(PROB().ferramentas).map(([id, f]) => { const b = baseNome(f.nome);
    return { id, f, b, s: siglaDe(f.nome), bs: [b].concat(b.split(/ e | x |: | - | ou /).map(x => x.trim()).filter(x => x.length >= 6 && x !== b)) }; });
  fs.forEach(({ id, f }) => A.set("f:" + id, { k: "f:" + id, titulo: f.nome, def: f.oque, ferr: id, conceito: null, licoes: (f.ver || []).slice() }));
  // lições cujo título fala da ferramenta (a de nome mais longo vence: "Estoque de segurança" > "Estoque")
  LICOES.forEach(l => {
    if (/chef/i.test(l.titulo)) return;
    const t = norm(l.titulo), f = fs.filter(x => x.bs.some(b => temPalavra(t, b)) || (x.s && temPalavra(t, x.s))).sort((a, b) => b.b.length - a.b.length)[0];

const linkConteudo = l => `#conteudo/${l.modulo}/${l.id}`;
function questaoDeTeste(l, nt) {

// Monta a ficha de um conceito (termo do glossário) ou de uma lição/tópico a partir dos blocos que já existem

    const c = base.filter(b => tipos.includes(b.tipo)), r = nt ? c.filter(b => txt(b).includes(nt)) : [];
    const lista = r.length || soRelacionados ? r : c.filter(b => !b.nivel || b.nivel === "facil").concat(c);
    return lista.filter((b, i, a) => a.indexOf(b) === i).slice(0, n);
  };
  const pc = base.find(b => b.tipo === "conceito");
  const ctx = base.find(b => b.tipo === "contexto");
  const rel = Object.entries(PROB().ferramentas).filter(([, f]) => (f.ver || []).includes(l.id));
  return {
    tipo, icone: conceito ? "📖" : (l.icone || m.icone), titulo: termo || l.titulo,
    origem: `${m.icone} ${m.grade ? `${m.titulo} · ${m.periodo}º período` : `Módulo ${m.numero} — ${m.titulo}`}${conceito ? ` · lição “${l.titulo}”` : ""}`,
    resumo: resumo || porNivel(l.resumo, "facil") || (pc ? primeiraFrase(pc.texto) : m.objetivo),
    paraque: !conceito && ctx ? ctx.texto : null,
    entenda: escolher(["conceito", "texto", "dica", "passos", "conexao", "mnemonico"], 3, false),
    formulas: escolher(["formula"], 2, conceito),
    pratica: escolher(["exemplo", "serio", "bobo"], 2, false),
    erros: escolher(["atencao", "limitacao"], 1, conceito),
    teste: questaoDeTeste(l, nt),
    aprofundar: [
      { href: linkConteudo(l), icone: "📚", tipo: "Conteúdo completo", titulo: l.titulo, sub: m.titulo },
      licaoLiberada(l.id) ? { href: "#licao/" + l.id, icone: "🎮", tipo: "Exercícios", titulo: "Fazer a lição", sub: `${(l.questoes || []).length} exercícios · níveis e revisão` } : null,
      { href: "#mapa/" + m.id, icone: "🧠", tipo: "Mapa mental A4", titulo: m.titulo, sub: "tópicos, fórmulas e significados numa folha" }
    ].filter(Boolean),
    relacionadas: rel.map(([id, f]) => ({ href: "#ferramenta/" + id, icone: f.icone, tipo: "Ferramenta", titulo: f.nome, sub: f.oque }))

// Ficha de um termo do glossário, montada com a lição do módulo que mais fala dele
function fichaDoConceito(k) {

function desafioDoDia() {
  const D = window.DESAFIOS || [];
  if (!D.length) return null;
  if (S.desafioDia && S.desafioDia.data === hoje()) { const d = D.find(x => x.id === S.desafioDia.id); if (d) return d; }
  let pool = D.filter(d => !S.desafios[d.id]);
  if (!pool.length) pool = D.slice();
  const A = areaEstagio();
  if (A) { const da = pool.filter(d => (d.areas || []).includes(A.id)); if (da.length) pool = da; }
  const d = pool[Number(hoje().replace(/-/g, "")) % pool.length]; // o mesmo desafio o dia inteiro
  S.desafioDia = { data: hoje(), id: d.id };
  salvar();
  return d;
}

function listaPorPeriodo(link, filtro) {
  const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const f = norm(filtro || "");
  let html = "";
  for (let p = 1; p <= 10; p++) {
    const ds = disciplinas().filter(m => m.periodo === p && (!f || norm(m.titulo).includes(f)));
    if (!ds.length) continue;
    html += `<details class="periodo" ${f ? "open" : ""}><summary><b>${p}º período</b> <span class="small muted">· ${ds.length} disciplina${ds.length > 1 ? "s" : ""}</span></summary>
      ${ds.map(m => { const A = AREAS[m.fonte.area] || AREAS.producao; return `<a class="card link disc" href="${link(m)}" style="border-left:6px solid ${A.cor}">
        <span class="big">${m.icone}</span><span class="grow"><b>${esc(m.titulo)}</b><br><span class="small muted">${A.nome}</span></span>›</a>`; }).join("")}
    </details>`;
  }
  return html;
}

const CORES_MAPA = ["#e4572e", "#3b6fd8", "#1f8a4c", "#d9822b", "#8a5cd1", "#c2477a", "#138a9e", "#7a6a1f"];
const limpar = t => String(t || "").replace(/\*\*/g, "").replace(/\*/g, "");
// Primeira ideia de um texto: ignora tabelas e marcadores e junta a linha seguinte quando a primeira termina em “:”
const primeiraFrase = t => {
  const ls = limpar(t).split("\n").map(x => x.trim().replace(/^(•|-|\d+\.)\s*/, "")).filter(x => x && !x.startsWith("|"));
  let x = ls[0] || "";
  if (/:$/.test(x) && ls[1]) x += " " + ls[1];
  const i = x.slice(20).search(/[.;](\s|$)/);
  x = i >= 0 ? x.slice(0, i + 20) : x;
  return x.length > 150 ? x.slice(0, x.lastIndexOf(" ", 148)) + "…" : x;
};
// Extrai tópicos, fórmulas, significados e aplicações de uma disciplina ou de um módulo do curso
function dadosMapa(m) {
  if (m.grade) {
    const d = m.fonte;
    return { titulo: d.nome, sub: `${d.periodo}º período`, icone: d.icone,
      topicos: d.topicos.map(tp => ({ titulo: tp.t, pontos: tp.pontos || [], formulas: tp.formulas || [], producao: tp.producao ? [tp.producao] : [], exemplos: tp.exemplo ? [tp.exemplo] : [], mnemonicos: [] })),
      glossario: d.glossario || [] };
  }
  return { titulo: m.titulo, sub: `Módulo ${m.numero}`, icone: m.icone,
    topicos: m.licoes.filter(l => !/chef/i.test(l.titulo)).map(l => {
      const b = l.blocos || [], unicos = a => Array.from(new Set(a));
      return { titulo: l.titulo.replace(/^👾\s*/, ""),
        pontos: unicos(b.filter(x => x.tipo === "conceito" && !/checklist/i.test(x.titulo || "")).map(x => limpar(x.titulo) + (x.texto ? ": " + primeiraFrase(x.texto) : ""))).slice(0, 3),
        formulas: b.filter(x => x.tipo === "formula").slice(0, 3).map(x => [limpar(x.texto).split("\n").join("  ·  "), (x.legenda || []).map(([s, dd]) => `${s} = ${limpar(dd)}`).join("; ") || limpar(x.titulo)]),
        producao: b.filter(x => x.tipo === "serio" || x.tipo === "contexto").map(x => primeiraFrase(x.texto)).slice(0, 1),
        exemplos: b.filter(x => x.tipo === "exemplo").map(x => limpar(x.titulo) + ": " + primeiraFrase(x.texto)).slice(0, 1),
        mnemonicos: b.filter(x => x.tipo === "mnemonico").map(x => primeiraFrase(x.texto)).slice(0, 1) };
    }),
    glossario: (m.glossario || []).map(g => [g.termo, g.definicao]) };
}

function ajustarEscalaA4() {

// Quando nem a letra mínima faz caber, o mapa se compacta em etapas (os mapas que já cabem não mudam):
// 1) primeira frase de cada item; 2) até 4 pontos e 3 fórmulas por tópico; 3) até 3 pontos, 2 fórmulas e 8 termos do glossário;
// 4) até 2 pontos, 1 fórmula e 6 termos; 5) 1 ponto, 1 fórmula, sem exemplos e 4 termos (disciplinas com muitos tópicos).
function compactarMapa(D, nivel) {
  if (!nivel) return D;
  const maxP = [99, 99, 4, 3, 2, 1][nivel], maxF = [99, 99, 3, 2, 1, 1][nivel], maxG = [99, 99, 99, 8, 6, 4][nivel];
  return Object.assign({}, D, {
    topicos: D.topicos.map(tp => Object.assign({}, tp, {
      pontos: tp.pontos.map(primeiraFrase).slice(0, maxP), formulas: tp.formulas.slice(0, maxF),
      producao: tp.producao.map(primeiraFrase), exemplos: nivel >= 5 ? [] : tp.exemplos.map(primeiraFrase), mnemonicos: tp.mnemonicos.map(primeiraFrase) })),
    glossario: D.glossario.slice(0, maxG) });
}
function desenharMapaA4(a4, D0, op, marcados, nivel = 0) {
  // fórmulas em KaTeX antes de medir (senão o mapa cresce depois e passa da folha)
  if (!window.katex || !window.FORMULAS_TEX) carregarKatex().then(() => { if (window.katex && a4.isConnected) desenharMapaA4(a4, D0, op, marcados, nivel); });
  semSiglas = true; // no mapa A4 o espaço é curto: siglas ficam sem o significado
