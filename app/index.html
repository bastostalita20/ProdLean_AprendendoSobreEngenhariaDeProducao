/* =====================================================================
   TELA: TRILHA
   ===================================================================== */
function telaTrilha(visao, per) {
  const desloc = [0, 55, 80, 55, 0, -55, -80, -55]; // zigue-zague do caminho
  const grade = visao === "grade";
  let k = 0;
  const caminho = m => {
    let h = `<div class="path">`;
    m.licoes.forEach(l => {
      const feita = licaoConcluida(l.id), liberada = licaoLiberada(l.id);
      const atual = liberada && !feita;
      const cls = feita ? "done" : atual ? "current" : "locked";
      const ico = feita ? "✓" : liberada ? (l.icone || "⭐") : "🔒";
      h += `<a class="node ${cls}" style="transform:translateX(${desloc[k++ % desloc.length]}px)" href="${liberada ? "#licao/" + l.id : "javascript:void(0)"}" ${liberada ? "" : `data-bloq="1"`}>
        ${atual ? `<span class="start">COMEÇAR</span>` : ""}
        <span class="ball">${ico}</span><span class="lbl">${esc(l.titulo)}</span>
        ${niveisDaLicao(l)[0] !== "unico" && liberada ? `<span class="lvls" aria-label="níveis concluídos">${niveisDaLicao(l).map(n => `<i class="${nivelConcluido(l.id, n) ? "on" : ""}" title="${NIVEIS_ESTUDO[n].nome}">${NIVEIS_ESTUDO[n].icone}</i>`).join("")}</span>` : ""}</a>`;
    });
    return h + `</div>`;
  };
  let html = barraTopo() + `<h1>🗺️ Trilha</h1>
    <div class="seg"><a href="#trilha" class="${grade ? "" : "on"}">📘 Curso</a><a href="#trilha/grade/${per || 1}" class="${grade ? "on" : ""}">🎓 Grade curricular</a></div>`;
  if (!grade) {
    html += `<p class="muted small mt">Conclua uma lição (em qualquer nível) para liberar a próxima. Os ícones 🌱🔧🧠 abaixo de cada lição acendem conforme você conclui cada nível.</p>`;
    const mods = MODS.filter(m => !m.grade);
    if (!mods.length) html += `<div class="errbox">Nenhum módulo carregado. Confira a pasta "conteudo/".</div>`;
    mods.forEach(m => {
      const lib = moduloLiberado(m), feitas = m.licoes.filter(l => licaoConcluida(l.id)).length;
      html += `<div class="mod-banner ${lib ? "" : "locked"}">
        <div class="row"><div><div class="small" style="opacity:.85">MÓDULO ${m.numero}</div><b>${m.icone} ${esc(m.titulo)}</b></div>
        <div class="small" style="text-align:right"><b>${feitas}/${m.licoes.length}</b>${moduloTemNiveis(m) ? `<br>${ORDEM_NIVEIS.map(n => `${NIVEIS_ESTUDO[n].icone}${m.licoes.filter(l => nivelConcluido(l.id, n)).length}`).join(" ")}` : ""}</div></div>
        ${lib ? `<div class="small mt" style="opacity:.9">🎯 ${esc(m.objetivo || "")}</div>` : ""}
        ${m.liberaApos ? `<div class="small mt" style="opacity:.9">🔀 Trilha paralela: libera ao concluir ${[].concat(m.liberaApos).map(id => { const x = modulo(id); return x ? "o Módulo " + x.numero : id; }).join(" e ")}.</div>` : ""}
      </div>` + caminho(m);
      if (lib) html += `<div class="row mb" style="justify-content:center"><button class="btn small sec" data-ouvir="${m.id}">🎧 Ouvir resumo</button> <a class="btn small sec" style="text-decoration:none" href="#flashcards/${m.id}">🃏 Flashcards</a></div>`;
    });
  } else {
    const p = Math.min(10, Math.max(1, +per || 1));
    html += `<p class="muted small mt">As disciplinas da grade curricular, por período. Todas começam liberadas; dentro de cada disciplina, um tópico libera o próximo.</p>
      <div class="pchips">${Array.from({ length: 10 }, (_, i) => i + 1).map(n => {
        const ds = disciplinas().filter(m => m.periodo === n), ok = ds.filter(moduloConcluido).length;
        return `<a href="#trilha/grade/${n}" class="${n === p ? "on" : ""}">${n}º${ds.length ? `<small>${ok}/${ds.length}</small>` : ""}</a>`;
      }).join("")}</div>`;
    const ds = disciplinas().filter(m => m.periodo === p);
    if (!ds.length) html += `<p class="muted mt">Nenhuma disciplina deste período foi carregada.</p>`;
    ds.forEach(m => {
      const A = AREAS[m.fonte.area] || AREAS.producao, feitas = m.licoes.filter(l => licaoConcluida(l.id)).length;
      html += `<div class="mod-banner" style="background:${A.cor};box-shadow:0 4px 0 rgba(0,0,0,.25)">
        <div class="row"><div><div class="small" style="opacity:.85">${esc(m.numero || "")} · ${A.nome}</div><b>${m.icone} ${esc(m.titulo)}</b></div>
        <div class="small" style="text-align:right"><b>${feitas}/${m.licoes.length}</b></div></div>
        <div class="row wrap mt"><a class="minilink" href="#conteudo/${m.id}">📚 Conteúdo</a><a class="minilink" href="#mapa/${m.id}">🧠 Mapa</a></div>
      </div>` + caminho(m);
    });
  }
  app().innerHTML = html;
  $$("[data-bloq]").forEach(a => a.onclick = () => { som("erro"); toast("🔒 Conclua a lição anterior primeiro."); });
  $$("[data-ouvir]").forEach(b => b.onclick = () => { const m = modulo(b.dataset.ouvir); falar(m.resumoAudio, "Resumo: " + m.titulo); });
}

/* =====================================================================
   COMPONENTE: RENDERIZAR UMA QUESTÃO
   Usado na lição e na revisão. Chama aoResponder(acertou) após verificar.
   ===================================================================== */
function renderQuestao(q, cont, aoResponder) {
  q = Parametros.instanciar(q); // questões-modelo ganham números novos a cada vez
  siglasBloqueadas = bloqueioDaQuestao(q);
  cont.dataset.qid = q.id;      // identifica a questão exibida (útil para testes automáticos)
  cont._q = q;
  let resposta = null;     // resposta escolhida pelo usuário
  let pronto = () => resposta !== null;
  let corrigir;            // função que devolve true/false
  let html = "";
  if (q.tipo === "caso" && q.contexto) html += `<div class="q-contexto">🏭 ${fmt(q.contexto)}</div>`;
  const rotulos = { multipla: "Escolha a alternativa", vf: "Verdadeiro ou falso?", lacuna: "Complete a lacuna", ligar: "Ligue as colunas", ordenar: "Coloque em ordem", caso: "Mini estudo de caso", calculo: "Calcule", discursiva: "Questão discursiva (autoavaliação)" };
  html += `<div class="small muted">${q.nivel ? `<span class="chip-nivel">${NIVEIS_ESTUDO[q.nivel].icone} ${NIVEIS_ESTUDO[q.nivel].nome}</span> ` : ""}${q.parametrica ? `<span class="chip-nivel" title="Os números mudam a cada tentativa">🎲 números sorteados</span> ` : ""}<b>${rotulos[q.tipo] || ""}</b></div>`;

  // Discursiva: escreve (ou pensa) → vê resposta-modelo e critérios → autoavalia
  if (q.tipo === "discursiva") {
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div>
      <textarea id="disc" style="min-height:130px;font-family:inherit;font-size:.95rem" placeholder="Escreva sua resposta (ou pense nela com calma) antes de ver a resposta-modelo…"></textarea>
      <p class="small muted">✍️ Escrever a resposta fixa muito mais do que só ler. A correção é por autoavaliação honesta.</p>
      <div class="footer-action" id="disc-acao"><button class="btn" id="verificar">Ver resposta-modelo</button></div>`;
    cont.innerHTML = html;
    $("#verificar", cont).onclick = () => {
      $("#disc", cont).readOnly = true;
      $("#disc-acao", cont).outerHTML = `<div class="bloco dica mt"><div class="tag">📝 Resposta-modelo</div>${fmt(q.respostaModelo)}</div>
        ${q.criterios && q.criterios.length ? `<div class="bloco criterios"><div class="tag">✅ Critérios: marque o que sua resposta contemplou</div>
          ${q.criterios.map((c, i) => `<label><input type="checkbox" data-c="${i}"> <span>${fmt(c)}</span></label>`).join("")}</div>` : ""}
        ${q.explicacao ? `<p class="small muted">${fmt(q.explicacao)}</p>` : ""}
        <p class="small"><b>Como foi?</b> “Parcial” e “Errei” voltam na revisão espaçada.</p>
        <div class="self-eval mb" id="disc-aval">
          <button class="btn danger" data-a="0">😵 Errei</button>
          <button class="btn sec" data-a="1">😐 Parcial</button>
          <button class="btn" data-a="2">😎 Acertei</button>
        </div>`;
      som("clique");
      $$("#disc-aval [data-a]", cont).forEach(b => b.onclick = () => {
        const acertou = b.dataset.a === "2";
        som(acertou ? "acerto" : "erro");
        aoResponder(acertou);
      });
    };
    return;
  }

  if (q.tipo === "multipla" || q.tipo === "caso") {
    const ordem = embaralhar(q.opcoes.map((_, i) => i));
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div><div class="opts">` +
      ordem.map(i => `<button class="opt" data-i="${i}">${fmt(q.opcoes[i])}</button>`).join("") + `</div>`;
    cont.innerHTML = html;
    $$(".opt", cont).forEach(b => b.onclick = () => { $$(".opt", cont).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); resposta = +b.dataset.i; som("clique"); atualizarBotao(); });
    corrigir = () => {
      $$(".opt", cont).forEach(b => { b.disabled = true; if (+b.dataset.i === q.correta) b.classList.add("ok"); else if (b.classList.contains("sel")) b.classList.add("bad"); });
      return resposta === q.correta;
    };
  }
  else if (q.tipo === "vf") {
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div><div class="vf">
      <button class="opt" data-v="1">✅ Verdadeiro</button><button class="opt" data-v="0">❌ Falso</button></div>`;
    cont.innerHTML = html;
    $$(".opt", cont).forEach(b => b.onclick = () => { $$(".opt", cont).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); resposta = b.dataset.v === "1"; som("clique"); atualizarBotao(); });
    corrigir = () => {
      $$(".opt", cont).forEach(b => { b.disabled = true; const v = b.dataset.v === "1"; if (v === q.correta) b.classList.add("ok"); else if (b.classList.contains("sel")) b.classList.add("bad"); });
      return resposta === q.correta;
    };
  }
  else if (q.tipo === "lacuna") {
    const partes = String(q.pergunta).split("___");
    html += `<div class="q-enunciado">${fmt(partes[0])}<span class="blank" id="blank">&nbsp;?&nbsp;</span>${fmt(partes.slice(1).join("___"))}</div>
      <div class="chips">` + embaralhar(q.opcoes.map((_, i) => i)).map(i => `<button class="opt" data-i="${i}">${esc(q.opcoes[i])}</button>`).join("") + `</div>`;
    cont.innerHTML = html;
    $$(".opt", cont).forEach(b => b.onclick = () => { $$(".opt", cont).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); resposta = +b.dataset.i; $("#blank", cont).textContent = q.opcoes[resposta]; som("clique"); atualizarBotao(); });
    corrigir = () => {
      $$(".opt", cont).forEach(b => { b.disabled = true; if (+b.dataset.i === q.correta) b.classList.add("ok"); else if (b.classList.contains("sel")) b.classList.add("bad"); });
      return resposta === q.correta;
    };
  }
  else if (q.tipo === "ligar") {
    // Toque em um item da esquerda e depois no par da direita. Erros contam.
    let selEsq = null, feitos = 0, erros = 0;
    const esq = embaralhar(q.pares.map((_, i) => i)), dir = embaralhar(q.pares.map((_, i) => i));
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div><div class="match">
      <div class="col">${esq.map(i => `<button class="opt" data-l="${i}">${esc(q.pares[i][0])}</button>`).join("")}</div>
      <div class="col">${dir.map(i => `<button class="opt" data-r="${i}">${esc(q.pares[i][1])}</button>`).join("")}</div></div>
      <p class="small muted mt">Toque em um item da esquerda e depois no par da direita.</p>`;
    cont.innerHTML = html;
    pronto = () => feitos === q.pares.length;
    $$("[data-l]", cont).forEach(b => b.onclick = () => { if (b.disabled) return; $$("[data-l]", cont).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); selEsq = +b.dataset.l; som("clique"); });
    $$("[data-r]", cont).forEach(b => b.onclick = () => {
      if (b.disabled || selEsq === null) return;
      const bl = $(`[data-l="${selEsq}"]`, cont);
      if (+b.dataset.r === selEsq) {
        [b, bl].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; });
        feitos++; som("acerto");
      } else {
        erros++; som("erro"); b.classList.add("bad", "shake");
        setTimeout(() => b.classList.remove("bad", "shake"), 400);
      }
      selEsq = null; atualizarBotao();
    });
    corrigir = () => erros === 0;
  }
  else if (q.tipo === "ordenar") {
    let escolhidos = [];
    const banco = embaralhar(q.itens.map((_, i) => i));
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div><div class="order-answer" id="oa"></div><div class="opts" id="ob"></div>
      <p class="small muted">Toque nos itens na ordem certa. Toque de novo para remover.</p>`;
    cont.innerHTML = html;
    const desenhar = () => {
      $("#oa", cont).innerHTML = escolhidos.length ? escolhidos.map((i, p) => `<button class="opt" data-rem="${p}"><span class="num">${p + 1}</span>${esc(q.itens[i])}</button>`).join("") : `<span class="small muted" style="padding:10px">Sua sequência aparece aqui</span>`;
      $("#ob", cont).innerHTML = banco.filter(i => !escolhidos.includes(i)).map(i => `<button class="opt" data-add="${i}">${esc(q.itens[i])}</button>`).join("");
      $$("[data-rem]", cont).forEach(b => b.onclick = () => { escolhidos.splice(+b.dataset.rem, 1); som("clique"); desenhar(); atualizarBotao(); });
      $$("[data-add]", cont).forEach(b => b.onclick = () => { escolhidos.push(+b.dataset.add); som("clique"); desenhar(); atualizarBotao(); });
    };
    desenhar();
    pronto = () => escolhidos.length === q.itens.length;
    corrigir = () => {
      const ok = escolhidos.every((v, p) => v === p);
      $$("[data-rem]", cont).forEach((b, p) => { b.disabled = true; b.classList.add(escolhidos[p] === p ? "ok" : "bad"); });
      return ok;
    };
  }
  else if (q.tipo === "calculo") {
    html += `<div class="q-enunciado">${fmt(q.pergunta)}</div>
      <input class="numinput" id="num" inputmode="decimal" autocomplete="off" placeholder="Sua resposta${q.unidade ? " (" + esc(q.unidade) + ")" : ""}">
      <p class="small muted mt">🟢 Use vírgula ou ponto para decimais.</p>`;
    cont.innerHTML = html;
    const inp = $("#num", cont);
    inp.oninput = () => { const v = parseFloat(inp.value.replace(/\s/g, "").replace(",", ".")); resposta = isNaN(v) ? null : v; atualizarBotao(); };
    corrigir = () => {
      inp.disabled = true;
      const tol = q.tolerancia ?? Math.max(0.01, Math.abs(q.resposta) * 0.01);
      return Math.abs(resposta - q.resposta) <= tol;
    };
  }
  else {
    cont.innerHTML = `<div class="errbox">Tipo de questão desconhecido: ${esc(q.tipo)}</div>`;
    corrigir = () => true; pronto = () => true;
  }

  // Botão "Verificar" e painel de feedback
  const acao = document.createElement("div");
  acao.className = "footer-action";
  acao.innerHTML = `<button class="btn" id="verificar" disabled>Verificar</button>`;
  cont.appendChild(acao);
  const btn = $("#verificar", cont);
  function atualizarBotao() { btn.disabled = !pronto(); }
  atualizarBotao();
  btn.onclick = () => {
    if (!pronto()) return;
    const acertou = corrigir();
    acao.remove();
    som(acertou ? "acerto" : "erro");
    let expl = q.explicacao || "";
    if (q.tipo === "calculo") expl = `Resposta: ${numeroBR(q.resposta)} ${q.unidade || ""}\n\n${q.resolucao || ""}\n\n${expl}`;
    if (!acertou && ["multipla", "caso", "lacuna"].includes(q.tipo)) expl = `Correta: ${q.opcoes[q.correta]}\n\n${expl}`;
    // Por que cada alternativa está certa ou errada (quando o conteúdo traz "justificativas")
    if (q.justificativas) expl += "\n\n" + q.opcoes.map((o, i) => `${i === q.correta ? "✅" : "❌"} **${o}** — ${q.justificativas[i]}`).join("\n");
    if (!acertou && q.tipo === "ordenar") expl = `Ordem certa:\n${q.itens.map((t, i) => `${i + 1}. ${t}`).join("\n")}\n\n${expl}`;
    if (!acertou && q.tipo === "ligar") expl = `Você errou algum par no caminho.\n\n${expl}`;
    const sh = document.createElement("div");
    sh.className = "sheet " + (acertou ? "ok" : "bad");
    sh.innerHTML = `<div class="inner"><h3>${acertou ? "✅ Mandou bem!" : "❌ Quase!"}</h3>
      <div class="expl">${fmt(expl)}</div>
      <div class="row mt"><button class="iconbtn" id="ouvir-expl" aria-label="Ouvir explicação">🔊</button>
      <button class="btn grow" id="continuar-q">Continuar</button></div></div>`;
    document.body.appendChild(sh);
    $("#ouvir-expl", sh).onclick = () => falar(expl, "Explicação");
    $("#continuar-q", sh).onclick = () => { pararFala(); sh.remove(); aoResponder(acertou); };
    $("#continuar-q", sh).focus();
  };
}

/* =====================================================================
   TELA: LIÇÃO (conteúdo em blocos → exercícios → resultado)
   ===================================================================== */
const ROTULO_BLOCO = {
  conceito: "🔴 Conceito-chave", atencao: "🟡 Atenção", dica: "🟢 Dica prática", formula: "🔵 Fórmula",
  conexao: "🟣 Conexão", bobo: "😂 Exemplo do dia a dia", serio: "🏭 Na empresa", mnemonico: "🔊 Para memorizar",
  recall: "🤔 Antes de ler…", mapa: "🧠 Mapa mental", texto: "📖",
  contexto: "🏭 Por que isso importa", exemplo: "🧮 Exemplo resolvido", passos: "🛠️ Passo a passo",
  limitacao: "⚖️ Limitações e trade-offs", referencia: "📚 Para aprofundar"
};
// Legenda de fórmulas: símbolos curtos em tabela; fórmulas longas empilhadas (não estouram a largura do celular)
function htmlLegenda(lista, empilhar = false) {
  if (empilhar || lista.some(([sim]) => String(sim).length > 12))
    return lista.map(([f, sig]) => `<div class="fx-l"><span class="fx">${esc(f)}</span><span class="small muted">${fmt(sig)}</span></div>`).join("");
  return `<table class="legenda">${lista.map(([sim, desc]) => `<tr><td>${esc(sim)}</td><td>${fmt(desc)}</td></tr>`).join("")}</table>`;
}
function htmlBloco(b) {
  if (b.tipo === "recall") {
    return `<div class="bloco recall"><div class="tag">${ROTULO_BLOCO.recall}</div><h3>${fmt(b.pergunta)}</h3>
      <p class="small muted">Pense na sua resposta antes de revelar (recuperação ativa).</p>
      <button class="btn small sec" data-revelar>👀 Revelar</button><div class="reveal hidden">${fmt(b.resposta)}</div></div>`;
  }
  let corpo = b.tipo === "mapa" ? `<pre${b.largo ? ' style="white-space: pre"' : ""}>${esc(b.texto)}</pre>` : fmt(b.texto);  // largo: rola na horizontal em vez de quebrar (ex.: Gantt)
  // Fórmulas com legenda das variáveis
  if (b.legenda) corpo += htmlLegenda(b.legenda);
  // não repete o título quando ele é igual ao rótulo do bloco (ex.: "Por que isso importa")
  const repetido = b.titulo && (ROTULO_BLOCO[b.tipo] || "").toLowerCase().endsWith(String(b.titulo).toLowerCase());
  return `<div class="bloco ${b.tipo}"><div class="tag">${ROTULO_BLOCO[b.tipo] || ""}</div>${b.titulo && !repetido ? `<h3>${fmt(b.titulo)}</h3>` : ""}${corpo}</div>`;
}
/* Capa da lição: objetivos, pré-requisitos e escolha do nível */
function telaCapa(l) {
  const m = modulo(l.modulo);
  lembrarEstudo({ licao: l.id, href: "#licao/" + l.id, titulo: l.titulo, sub: m.titulo, icone: l.icone || m.icone });
  const niveis = niveisDaLicao(l);
  const unico = niveis[0] === "unico";
  let sel = niveis.includes(S.config.nivel) ? S.config.nivel : niveis[0];
  function desenhar() {
    const obj = porNivel(l.objetivos, sel) || [];
    const nb = doNivel(l.blocos, sel).length, banco = doNivel(l.questoes, sel), nBanco = banco.length;
    const nq = S.config.porSessao ? Math.min(S.config.porSessao, nBanco) : nBanco;
    const nModelos = banco.filter(q => q.variaveis).length;
    const minutos = Math.max(3, Math.round(nb * 0.8 + nq * 0.9));
    const pre = l.prerequisitos || [];
    const sugerirFacil = !unico && sel !== "facil" && niveis.includes("facil") && !nivelConcluido(l.id, "facil");
    app().innerHTML = `<div class="lesson-top"><button class="iconbtn" id="voltar" aria-label="Voltar">✕</button>
        <div class="grow small muted">${m.icone} ${esc(m.titulo)}</div></div>
      <h1>${l.icone || "⭐"} ${esc(l.titulo)}</h1>
      ${unico
        ? `<div class="card small"><b>📘 Nível único.</b> <span class="muted">Esta lição ainda não foi dividida em Fácil, Médio e Difícil; o conteúdo corresponde aos fundamentos com alguma aplicação.</span></div>`
        : `<p class="small muted">Escolha o nível. Você pode refazer a lição em outro nível quando quiser.</p>
           <div class="lvl-cards">${niveis.map(n => {
             const r = registroNivel(l.id, n), N = NIVEIS_ESTUDO[n];
             return `<button class="lvl-card ${n === sel ? "on" : ""}" data-n="${n}">
               ${r ? `<span class="st">✓ ${r.melhor ?? Math.round(r.acertos / Math.max(1, r.total) * 100)}%</span>` : ""}
               <div class="t">${N.icone} ${N.nome} — ${N.sub}</div><div class="small muted">${N.desc}</div></button>`;
           }).join("")}</div>`}
      ${sugerirFacil ? `<div class="bloco atencao"><div class="tag">💡 Sugestão</div>Se o tema é novo para você, comece pelo <b>Fácil</b>. O ${NIVEIS_ESTUDO[sel].nome} pressupõe os fundamentos.</div>` : ""}
      ${obj.length ? `<div class="bloco conceito"><div class="tag">🎯 Ao final, você será capaz de</div><ul class="obj-list">${obj.map(o => `<li>${fmt(o)}</li>`).join("")}</ul></div>` : ""}
      ${pre.length ? `<div class="bloco conexao"><div class="tag">🧩 Pré-requisitos</div><ul class="obj-list">${pre.map(p => {
          const alvo = p.licao && LICOES.find(x => x.id === p.licao);
          const pode = alvo && licaoLiberada(alvo.id);
          return `<li>${fmt(p.texto)}${pode ? ` — <a href="#licao/${alvo.id}">revisar “${esc(alvo.titulo)}”</a>` : alvo ? " <span class='muted'>(lição ainda bloqueada)</span>" : ""}</li>`;
        }).join("")}</ul></div>` : ""}
      <p class="small muted">⏱️ ~${minutos} min · ${nb} blocos · ${nq} exercícios${nBanco > nq ? ` sorteados de um banco de ${nBanco}` : ""}${nModelos ? ` · 🎲 ${nModelos} com números que mudam a cada vez` : ""}${(m.glossario || []).length ? ` · <a href="#glossario/${m.id}">📖 glossário do módulo</a>` : ""}</p>
      <div class="footer-action"><button class="btn" id="comecar">Começar${unico ? "" : ` no ${NIVEIS_ESTUDO[sel].nome}`} ▶</button></div>`;
    $("#voltar").onclick = () => ir(rotaTrilha(m));
    $$(".lvl-card").forEach(b => b.onclick = () => { sel = b.dataset.n; som("clique"); desenhar(); });
    $("#comecar").onclick = () => {
      if (!unico) { S.config.nivel = sel; salvar(); } // lembra a preferência
      ir(`licao/${l.id}/${sel}`);
    };
  }
  desenhar();
}
function telaLicao(id, nivel) {
  const l = LICOES.find(x => x.id === id);
  if (!l) { ir("trilha"); return; }
  if (!licaoLiberada(id)) { toast("🔒 Lição bloqueada"); ir("trilha"); return; }
  if (!nivel || !niveisDaLicao(l).includes(nivel)) { telaCapa(l); return; }
  if (S.vidas <= 0) { semVidas(); return; }
  const m = modulo(l.modulo);
  const NV = NIVEIS_ESTUDO[nivel];
  const blocos = doNivel(l.blocos, nivel);
  const questoes = selecionarQuestoes(doNivel(l.questoes, nivel), S.config.porSessao);
  const totalPassos = blocos.length + questoes.length;
  let passo = 0, idxBloco = 0;
  const fila = questoes.slice();          // questões pendentes (erradas voltam para o fim)
  const jaErrou = new Set();
  let acertosPrimeira = 0;
  let saindo = false;

  function topo() {
    return `<div class="lesson-top">
      <button class="iconbtn" id="sair" aria-label="Sair">✕</button>
      <div class="progress"><div style="width:${Math.round(passo / totalPassos * 100)}%"></div></div>
      <span class="hearts">❤️ ${S.vidas}</span></div>`;
  }
  function ligarSair() {
    $("#sair").onclick = () => { if (confirm("Sair da lição? O progresso desta lição será perdido.")) { saindo = true; ir(rotaTrilha(m)); } };
  }
  // Fase 1: conteúdo, um bloco por vez (chunking)
  function mostrarBloco() {
    if (idxBloco >= blocos.length) { proximaQuestao(); return; }
    const b = blocos[idxBloco];
    app().innerHTML = topo() + `<div class="small muted mb">${m.icone} ${esc(m.titulo)} · ${esc(l.titulo)} ${nivel !== "unico" ? `<span class="chip-nivel">${NV.icone} ${NV.nome}</span>` : ""}</div>
      ${htmlBloco(b)}
      <div class="row"><button class="btn sec small" id="ouvir">🔊 Ouvir</button>
      <span class="grow small muted" style="text-align:right">${idxBloco + 1}/${blocos.length}</span></div>
      <div class="footer-action"><button class="btn" id="prox">${idxBloco + 1 < blocos.length ? "Próximo" : "Vamos praticar! 💪"}</button></div>`;
    ligarSair();
    const rv = $("[data-revelar]");
    if (rv) rv.onclick = () => { rv.nextElementSibling.classList.remove("hidden"); rv.remove(); som("clique"); };
    $("#ouvir").onclick = () => falar(textoFalaBloco(b), l.titulo);
    $("#prox").onclick = () => { pararFala(); idxBloco++; passo++; mostrarBloco(); window.scrollTo(0, 0); };
  }
  // Fase 2: exercícios
  function proximaQuestao() {
    if (!fila.length) { concluir(); return; }
    const q = fila.shift();
    app().innerHTML = topo() + `<div id="qarea" class="lesson-pad"></div>`;
    ligarSair();
    renderQuestao(q, $("#qarea"), acertou => {
      if (saindo) return;
      if (acertou) {
        if (!jaErrou.has(q.id)) { acertosPrimeira++; registrarResposta(q, true); }
        passo++;
      } else {
        if (!jaErrou.has(q.id)) registrarResposta(q, false);
        jaErrou.add(q.id);
        fila.push(q); // volta para o fim, como no Duolingo
        perderVida();
        if (S.vidas <= 0) { semVidas(); return; }
      }
      proximaQuestao();
      window.scrollTo(0, 0);
    });
  }
  function concluir() {
    const repetida = nivelConcluido(l.id, nivel);
    const perfeita = jaErrou.size === 0 && questoes.length > 0;
    const pct = questoes.length ? Math.round(acertosPrimeira / questoes.length * 100) : 100;
    const xp = (repetida ? 5 : NV.xp) + acertosPrimeira * 2 + (perfeita ? 5 : 0);
    const reg = S.licoes[l.id] || { vezes: 0 };
    reg.niveis = reg.niveis || {};
    const ant = reg.niveis[nivel];
    reg.niveis[nivel] = { data: hoje(), acertos: acertosPrimeira, total: questoes.length, vezes: (ant ? ant.vezes : 0) + 1, melhor: Math.max(ant ? ant.melhor || 0 : 0, pct) };
    Object.assign(reg, { data: hoje(), acertos: acertosPrimeira, total: questoes.length, vezes: reg.vezes + 1 });
    S.licoes[l.id] = reg;
    salvar();
    ganharXP(xp);
    desbloquear("primeira-licao");
    if (perfeita) desbloquear("licao-perfeita");
    if (LICOES.filter(x => nivelConcluido(x.id, "dificil")).length >= 5) desbloquear("dificil-5");
    if (moduloConcluido(m) && m.conquista) desbloquear(m.conquista.id);
    confete(); som("nivel");
    const prox = proximaLicao();
    const niveis = niveisDaLicao(l), idx = niveis.indexOf(nivel);
    const acima = niveis[idx + 1], abaixo = niveis[idx - 1];
    const resumo = porNivel(l.resumo, nivel);
    // Recomendação honesta a partir do desempenho (não do simples fato de concluir)
    let recomendacao = "";
    if (pct >= 80 && acima) recomendacao = `<div class="bloco dica" style="text-align:left"><div class="tag">📈 Próximo passo</div>Bom domínio neste nível (${pct}%). Quando quiser, aprofunde no <b>${NIVEIS_ESTUDO[acima].icone} ${NIVEIS_ESTUDO[acima].nome}</b>.</div>`;
    else if (pct < 60) recomendacao = `<div class="bloco atencao" style="text-align:left"><div class="tag">💡 Recomendação</div>Acerto de primeira abaixo de 60%. Releia o resumo abaixo${(l.prerequisitos || []).length ? ", confira os pré-requisitos na capa" : ""}${abaixo ? ` e considere refazer no <b>${NIVEIS_ESTUDO[abaixo].nome}</b>` : " e refaça a lição amanhã"}. As questões erradas voltam na revisão.</div>`;
    app().innerHTML = `<div class="center" style="padding-top:30px">
      <div style="font-size:4rem">${perfeita ? "💎" : "🎉"}</div>
      <h1>Lição concluída!</h1>
      <p class="muted">${esc(l.titulo)}${nivel !== "unico" ? ` · ${NV.icone} ${NV.nome}` : ""}</p>
      <div class="stat-grid mt mb">
        <div class="stat"><div class="v">+${xp}</div><div class="l">XP ganhos</div></div>
        <div class="stat"><div class="v">${pct}%</div><div class="l">acertos de primeira</div></div>
      </div>
      ${jaErrou.size ? `<p class="small muted">🔁 ${jaErrou.size} pergunta(s) que você errou voltarão na revisão em D+1.</p>` : `<p class="small muted">Zero defeito! Nenhum erro. 💎</p>`}
      ${recomendacao}
      ${resumo ? `<div class="bloco texto" style="text-align:left"><div class="tag">📝 Resumo da lição</div>${fmt(resumo)}
        <div class="mt"><button class="btn small sec" id="ouvir-resumo">🔊 Ouvir resumo</button></div></div>` : ""}
      ${prox ? `<button class="btn" id="seguir">Próxima lição ▶</button>` : ""}
      ${acima && pct >= 60 ? `<button class="btn sec" id="subir">${NIVEIS_ESTUDO[acima].icone} Fazer esta lição no ${NIVEIS_ESTUDO[acima].nome}</button>` : ""}
      <button class="btn sec" onclick="ir('${rotaTrilha(m)}')">Voltar à trilha</button>
    </div>`;
    const s = $("#seguir");
    if (s) s.onclick = () => ir("licao/" + prox.id);
    const sb = $("#subir");
    if (sb) sb.onclick = () => ir(`licao/${l.id}/${acima}`);
    const orr = $("#ouvir-resumo");
    if (orr) orr.onclick = () => falar(resumo, "Resumo: " + l.titulo);
  }
  mostrarBloco();
}
function semVidas() {
  som("erro");
  app().innerHTML = `<div class="center" style="padding-top:50px">
    <div style="font-size:4rem">💔</div><h1>Acabaram as vidas</h1>
    <p class="muted">Recupere vidas revisando: cada acerto na revisão devolve ❤️ 1 vida. Amanhã elas recarregam sozinhas.</p>
    <button class="btn" onclick="ir('revisao/vidas')">🔁 Revisar para recuperar vidas</button>
    <button class="btn sec" onclick="ir('exercicios')">Voltar</button></div>`;
}

/* =====================================================================
   TELA: REVISAR (central de revisão + flashcards)
   ===================================================================== */
function telaRevisar() {
  const pend = revisoesPendentes();
  const agenda = {};
  Object.values(S.revisao).forEach(r => { if (r.proxima > hoje()) agenda[r.proxima] = (agenda[r.proxima] || 0) + 1; });
  const proximas = Object.keys(agenda).sort().slice(0, 5);
  const fracas = pontosFracos(5);
  app().innerHTML = barraTopo() + `<h1>🔁 Revisar</h1>
    <div class="card">
      <h2>Revisão espaçada</h2>
      <p class="muted small">Perguntas que você errou voltam em D+1, D+3, D+7, D+15 e D+30. Cada acerto: +3 XP e ❤️ +1 vida.</p>
      <div class="stat-grid mb">
        <div class="stat"><div class="v">${pend.length}</div><div class="l">para hoje</div></div>
        <div class="stat"><div class="v">${S.dominadas}</div><div class="l">dominadas (passaram do D+30)</div></div>
      </div>
      <button class="btn" ${pend.length ? "" : "disabled"} onclick="ir('revisao/pendentes')">${pend.length ? `Revisar agora (${pend.length})` : "Nada pendente hoje ✓"}</button>
      ${proximas.length ? `<p class="small muted mt">📅 Próximas: ${proximas.map(d => `${d.split("-").reverse().slice(0, 2).join("/")} (${agenda[d]})`).join(" · ")}</p>` : ""}
    </div>
    <div class="card">
      <h2>🏋️ Treino livre</h2>
      <p class="muted small">Perguntas misturadas dos módulos que você já liberou (intercalação). Bom para recuperar vidas.</p>
      <button class="btn sec" onclick="ir('revisao/treino')">Treinar 10 perguntas</button>
      ${fracas.length ? `<button class="btn sec" onclick="ir('revisao/fracos')">🎯 Treinar meus pontos fracos</button>` : ""}
    </div>
    <a class="card link" href="#glossario"><span class="big">📖</span><span class="grow"><b>Glossário</b><br><span class="small muted">${MODS.reduce((t, m) => t + (m.glossario || []).length, 0)} termos técnicos com definição</span></span>›</a>
    <div class="card">
      <h2>🃏 Flashcards</h2>
      <p class="muted small">Vire a carta e avalie: errei / difícil / fácil.</p>
      ${MODS.filter(m => (m.flashcards || []).length && moduloLiberado(m)).map(m => `<a class="card link" href="#flashcards/${m.id}" style="margin-bottom:8px"><span class="big">${m.icone}</span>
        <span class="grow"><b>${esc(m.titulo)}</b><br><span class="small muted">${cartasPendentes(m.id).length} para hoje · ${(m.flashcards || []).length} cartas</span></span>›</a>`).join("") || `<p class="small muted">Libere um módulo na trilha primeiro.</p>`}
    </div>`;
}
function pontosFracos(n) {
  return Object.entries(S.questoes).filter(([id, s]) => Q[id] && s.erros > 0)
    .sort((a, b) => (b[1].erros - b[1].acertos) - (a[1].erros - a[1].acertos)).slice(0, n).map(([id]) => Q[id]);
}

/* Sessão de revisão (pendentes, treino livre, pontos fracos ou para recuperar vidas) */
function telaSessaoRevisao(modo) {
  let lista;
  if (modo === "pendentes") lista = revisoesPendentes().map(id => Q[id]);
  else if (modo === "fracos") lista = pontosFracos(10);
  else if (modo === "vidas") lista = revisoesPendentes().map(id => Q[id]);
  else lista = [];
  const listaEraVazia = !lista.length;
  if (listaEraVazia || modo === "treino") {
    const liberadas = questoesLiberadas(q => licaoConcluida(q.licao) && (!q.nivel || nivelConcluido(q.licao, q.nivel)));
    lista = embaralhar(liberadas.length ? liberadas : questoesLiberadas()).slice(0, 10);
  }
  const ehRevisao = (modo === "pendentes" || modo === "vidas") && revisoesPendentes().length > 0;
  lista = embaralhar(lista).slice(0, 15);
  if (!lista.length) { toast("Conclua uma lição primeiro 🙂"); ir("trilha"); return; }
  let i = 0, acertos = 0, vidasGanhas = 0;
  function mostrar() {
    if (i >= lista.length) return fim();
    const q = lista[i];
    const r = S.revisao[q.id];
    app().innerHTML = `<div class="lesson-top"><button class="iconbtn" onclick="ir('revisar')" aria-label="Sair">✕</button>
      <div class="progress"><div style="width:${Math.round(i / lista.length * 100)}%"></div></div><span class="hearts">❤️ ${S.vidas}</span></div>
      <div class="small muted mb">${modulo(q.modulo).icone} ${esc(modulo(q.modulo).titulo)}${r ? ` · etapa ${NOMES_REVISAO[r.etapa] || ""}` : ""}</div>
      <div id="qarea" class="lesson-pad"></div>`;
    renderQuestao(q, $("#qarea"), acertou => {
      if (ehRevisao || S.revisao[q.id]) registrarRevisao(q, acertou); else registrarResposta(q, acertou);
      if (acertou) { acertos++; if (recuperarVida()) vidasGanhas++; }
      i++; mostrar(); window.scrollTo(0, 0);
    });
  }
  function fim() {
    const xp = acertos * (ehRevisao ? 3 : 1);
    ganharXP(xp);
    if (acertos === lista.length) confete();
    app().innerHTML = `<div class="center" style="padding-top:40px"><div style="font-size:4rem">🔁</div><h1>Revisão feita!</h1>
      <div class="stat-grid mt mb">
        <div class="stat"><div class="v">${acertos}/${lista.length}</div><div class="l">acertos</div></div>
        <div class="stat"><div class="v">+${xp}</div><div class="l">XP · ❤️ +${vidasGanhas}</div></div>
      </div>
      <button class="btn" onclick="ir('inicio')">Voltar ao início</button>
      <button class="btn sec" onclick="ir('revisar')">Revisar mais</button></div>`;
  }
  mostrar();
}

/* =====================================================================
   TELA: FLASHCARDS (virar carta + autoavaliação)
   ===================================================================== */
function telaFlashcards(modId) {
  if (!modId) {
    app().innerHTML = barraTopo() + `<h1>🃏 Flashcards</h1>` +
      (MODS.filter(m => (m.flashcards || []).length && moduloLiberado(m)).map(m => `<a class="card link" href="#flashcards/${m.id}"><span class="big">${m.icone}</span>
        <span class="grow"><b>${esc(m.titulo)}</b><br><span class="small muted">${cartasPendentes(m.id).length} para hoje</span></span>›</a>`).join("")
        || `<p class="muted">Libere um módulo na trilha primeiro.</p>`);
    return;
  }
  const m = modulo(modId);
  if (!m) { ir("flashcards"); return; }
  let fila = embaralhar(cartasPendentes(modId));
  const modoTodas = !fila.length;
  if (modoTodas) fila = embaralhar(m.flashcards || []); // nada pendente: treino com todas
  const total = fila.length;
  let feitas = 0;
  function mostrar() {
    if (!fila.length) {
      confete(); ganharXP(Math.min(20, feitas));
      app().innerHTML = barraTopo() + `<div class="center" style="padding-top:30px"><div style="font-size:4rem">🃏</div><h1>Baralho concluído!</h1>
        <p class="muted">${feitas} cartas revisadas. +${Math.min(20, feitas)} XP</p>
        <button class="btn" onclick="ir('revisar')">Voltar</button></div>`;
      return;
    }
    const c = fila[0];
    app().innerHTML = `<div class="lesson-top"><button class="iconbtn" onclick="ir('revisar')" aria-label="Sair">✕</button>
      <div class="progress"><div style="width:${Math.round(feitas / Math.max(total, 1) * 100)}%"></div></div><span class="small muted">${fila.length}</span></div>
      <div class="small muted mb">${m.icone} ${esc(m.titulo)}${modoTodas ? " · treino (nada pendente hoje)" : ""}</div>
      <div class="flip" id="carta"><div class="inner">
        <div class="face front">${fmt(c.frente)}<span class="hint">toque para virar ↻</span></div>
        <div class="face back">${fmt(c.verso)}</div></div></div>
      <div class="row mb"><button class="btn sec small" id="ouvir">🔊 Ouvir</button></div>
      <div class="self-eval hidden" id="aval">
        <button class="btn danger" data-a="0">😵 Errei</button>
        <button class="btn sec" data-a="1">😐 Difícil</button>
        <button class="btn" data-a="2">😎 Fácil</button>
      </div>
      <p class="small muted center mt" id="dica">Tente lembrar a resposta antes de virar.</p>`;
    const carta = $("#carta");
    carta.onclick = () => { carta.classList.toggle("on"); som("clique"); $("#aval").classList.remove("hidden"); $("#dica").classList.add("hidden"); };
    $("#ouvir").onclick = () => falar(carta.classList.contains("on") ? c.verso : c.frente, "Flashcard");
    $$("#aval [data-a]").forEach(b => b.onclick = () => avaliar(c, +b.dataset.a));
  }
  function avaliar(c, nota) {
    const st = S.cartas[c.id] || { caixa: 0, proxima: hoje() };
    fila.shift();
    if (nota === 0) { st.caixa = 0; st.proxima = hoje(); fila.push(c); som("erro"); }        // volta ainda nesta sessão
    else if (nota === 1) { st.caixa = Math.max(1, st.caixa); st.proxima = hoje(1); feitas++; som("clique"); }
    else { st.caixa = Math.min(st.caixa + 1, INTERVALOS_REVISAO.length); st.proxima = hoje(INTERVALOS_REVISAO[st.caixa - 1]); feitas++; som("acerto"); }
    S.cartas[c.id] = st;
    S.cartasVistas++;
    if (S.cartasVistas >= 50) desbloquear("cartas-50");
    salvar();
    mostrar();
  }
  mostrar();
}

/* =====================================================================
   TELA: QUIZ RELÂMPAGO (estilo Kahoot) — solo ou em grupo
   ===================================================================== */
const CORES_K = [
  { cls: "red", forma: "▲", nome: "vermelho" }, { cls: "blue", forma: "◆", nome: "azul" },
  { cls: "yellow", forma: "●", nome: "amarelo" }, { cls: "green", forma: "■", nome: "verde" }
];
function perguntasQuiz(n) {
  const pool = questoesLiberadas(q => nivelPermitido(q) && (["multipla", "vf"].includes(q.tipo) || (q.tipo === "lacuna" && q.opcoes.length <= 4)));
  return embaralhar(pool).slice(0, n).map(q => {
    // Converte cada questão para o formato "até 4 alternativas"
    if (q.tipo === "vf") return { q, texto: q.pergunta, alts: ["Verdadeiro", "Falso"], certa: q.correta ? 0 : 1 };
    const ordem = embaralhar(q.opcoes.map((_, i) => i)).slice(0, 4);
    if (!ordem.includes(q.correta)) ordem[0] = q.correta;
    const alts = embaralhar(ordem);
    return { q, texto: q.pergunta.replace("___", "_____"), alts: alts.map(i => q.opcoes[i]), certa: alts.indexOf(q.correta) };
  });
}
function pontosKahoot(tempoGasto, combo) {
  const base = Math.round(1000 * (1 - (tempoGasto / TEMPO_QUIZ) / 2)); // 500 a 1000 pontos
  const bonus = Math.min(500, Math.max(0, combo - 1) * 100);          // combo: +100 por acerto seguido
  return { base, bonus, total: base + bonus };
}
function telaQuiz() {
  const disponiveis = perguntasQuiz(999).length;
  app().innerHTML = barraTopo() + `<h1>⚡ Quiz Relâmpago</h1>
    <p class="muted small">${PERGUNTAS_QUIZ} perguntas · ${TEMPO_QUIZ}s cada · quanto mais rápido, mais pontos · acertos seguidos dão bônus de combo 🔗</p>
    <div class="k-grid mb" aria-hidden="true">${CORES_K.map(c => `<div class="k-tile ${c.cls}" style="min-height:60px"><span class="shape">${c.forma}</span></div>`).join("")}</div>
    <button class="btn" id="solo" ${disponiveis ? "" : "disabled"}>🎮 Jogar sozinho</button>
    <button class="btn sec" id="grupo" ${disponiveis ? "" : "disabled"}>🤝 Desafio em grupo (mesmo celular)</button>
    ${disponiveis ? `<p class="small muted mt">${disponiveis} perguntas disponíveis dos módulos liberados.</p>` : `<p class="small muted mt">Conclua a primeira lição para liberar o quiz.</p>`}
    <div class="card mt"><h2>🏆 Meu ranking</h2>
      ${S.ranking.length ? `<ol class="rank">${S.ranking.map((r, i) => `<li><span>${["🥇", "🥈", "🥉"][i] || (i + 1) + "º"} ${esc(r.nome)} <span class="small muted">${r.data.split("-").reverse().join("/")}</span></span><span>${r.pontos.toLocaleString("pt-BR")} · ${r.acertos}/${r.total}</span></li>`).join("")}</ol>` : `<p class="small muted">Jogue para aparecer aqui.</p>`}
    </div>`;
  $("#solo").onclick = () => jogarQuiz([S.config.nome || "Eu"]);
  $("#grupo").onclick = configurarGrupo;
}

    <p class="muted small">Até 6 jogadores. A cada pergunta, o celular passa de mão em mão. Mesmo tempo para todos.</p>
    <div id="jogadores"></div>
    <button class="btn sec small" id="add">+ jogador</button>

  const desenhar = () => {

      ${nomes.length > 2 ? `<button class="iconbtn" data-del="${i}" aria-label="Remover">🗑️</button>` : ""}</div>`).join("");

function jogarQuiz(jogadores) {
  const grupo = jogadores.length > 1;
  const perguntas = perguntasQuiz(PERGUNTAS_QUIZ);
  const placar = jogadores.map(nome => ({ nome, pontos: 0, acertos: 0, combo: 0, maxCombo: 0 }));
  let iq = 0, ij = 0, timer = null;
  document.getElementById("nav").classList.add("hidden");
  limparTela = () => { clearInterval(timer); };

  function telaPasse() {
    // No modo grupo: pede para passar o celular
    app().innerHTML = `<div class="pass-screen"><div class="big">📱➡️</div>
      <h1>Vez de ${esc(placar[ij].nome)}</h1><p class="muted">Pergunta ${iq + 1} de ${perguntas.length}</p>
      <button class="btn" id="pronto">Estou pronto(a)!</button></div>`;
    $("#pronto").onclick = mostrarPergunta;
  }
  function mostrarPergunta() {
    const p = perguntas[iq];
    const inicio = performance.now();
    let respondeu = false;
    siglasBloqueadas = bloqueioDaQuestao({ pergunta: p.texto, opcoes: p.alts });
    app().innerHTML = `<div class="row" style="padding-top:calc(10px + env(safe-area-inset-top))">
        <button class="iconbtn" id="sairq" aria-label="Sair">✕</button>
        <span class="grow small muted">${grupo ? esc(placar[ij].nome) + " · " : ""}Pergunta ${iq + 1}/${perguntas.length}</span>
        <span class="chip">🏆 ${placar[ij].pontos.toLocaleString("pt-BR")}</span></div>
      <div class="k-timer mt"><div class="t" id="tnum">${TEMPO_QUIZ}</div><div class="progress grow"><div id="tbar" style="width:100%"></div></div></div>
      <div class="k-question" data-qid="${p.q.id}">${fmt(p.texto)}</div>
      <div class="k-grid">${p.alts.map((a, i) => `<button class="k-tile ${CORES_K[i].cls}" data-i="${i}" aria-label="${CORES_K[i].nome}: ${esc(a)}"><span class="shape">${CORES_K[i].forma}</span>${esc(a)}</button>`).join("")}</div>`;
    $("#sairq").onclick = () => { if (confirm("Sair do quiz?")) { clearInterval(timer); ir("quiz"); } };
    let ultimoSeg = TEMPO_QUIZ;
    timer = setInterval(() => {
      const gasto = (performance.now() - inicio) / 1000;
      const resta = Math.max(0, TEMPO_QUIZ - gasto);
      $("#tbar").style.width = (resta / TEMPO_QUIZ * 100) + "%";
      const seg = Math.ceil(resta);
      if (seg !== ultimoSeg) { ultimoSeg = seg; $("#tnum").textContent = seg; if (seg <= 5 && seg > 0) som("tique"); }
      if (resta <= 0) responder(-1);
    }, 100);
    $$(".k-tile").forEach(b => b.onclick = () => responder(+b.dataset.i));
    function responder(i) {
      if (respondeu) return;
      respondeu = true; clearInterval(timer);
      const gasto = Math.min(TEMPO_QUIZ, (performance.now() - inicio) / 1000);
      const jog = placar[ij];
      const acertou = i === p.certa;
      let pts = { base: 0, bonus: 0, total: 0 };
      if (acertou) { jog.combo++; jog.maxCombo = Math.max(jog.maxCombo, jog.combo); jog.acertos++; pts = pontosKahoot(gasto, jog.combo); jog.pontos += pts.total; }
      else jog.combo = 0;
      if (!grupo) registrarResposta(p.q, acertou); // no modo grupo não mexe na sua revisão
      som(acertou ? "acerto" : "erro");
      if (grupo) {
        // no grupo, não revela a resposta até todos responderem
        app().innerHTML = `<div class="pass-screen"><div class="big">${i < 0 ? "⏰" : "📨"}</div><h2>${i < 0 ? "Tempo esgotado!" : "Resposta registrada!"}</h2>
          <button class="btn" id="seg">Continuar</button></div>`;
        $("#seg").onclick = avancar;
      } else {
        app().innerHTML = `<div style="padding-top:20px"><div class="k-result ${acertou ? "ok" : "bad"}">
          <div style="font-size:2.5rem">${acertou ? "✔" : i < 0 ? "⏰" : "✖"}</div>
          <h2 style="color:#fff">${acertou ? "Correto!" : i < 0 ? "Tempo esgotado!" : "Incorreto"}</h2>
          <div class="pts">+${pts.total}</div>
          ${pts.bonus ? `<div>🔗 Combo x${jog.combo}: +${pts.bonus} de bônus</div>` : ""}</div>
          <div class="card"><b>Resposta:</b> ${CORES_K[p.certa].forma} ${esc(p.alts[p.certa])}<p class="small muted mt">${fmt(p.q.explicacao || "")}</p></div>
          <button class="btn" id="seg">${iq + 1 < perguntas.length ? "Próxima ▶" : "Ver resultado"}</button></div>`;
        $("#seg").onclick = avancar;
      }
    }
  }
  function avancar() {
    if (grupo && ij + 1 < placar.length) { ij++; telaPasse(); return; }
    if (grupo) { placarParcial(); return; }
    iq++;
    iq < perguntas.length ? mostrarPergunta() : fim();
  }
  function placarParcial() {
    const p = perguntas[iq];
    const ord = placar.slice().sort((a, b) => b.pontos - a.pontos);
    app().innerHTML = `<div style="padding-top:20px"><div class="card"><b>Resposta certa:</b> ${CORES_K[p.certa].forma} ${esc(p.alts[p.certa])}
      <p class="small muted mt">${fmt(p.q.explicacao || "")}</p></div>
      <h2>📊 Placar</h2><ol class="rank">${ord.map(j => `<li><span>${esc(j.nome)} ${j.combo > 1 ? "🔗x" + j.combo : ""}</span><span>${j.pontos.toLocaleString("pt-BR")}</span></li>`).join("")}</ol>
      <button class="btn mt" id="seg">${iq + 1 < perguntas.length ? "Próxima pergunta ▶" : "Ver pódio 🏆"}</button></div>`;
    $("#seg").onclick = () => { iq++; ij = 0; iq < perguntas.length ? telaPasse() : fim(); };
  }
  function fim() {
    clearInterval(timer);
    confete(); som("nivel");
    if (grupo) {
      desbloquear("grupo");
      ganharXP(10);
      const ord = placar.slice().sort((a, b) => b.pontos - a.pontos);
      app().innerHTML = `<div class="center" style="padding-top:30px"><div style="font-size:4rem">🏆</div><h1>Pódio</h1>
        <ol class="rank" style="text-align:left">${ord.map((j, i) => `<li><span>${["🥇", "🥈", "🥉"][i] || (i + 1) + "º"} ${esc(j.nome)}</span><span>${j.pontos.toLocaleString("pt-BR")} · ${j.acertos}/${perguntas.length}</span></li>`).join("")}</ol>
        <button class="btn mt" onclick="ir('quiz')">Jogar de novo</button><button class="btn sec" onclick="ir('inicio')">Início</button></div>`;
      return;
    }
    const j = placar[0];
    const xp = j.acertos * 2 + (j.acertos === perguntas.length ? 5 : 0);
    ganharXP(xp);
    if (j.acertos === perguntas.length && perguntas.length >= 5) desbloquear("quiz-perfeito");
    if (j.maxCombo >= 5) desbloquear("combo-5");
    S.ranking.push({ nome: j.nome, pontos: j.pontos, acertos: j.acertos, total: perguntas.length, data: hoje() });
    S.ranking.sort((a, b) => b.pontos - a.pontos);
    S.ranking = S.ranking.slice(0, 10);
    const pos = S.ranking.findIndex(r => r.pontos === j.pontos && r.data === hoje());
    salvar();
    app().innerHTML = `<div class="center" style="padding-top:30px"><div style="font-size:4rem">⚡</div><h1>${j.pontos.toLocaleString("pt-BR")} pontos</h1>
      <p class="muted">${j.acertos}/${perguntas.length} acertos · maior combo 🔗x${j.maxCombo} · +${xp} XP</p>
      ${pos === 0 ? `<p><b>🥇 Novo recorde pessoal!</b></p>` : pos > 0 ? `<p>Você ficou em ${pos + 1}º no seu ranking.</p>` : ""}
      <button class="btn mt" onclick="ir('quiz')">Jogar de novo</button><button class="btn sec" onclick="ir('inicio')">Início</button></div>`;
  }
  grupo ? telaPasse() : mostrarPergunta();
}

          <div class="progress"><div style="width:${x.pct || 0}%"></div></div></div>
        <div class="hbar"><div class="top"><span>🧠 Retenção confirmada</span><span>${x.conf}/${x.totalQ}</span></div>
          <div class="progress gold"><div style="width:${Math.round(x.conf / Math.max(1, x.totalQ) * 100)}%"></div></div></div></div>`).join("")}
    </div>
    ${recs.length ? `<div class="card"><h2>📌 Recomendações</h2><ul class="obj-list small">${recs.slice(0, 5).map(r => `<li>${r}</li>`).join("")}</ul></div>` : ""}
    <div class="card"><h2>⚠️ Pontos fracos</h2>
      ${pior ? `<p class="small">Módulo com menor acerto: <b>${pior.m.icone} ${esc(pior.m.titulo)}</b> (${pior.pct}%)</p>` : ""}
      ${fracas.length ? `<ol class="small">${fracas.map(q => `<li>${esc(q.pergunta.slice(0, 90))}${q.pergunta.length > 90 ? "…" : ""} <span class="muted">(${S.questoes[q.id].erros} erro${S.questoes[q.id].erros > 1 ? "s" : ""})</span></li>`).join("")}</ol>
        <button class="btn sec" onclick="ir('revisao/fracos')">🎯 Treinar pontos fracos</button>` : `<p class="small muted">Sem pontos fracos por enquanto. 💪</p>`}
    </div>
    <a class="card link" href="#salvos"><span class="big">⭐</span><span class="grow"><b>Favoritos e histórico</b><br><span class="small muted">${(S.favoritos || []).length} salvos · ${(S.historico || []).length} consultas recentes</span></span>›</a>
    <a class="card link" href="#desafio/historico"><span class="big">⚡</span><span class="grow"><b>Desafios feitos</b><br><span class="small muted">${Object.keys(S.desafios).length} de ${(window.DESAFIOS || []).length}</span></span>›</a>
    <a class="card link" href="#conquistas"><span class="big">🏅</span><span class="grow"><b>Conquistas</b><br><span class="small muted">${Object.keys(S.conquistas).length} de ${todasConquistas().length}</span></span>›</a>
    <a class="card link" href="#config"><span class="big">⚙️</span><span class="grow"><b>Configurações</b><br><span class="small muted">meta, som, tema, backup</span></span>›</a>`;
}

/* =====================================================================
   TELA: GLOSSÁRIO (termos técnicos de todos os módulos, com busca)
   ===================================================================== */
function telaGlossario(modId) {
  const mods = MODS.filter(m => (m.glossario || []).length && (!modId || m.id === modId));
  app().innerHTML = barraTopo() + `<h1>📖 Glossário</h1>
    <input type="text" id="busca" placeholder="Buscar termo (ex.: folga, TAP, WIP)…" aria-label="Buscar termo">
    ${modId ? `<p class="small mt"><a href="#glossario">Ver todos os módulos</a></p>` : ""}
    <div id="lista" class="mt"></div>`;
  function desenhar(filtro) {
    const f = (filtro || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    $("#lista").innerHTML = mods.map(m => {
      const itens = m.glossario.slice().sort((a, b) => a.termo.localeCompare(b.termo, "pt-BR"))
        .filter(g => !f || norm(g.termo).includes(f) || norm(g.definicao).includes(f));
      return itens.length ? `<div class="card"><h3>${m.icone} ${esc(m.titulo)}</h3>${itens.map(g =>
        `<div class="glos-item"><b>${esc(g.termo)}</b><div class="small">${fmt(g.definicao)}</div></div>`).join("")}</div>` : "";
    }).join("") || `<p class="muted">Nenhum termo encontrado.</p>`;
  }
  desenhar("");
  $("#busca").oninput = e => desenhar(e.target.value);
}

/* =====================================================================
   TELA: CONQUISTAS
   ===================================================================== */
function telaConquistas() {
  const lista = todasConquistas();
  app().innerHTML = barraTopo() + `<h1>🏅 Conquistas</h1><p class="muted small">${Object.keys(S.conquistas).length} de ${lista.length} desbloqueadas</p>` +
    lista.map(c => {
      const tem = S.conquistas[c.id];
      return `<div class="card ach ${tem ? "" : "locked"}"><div class="ico">${c.icone}</div>
        <div class="grow"><b class="nm">${esc(c.nome)}</b><div class="small muted">${esc(c.descricao)}</div>
        ${tem ? `<div class="small" style="color:var(--ok)">✓ ${tem.split("-").reverse().join("/")}</div>` : ""}</div></div>`;
    }).join("");
}

/* =====================================================================
   TELA: CONFIGURAÇÕES (meta, som, tema, backup)
   ===================================================================== */
function codificar(obj) { return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(obj)))); }
function decodificar(txt) { return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(txt.trim()), c => c.charCodeAt(0)))); }
function importarEstado(obj) {
  if (!obj || typeof obj !== "object" || typeof obj.xpTotal !== "number") throw new Error("formato inválido");
  if (!confirm("Isso vai SUBSTITUIR o progresso atual deste aparelho. Continuar?")) return;
  S = mesclar(estadoInicial(), obj);
  salvar(); aplicarTema();
  toast("✅ Progresso importado!");
  ir("inicio");
}
function telaConfig() {
  const c = S.config;
  const seg = (nome, opcoes, atual) => `<div class="seg" data-seg="${nome}">${opcoes.map(([v, r]) => `<button data-v="${v}" class="${String(atual) === String(v) ? "on" : ""}">${r}</button>`).join("")}</div>`;
  app().innerHTML = barraTopo() + `<h1>⚙️ Configurações</h1>
    <a class="card link" href="#estagio"><span class="big">🎯</span><span class="grow"><b>Modo Estágio</b><br><span class="small muted">${areaEstagio() ? areaEstagio().icone + " " + esc(areaEstagio().nome) + " · trocar" : "Desativado · escolha sua área (opcional)"}</span></span>›</a>
    <div class="card"><h3>🎯 Meta diária</h3>${seg("meta", [[20, "20 XP<br><span class='small'>leve</span>"], [50, "50 XP<br><span class='small'>normal</span>"], [100, "100 XP<br><span class='small'>intenso</span>"]], c.meta)}</div>
    <div class="card"><h3>📚 Nível de estudo padrão</h3>${seg("nivel", [["facil", "🌱 Fácil<br><span class='small'>fundamentos</span>"], ["medio", "🔧 Médio<br><span class='small'>aplicação</span>"], ["dificil", "🧠 Difícil<br><span class='small'>aprofundamento</span>"]], c.nivel)}
      <p class="small muted mt">Define o nível sugerido nas lições e as questões do Quiz Relâmpago. Você pode trocar em cada lição.</p></div>
    <div class="card"><h3>🎲 Questões por lição</h3>${seg("porSessao", [[4, "4<br><span class='small'>rápida</span>"], [6, "6<br><span class='small'>padrão</span>"], [8, "8"], [0, "Todas"]], c.porSessao)}
      <p class="small muted mt">As questões são sorteadas do banco de cada lição a cada vez (prioridade para as que você nunca viu ou errou). Questões com 🎲 mudam os números a cada tentativa.</p></div>
    <div class="card"><h3>🔊 Sons</h3>${seg("som", [["true", "Ligado"], ["false", "Desligado"]], c.som)}</div>
    <div class="card"><h3>🌗 Tema</h3>${seg("tema", [["auto", "Automático"], ["light", "Claro"], ["dark", "Escuro"]], c.tema)}</div>
    <div class="card"><h3>🙋 Seu nome no ranking</h3><input type="text" id="nome" maxlength="16" value="${esc(c.nome)}"></div>
    <div class="card"><h3>💾 Backup do progresso</h3>
      <p class="small muted">O progresso fica só neste navegador. Antes de trocar de celular ou limpar dados, exporte!</p>
      <button class="btn" id="exp-arq">⬇️ Exportar arquivo</button>
      <button class="btn sec" id="exp-cod">📋 Copiar código</button>
      <textarea id="codigo" class="mt hidden" readonly></textarea>
      <hr style="border:0;border-top:1px solid var(--border);margin:16px 0">
      <label class="btn sec" style="text-align:center">⬆️ Importar arquivo<input type="file" id="imp-arq" accept=".json,application/json" class="hidden"></label>
      <textarea id="imp-cod" class="mt" placeholder="…ou cole aqui o código de backup"></textarea>
      <button class="btn sec mt" id="imp-btn">Importar código</button>
    </div>
    <div class="card"><h3>🧪 Verificador de conteúdo</h3>
      <p class="small muted">${MODS.length} módulo(s), ${LICOES.length} lições, ${Object.keys(Q).length} questões (${Object.values(Q).filter(q => q.variaveis).length} com números sorteados), ${Object.keys(CARTAS).length} flashcards carregados.</p>
      ${errosConteudo.length ? `<div class="errbox">${errosConteudo.map(esc).join("\n")}</div>` : `<p class="small" style="color:var(--ok)">✓ Nenhum problema encontrado.</p>`}
    </div>
    <div class="card"><h3>🧨 Zona de perigo</h3><button class="btn danger" id="zerar">Apagar todo o progresso</button></div>
    <p class="small muted center">Problema · Engenharia de Produção · funciona offline depois do 1º acesso</p>`;
  $$("[data-seg]").forEach(g => $$("button", g).forEach(b => b.onclick = () => {
    const nome = g.dataset.seg; let v = b.dataset.v;
    if (nome === "meta" || nome === "porSessao") v = +v;
    if (nome === "som") v = v === "true";
    S.config[nome] = v; salvar();
    if (nome === "tema") aplicarTema();
    som("clique"); telaConfig();
  }));
  $("#nome").onchange = e => { S.config.nome = e.target.value.trim() || "Eu"; salvar(); toast("Nome salvo"); };
  $("#exp-arq").onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `engprod-progresso-${hoje()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("⬇️ Arquivo gerado");
  };
  $("#exp-cod").onclick = async () => {
    const cod = codificar(S), ta = $("#codigo");
    ta.value = cod; ta.classList.remove("hidden"); ta.select();
    try { await navigator.clipboard.writeText(cod); toast("📋 Código copiado! Cole no outro celular."); }
    catch { toast("Selecione e copie o código abaixo"); }
  };
  $("#imp-arq").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { importarEstado(JSON.parse(r.result)); } catch (err) { toast("❌ Arquivo inválido"); } };
    r.readAsText(f);
  };
  $("#imp-btn").onclick = () => { try { importarEstado(decodificar($("#imp-cod").value)); } catch (err) { toast("❌ Código inválido"); } };
  $("#zerar").onclick = () => {
    if (confirm("Tem certeza? Isso apaga XP, ofensiva, conquistas e revisões.") && confirm("Última chance: apagar mesmo?")) {
      S = estadoInicial(); salvar(); aplicarTema(); toast("Progresso apagado"); ir("inicio");
    }
  };
}

/* =====================================================================
   INICIALIZAÇÃO: carrega os arquivos de conteúdo e abre o app
   ===================================================================== */
// Mostra erros de digitação nos arquivos de conteúdo (ajuda quem está editando)
window.addEventListener("error", e => {
  if (e.filename && e.filename.includes("/conteudo/")) {
    errosConteudo.push(`Erro de sintaxe em ${e.filename.split("/conteudo/")[1]} (linha ${e.lineno}): ${e.message}`);
  }
});
function carregarScript(src) {
  return new Promise(ok => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = ok;
    s.onerror = () => { errosConteudo.push(`Não consegui abrir o arquivo conteudo/${src.split("/").pop()}`); ok(); };
    document.body.appendChild(s);
  });
}
async function iniciar() {
  aplicarTema();
  const arquivos = self.ARQUIVOS_MODULOS || [];
  for (const arq of arquivos) await carregarScript("conteudo/" + arq);
  prepararConteudo();
  if (errosConteudo.length) console.warn("Problemas no conteúdo:\n" + errosConteudo.join("\n"));
  rotear();
  // PWA: funciona offline (só quando aberto por http/https, não por arquivo local)
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("Service worker não registrado:", err));
  }
}
iniciar();
</script>
