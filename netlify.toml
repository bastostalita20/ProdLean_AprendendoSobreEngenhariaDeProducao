# Configuração do Netlify (lida automaticamente quando o site está ligado ao GitHub)
# O build gera o catálogo do conteúdo (carregamento sob demanda) e copia app/ para dist/
# minificado. Sem bibliotecas no app: o esbuild é usado só aqui, no build.
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Código e catálogo: sempre revalidar, para as atualizações chegarem rápido.
# (O modo offline continua funcionando pelo service worker.)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/conteudo/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
